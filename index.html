/* ---------- v2.15：行程月曆（和風季節）、客戶檔案、電腦版各頁實心底 ----------
   月曆是一張固定深色的卡（深淺色模式一樣）：底紋跟季節（春櫻瓣、夏青海波、秋紅葉、冬細雪），季節色只用在紋樣與節氣小字；
   週六日與國定假日數字是紅色、連假底下一條紅帶；今天是米白小牌、選中的日子米白框；有行程的日子底下一顆黃點。 */
.cal{position:relative;margin:2px -4px 0;padding:10px 8px 8px;background:#1A1513;color:#DDD0B0;min-width:0;overflow:hidden}
.cal-spring{--se:#E7A6B3}
.cal-summer{--se:#7FB0D2}
.cal-autumn{--se:#E07A48}
.cal-winter{--se:#C3D2E2}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-nav{flex:none;width:34px;height:38px;border:0;background:rgba(237,225,190,.08);color:#EDE1BE;font:400 22px/1 var(--display);cursor:pointer}
.cal-nav:hover,.cal-nav:focus-visible{background:var(--red);color:var(--on-red)}
.cal-title{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.cal-season{display:inline-flex;align-items:center;gap:3px;font:900 13px/1 var(--serif);color:var(--se);align-self:center}
.cal-season svg{width:17px;height:17px;fill:var(--se);color:var(--se)}
.cal-season .core{fill:#1A1513}
.cal-title>b{font:400 28px/1 var(--display);color:#EDE1BE;letter-spacing:-.01em;white-space:nowrap}
.cal-title>b small{font:900 13px var(--serif);margin-left:2px}
.cal-wa{font:900 15px/1 var(--serif);color:#EDE1BE;letter-spacing:.06em;white-space:nowrap}
.cal-wa small{margin-left:4px;font:400 12px var(--display);color:#A89A7E;letter-spacing:.06em}
.cal-w{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font:500 11px/1 var(--sans);color:#A89A7E;text-align:center;padding-bottom:6px;border-bottom:1px solid rgba(221,208,176,.15)}
.cal-w span:first-child,.cal-w span:last-child{color:#7E7060}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:4px}
.cal-d{position:relative;min-height:46px;border:0;background:transparent;color:#DDD0B0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;cursor:pointer;min-width:0}
.cal-d:hover{background:rgba(237,225,190,.07)}
.cal-d b{font:400 16px/1 var(--display)}
.cal-d small{margin-top:3px;font:500 9.5px/1.1 var(--sans);color:var(--se);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.cal-d.we b{color:#8F806C}
.cal-d.holi b{color:#E4503F}
.cal-d.holi small{color:#F08A78}
.cal-d.past{opacity:.5}
.cal-d.run::before{content:"";position:absolute;left:0;right:-2px;bottom:1px;height:2px;background:rgba(228,80,63,.35)}
.cal-d.run-s::before{left:24%}
.cal-d.run-e::before{right:24%}
.cal-d.today b{color:#141110;background:#EDE1BE;padding:3px 4px 2px;margin-top:-3px}
.cal-d.sel{box-shadow:inset 0 0 0 2px #EDE1BE}
.cal-dot{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);min-width:6px;height:6px;border-radius:3px;background:#E8C21A;font:400 9px/6px var(--display);color:#141110;font-style:normal;text-align:center}
.cal-dot:not(:empty){min-width:13px;height:13px;border-radius:7px;font-size:10px;line-height:13px;bottom:5px}
.cal-list{margin-top:8px;padding:8px 2px 2px;border-top:1px solid rgba(221,208,176,.15)}
.cal-lh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.cal-lh b{font:400 19px/1 var(--display);color:#EDE1BE}
.cal-lh span{font-size:12.5px;color:#A89A7E}
.cal-back{margin-left:auto;border:0;background:none;color:#E4503F;font:900 12.5px var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px}
.cal-notes{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}

.cal-ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid rgba(221,208,176,.08)}

.cal-dsc{font-size:13.5px;line-height:1.45;color:#DDD0B0}
.cal-dsc small{display:block;color:#A89A7E;font-size:12px}
.cal-none{margin:6px 0 2px;font-size:13px;color:#A89A7E}
.mt-body .cal{margin:0}

.cd-h{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0}

    phase = forced || phaseNow();
    Wc = innerWidth; Hfull = innerHeight; Hc = Math.round(Hfull * SCENE); dpr = Math.min(2, devicePixelRatio || 1); u = Hc / 100;
    cv.width = Math.round(Wc * dpr); cv.height = Math.round(Hfull * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    LW = Math.ceil(Wc * 1.3 + u * 20);
    HERO = { lx: LW / 2 + (.68 - .5) * Wc, top: Hc * .5 };
    makeSky(); makeDisk();
    const p = PH();
    FAR = makeLayer({ seed: 3, w: [5, 12], h: [32, 56], col: p.far, win: p.farWin, odds: .22, winGap: 1.8, speed: 10 });
    MID = makeLayer({ seed: 11, w: [6, 14], h: [20, 42], col: p.mid, win: p.midWin, odds: .26, winGap: 2, speed: 24, tower: true, vsign: .45, roofs: true });
    NEAR = makeLayer({ seed: 29, w: [9, 20], h: [8, 24], col: COL.ink, win: COL.yel, odds: .14, winGap: 2.4, speed: 46, props: true, hero: true, vsign: .38 });
    assignCaseSigns();
    rain = Array.from({ length: Math.round(Wc / 6) }, () => [Math.random() * Wc * 1.2, Math.random() * Hc, .6 + Math.random() * .6]);
  }
  const layerX = L => -(LW - Wc) / 2 + (.5 - sx) * L.speed * u * .5 + Math.sin(t * .05) * L.speed * u * .08;

  function frame(dt) {
    t += dt;
    sx += (mx - sx) * Math.min(1, dt * 2.5); sy += (my - sy) * Math.min(1, dt * 2.5);
    const p = PH(), [tl, ts] = targetMood(), k = Math.min(1, dt * 1.6);
    wLock += (tl - wLock) * k; wStale += (ts - wStale) * k;
    g.save();
    g.fillStyle = '#0B0807'; g.fillRect(0, 0, Wc, Hfull);
    g.translate(Wc / 2, Hc / 2); g.rotate(-.035); g.scale(1.08, 1.08); g.translate(-Wc / 2, -Hc / 2);
    if (wStale > .02) g.filter = `saturate(${1 - .65 * wStale}) brightness(${1 - .2 * wStale})`;
    g.drawImage(SKY, 0, (sy - .5) * u * -2, Wc, Hc);
    const mX = .68 * Wc + (.5 - sx) * u * 2, mY = DISK.y * Hc + (.5 - sy) * u, R = DISK.R;
    g.save(); g.translate(mX, mY); g.rotate(t * .015); g.fillStyle = p.ray;
    for (let i = 0; i < 18; i += 2) { const a = i / 18 * Math.PI * 2, b = (i + 1) / 18 * Math.PI * 2, L = Wc * 1.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * L, Math.sin(a) * L); g.lineTo(Math.cos(b) * L, Math.sin(b) * L); g.fill(); }
    g.restore();
    g.drawImage(DISK.c, mX - R * 1.3, mY - R * 1.3, R * 2.6, R * 2.6);
    CLOUDS.forEach(c => { c.x += c.v * dt; cloud(c); });
    if (Math.random() < dt * .06 && !crows.length) { const y0 = Hc * (.12 + Math.random() * .25); for (let i = 0; i < 5; i++) crows.push({ x: Wc + u * 4 + i * u * (3 + Math.random() * 3), y: y0 + (i % 2 ? 1 : -1) * i * u * 1.2, s: 1.2 + Math.random() * .7, ph: Math.random() * 6, v: u * (9 + Math.random() * 3) }); }
    crows.forEach(b => { b.x -= b.v * dt; b.y += Math.sin(t * 2 + b.ph) * dt * u; crow(b); }); crows = crows.filter(b => b.x > -u * 10);
    g.drawImage(FAR.c, layerX(FAR), 0, LW, Hc + 40);
    const hz = g.createLinearGradient(0, Hc * .55, 0, Hc); hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(.5, p.haze); hz.addColorStop(1, 'rgba(0,0,0,.1)');
    g.fillStyle = hz; g.fillRect(0, Hc * .55, Wc, Hc * .45);
    const midX = layerX(MID);
    g.drawImage(MID.c, midX, 0, LW, Hc + 40);
    MID.signs.forEach(s => neon(s, midX));
    if (phase === 'night' && wStale < .7) renderHero(POSES.tower(), TOWER.x + midX + TOWER.platW * .18, TOWER.platY, Hc * .085);
    if (Math.floor(t * 1.2) % 2) { g.fillStyle = COL.redHi; g.beginPath(); g.arc(TOWER.x + midX, TOWER.y, u * .6, 0, 7); g.fill(); g.fillStyle = 'rgba(228,80,63,.25)'; g.beginPath(); g.arc(TOWER.x + midX, TOWER.y, u * 2, 0, 7); g.fill(); }
    beamsOn = wLock;
    if (beamsOn > .02) [[.2, .55, 0], [.8, .8, 2]].forEach(([bx, sp, ph]) => {
      const a = -Math.PI / 2 + Math.sin(t * sp + ph) * .5, ox = bx * Wc, oy = Hc * 1.02, L = Hc * 1.3, wv = .07;
      const gr = g.createLinearGradient(ox, oy, ox + Math.cos(a) * L, oy + Math.sin(a) * L); gr.addColorStop(0, `rgba(244,221,106,${.38 * beamsOn})`); gr.addColorStop(1, 'rgba(244,221,106,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(a - wv) * L, oy + Math.sin(a - wv) * L); g.lineTo(ox + Math.cos(a + wv) * L, oy + Math.sin(a + wv) * L); g.fill();
    });
    // 高架軌道＋電車
    const yT = Hc * .8, nx = layerX(NEAR);
    g.fillStyle = COL.ink2; g.fillRect(-u * 10, yT, Wc + u * 20, u * .9);
    for (let k = ((nx % (u * 14)) + u * 14) % (u * 14) - u * 14; k < Wc + u * 14; k += u * 14) g.fillRect(k, yT, u * .9, Hc - yT);
    const per = 18, ph = (t % per) / per, carW = u * 13, n = 6, trW = n * (carW + u * .6), tx = Wc + u * 10 - ph * (Wc + trW + u * 60);
    for (let i = 0; i < n; i++) {
      const cx = tx + i * (carW + u * .6);
      if (cx > Wc + u * 4 || cx + carW < -u * 4) continue;
      g.fillStyle = COL.ink2; g.fillRect(cx, yT - u * 3.6, carW, u * 3.4);
      g.fillStyle = wStale > .5 ? 'rgba(237,225,190,.25)' : phase === 'day' ? 'rgba(237,225,190,.55)' : 'rgba(244,221,106,.9)';
      for (let w = cx + u * 1.2; w < cx + carW - u * 1.4; w += u * 2) g.fillRect(w, yT - u * 2.8, u * 1.3, u * 1);
      if (i === 2 && phase === 'day' && wStale < .7) renderHero(POSES.day(), cx + carW * .5, yT - u * 3.6, Hc * .09);
      if (i === 0) { g.fillStyle = COL.paper; g.fillRect(cx - u * .2, yT - u * 1.6, u * .5, u * .6); const lg = g.createLinearGradient(cx, 0, cx - u * 14, 0); lg.addColorStop(0, 'rgba(255,240,200,.35)'); lg.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = lg; g.beginPath(); g.moveTo(cx, yT - u * 1.4); g.lineTo(cx - u * 14, yT - u * 3); g.lineTo(cx - u * 14, yT + u * .4); g.fill(); }
    }
    g.drawImage(NEAR.c, nx, 0, LW, Hc + 40);
    NEAR.signs.forEach(s => neon(s, nx));
    NEAR.lights.forEach(([x, y], i) => { if (Math.floor(t * .9 + i * .37) % 2) { g.fillStyle = COL.redHi; g.fillRect(x + nx - u * .4, y - u * .4, u * .8, u * .8); } });
    heroPose(nx);
    g.filter = 'none';
    if (wStale > .02) {
      g.fillStyle = `rgba(11,8,7,${.28 * wStale})`; g.fillRect(0, 0, Wc, Hc);
      g.strokeStyle = 'rgba(221,208,176,.32)'; g.lineWidth = Math.max(1, u * .14); g.beginPath();
      const nR = Math.round(rain.length * wStale);
      rain.forEach((d, i) => { if (i >= nR) return; d[1] += dt * Hc * 1.1 * d[2]; d[0] -= dt * Hc * .3 * d[2]; if (d[1] > Hc) { d[1] = -u * 4; d[0] = Math.random() * Wc * 1.25; } g.moveTo(d[0], d[1]); g.lineTo(d[0] + u * .9, d[1] - u * 3.2 * d[2]); });
      g.stroke();
    }
    const bt = g.createLinearGradient(0, Hc * .86, 0, Hc); bt.addColorStop(0, 'rgba(11,8,7,0)'); bt.addColorStop(1, 'rgba(11,8,7,.85)');
    g.fillStyle = bt; g.fillRect(0, Hc * .86, Wc, Hc * .14);
    g.restore();
    const fl = g.createLinearGradient(0, Hc * .9, 0, Hc + u * 2); fl.addColorStop(0, 'rgba(11,8,7,0)'); fl.addColorStop(1, '#0B0807');
    g.fillStyle = fl; g.fillRect(0, Hc * .9, Wc, Hc * .1 + u * 2); g.fillStyle = '#0B0807'; g.fillRect(0, Hc + u * 2, Wc, Hfull);
  }

  /* 迴圈：每秒 30 格（背景不需要更多）；分頁看不見時不畫；減少動態時每秒只畫一張不動的；斬殺演出時凍結 */
  let last = performance.now(), acc = 0, frozen = false, raf = 0;
  function loop(now) {
    raf = 0; if (!cv) return;
    const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt;
    if (acc >= (calm.matches ? 1 : 1 / 30 - .002) && !document.hidden && !frozen) { frame(calm.matches ? 0 : acc); acc = 0; }
    raf = requestAnimationFrame(loop);
  }
  addEventListener('resize', () => { if (cv) { build(); frame(0); } });
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; });

  /* ============ 結案演出：斬 ============ */
  let busy = false;
  function slash(label) {
    if (busy) return; busy = true;
    const lite = !cv, cutEl = document.getElementById('cut');
    cutEl.classList.toggle('lite', lite); document.getElementById('who').textContent = label || '';
    const W = innerWidth, H = innerHeight, y0 = .63, y1 = .37;
    const dy = (y1 - y0) * H, len = Math.hypot(W, dy), ang = Math.atan2(dy, W);
    const d = [W / len, dy / len], n = [-d[1], d[0]];            // d：刀的方向；n：垂直刀痕、往右下
    const gap = H * .12, slide = H * .035;
    const snap = poly => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.getContext('2d').drawImage(cv, 0, 0); c.className = 'half'; c.style.clipPath = poly; document.body.append(c); return c; };
    const top = lite ? null : snap(`polygon(0 0,100% 0,100% ${y1 * 100}%,0 ${y0 * 100}%)`), bot = lite ? null : snap(`polygon(0 ${y0 * 100}%,100% ${y1 * 100}%,100% 100%,0 100%)`);
    const quick = calm.matches, EZ = 'cubic-bezier(.2,0,0,1)', ez = ks => ks.map(k => ({ easing: EZ, ...k }));
    const word = document.getElementById('word'), who = document.getElementById('who'), rot = document.getElementById('cutRot');
    rot.style.setProperty('--a', ang + 'rad');
    if (!quick) {
      frozen = !lite; document.body.classList.add(lite ? 'slashing-lite' : 'slashing');
      // 1. 白光劃過
      const st = document.getElementById('streak'); st.style.width = len + 'px'; st.style.transform = `translate(0,${y0 * H}px) rotate(${ang}rad)`;
      st.firstElementChild.animate([{ transform: 'scaleX(0)', opacity: 1, height: '6px' }, { transform: 'scaleX(1)', opacity: 1, height: '6px', offset: .25 }, { transform: 'scaleX(1)', opacity: 0, height: '1px' }], { duration: 420, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' });
      document.getElementById('flash').animate([{ opacity: 0 }, { opacity: .85, offset: .3 }, { opacity: 0 }], { duration: 260, delay: 95 });
      // 2. 城市裂開往兩邊錯
      const mv = k => `translate(${n[0] * gap * k + d[0] * slide * k}px,${n[1] * gap * k + d[1] * slide * k}px)`;
      const half = (el, k) => el.animate(ez([{ transform: 'none' }, { transform: mv(k * 1.15), offset: .1 }, { transform: mv(k), offset: .18 }, { transform: mv(k * 1.03), offset: .74 }, { transform: 'none', offset: .9 }, { transform: 'none' }]), { duration: 2700, delay: 100, fill: 'both' });
      if (!lite) { half(top, -1); half(bot, 1); }
      else cutEl.querySelector('.band').animate(ez([{ transform: 'scaleX(0)', opacity: 1 }, { transform: 'scaleX(1)', opacity: 1, offset: .12 }, { transform: 'scaleX(1)', opacity: 1, offset: .82 }, { transform: 'scaleX(1)', opacity: 0 }]), { duration: 2600, delay: 100, fill: 'both' });
      // 3. 碎片
      for (let i = 0; i < 16; i++) {
        const f = .06 + Math.random() * .88, x = f * W, y = (y0 + (y1 - y0) * f) * H, side = Math.random() < .5 ? -1 : 1, s = 8 + Math.random() * 26;
        const el = document.createElement('i'); el.className = 'shard';
        el.style.cssText = `left:${x}px;top:${y}px;--s:${s}px;background:${['#EDE1BE', '#0B0807', '#E4503F', '#FFF4E0'][i % 4]};clip-path:polygon(${Math.random() * 40}% 0,100% ${Math.random() * 60}%,${Math.random() * 50}% 100%)`;
        document.body.append(el);
        const dist = 60 + Math.random() * 220;
        el.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${n[0] * dist * side + d[0] * (Math.random() - .3) * 160}px,${n[1] * dist * side + 40}px) rotate(${(Math.random() - .5) * 720}deg)`, opacity: 0 }], { duration: 700 + Math.random() * 400, delay: 100, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'both' }).onfinish = () => el.remove();
      }
    }
    // 4. 「完 CLEAR」蓋在裂口上，再補一刀錯位
    word.animate(ez([{ opacity: 0, transform: 'scale(1.9)' }, { opacity: 1, transform: 'scale(.95)', offset: .07 }, { opacity: 1, transform: 'scale(1)', offset: .12 }, { opacity: 1, transform: 'scale(1)', offset: .82 }, { opacity: 0, transform: 'scale(1.04)' }]), { duration: 2350, delay: quick ? 0 : 300, fill: 'both' });
    who.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none', offset: .15 }, { opacity: 1, offset: .82 }, { opacity: 0 }], { duration: 2250, delay: quick ? 0 : 420, fill: 'both' });
    if (!quick) {
      document.getElementById('wstreak').animate([{ transform: 'scaleX(0) rotate(-3deg)', opacity: 1 }, { transform: 'scaleX(1) rotate(-3deg)', opacity: 1, offset: .3 }, { transform: 'scaleX(1) rotate(-3deg)', opacity: 0 }], { duration: 300, delay: 950, fill: 'both' });
      word.querySelector('.w1').animate([{ transform: 'none' }, { transform: 'translate(10px,-4px) skewX(-6deg)', offset: .12 }, { transform: 'translate(-3px,1px)', offset: .3 }, { transform: 'none' }], { duration: 420, delay: 1000 });
    }
    setTimeout(() => {
      top?.remove(); bot?.remove(); document.body.classList.remove('slashing', 'slashing-lite'); frozen = false; busy = false;
      document.getAnimations().forEach(a => { if (a.effect && a.effect.target && a.effect.target.closest && a.effect.target.closest('#cut')) a.cancel(); });
      if (cv) frame(0);
    }, quick ? 2400 : 2850);
  }


  let shown = '';
  function mount() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.id = 'city'; cv.setAttribute('aria-hidden', 'true');
    document.body.prepend(cv); g = cv.getContext('2d');
    build(); frame(0); last = performance.now(); raf = requestAnimationFrame(loop);
  }
  function unmount() { if (!cv) return; cancelAnimationFrame(raf); raf = 0; cv.remove(); cv = g = null; }
  /* list：[{ id, name, st: 'lock'|'stale'|'idle' }]，最多六件 */
  function setCases(list) {
    const key = JSON.stringify(list);
    if (key === shown) return; shown = key;
    const fid = focus !== null && CASES[focus] ? CASES[focus].id : null;
    CASES = list.slice(0, 6); focus = fid ? CASES.findIndex(c => c.id === fid) : null; if (focus < 0) focus = null;
    if (cv) assignCaseSigns();
  }
  function setView(v) { if (v.left === VIEW.left && v.right === VIEW.right) return; VIEW = v; if (cv) assignCaseSigns(); }
  function setFocus(id) { const i = id ? CASES.findIndex(c => c.id === id) : -1; focus = i < 0 ? null : i; }
  setInterval(() => { if (cv && !forced && phaseNow() !== phase) build(); }, 60000);
  return { mount, unmount, setCases, setFocus, setView, slash, force: p => { forced = p; if (cv) { build(); frame(0); } }, get on() { return !!cv; } };
})();
</script>

<script>
/* 工作日誌前端。資料來自 getState()；每個動作先在畫面上立即反映，再送到伺服器，回來後用伺服器的資料重畫。 */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS = ['日誌','業務','諮詢'];
const B = (label, cls='', attrs='') => `<button class="btn ${cls}" ${attrs}><span>${label}</span></button>`;
const QUEUE_KEY = 'worklog-queue';
const pad = n => String(n).padStart(2,'0');
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

const S = { view:'home', homeTab:'today', clientId:null, q:'', anim:true, flash:[], bump:[], adv:null, justClosed:null, nc:{a:null,p:null},
  f:{status:'全部',action:'全部',product:'全部'}, busy:0, ready:false, later:{}, realId:{}, pstep:'', confirmQ:[], ncItem:null, sheetCase:null, back:null };
const STATE_KEY = 'worklog-state', TOKEN_KEY = 'worklog-key';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} },
};
function load(state){
  Object.assign(S, state, state.settings); S.today = state.now.slice(0,10); S.ready = true;
  store.set(STATE_KEY, JSON.stringify(state));   // 下次打開先用這份秒開，再向伺服器更新
}

/* 伺服器呼叫：GitHub Pages 上用 fetch 帶金鑰呼叫 Apps Script。text/plain 不會觸發 CORS 預檢。 */
function call(fn, ...args){
  const k = store.get(TOKEN_KEY);
  if (!k) return Promise.reject(new Error('AUTH:還沒設定金鑰'));
  S.busy++; syncTag();
  return fetch(window.WORKLOG_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ k, fn, args }) })
    .then(r => r.json())
    .then(o => { if (!o.ok) throw new Error(o.error); return o.data; })
    .finally(() => { S.busy--; syncTag(); });
}
function syncTag(){ const el = document.getElementById('sync'); if (el) el.hidden = S.busy === 0; }
function isAuth(e){ return String(e && e.message || e).startsWith('AUTH:'); }
/* 伺服器操作一個接一個送（同時送的話，先送的可能晚回來，把畫面蓋回舊的）；全部回來才用伺服器的資料重畫 */
let chain = Promise.resolve(), inflight = 0;
function server(fn, ...args){
  inflight++;
  const p = chain.then(async () => {
    try { load(await call(fn, ...args)); }
    catch (e) {
      if (isAuth(e)) { inflight = 0; keyScreen(e.message.slice(5)); return; }
      toast('沒存到：' + (e && e.message ? e.message : '請稍後再試'));
      try { load(await call('getState')); } catch (_) {}
    } finally { inflight = Math.max(0, inflight - 1); }
    if (inflight === 0) render();
  });
  chain = p.catch(() => {});
  return p;
}
/* 對某筆紀錄送出操作。剛記下、伺服器還沒回來的紀錄（tmp）先排隊，等 addRecord 回來換成真的 id 再補送。 */
function serverItem(it, fn, ...rest){
  const real = S.realId[it.id];
  if (it.tmp && !real) { (S.later[it.tmp] = S.later[it.tmp] || []).push({ n: it.n, fn, rest }); return; }
  server(fn, real || it.id, ...rest);
}
/* 剛記下的紀錄在伺服器回來後會換成新的物件，用這個找到畫面上現在那一份 */
const live = it => S.items.find(i => i.id === it.id || i.id === S.realId[it.id]) || it;
/* 找紀錄；更新進度這類剛建立、還沒有真 id 的，請使用者稍等 */
function itemFor(id){
  const it = S.items.find(i => i.id === id);
  if (it && String(it.id).startsWith('tmp') && !it.tmp) { toast('還在存，等一下再試'); return null; }
  return it || null;
}

/* 金鑰設定：第一次打開，或金鑰不對時出現。金鑰在試算表「設定」分頁的「金鑰」那一列。 */
function keyScreen(msg){
  S.ready = false;
  document.getElementById('view').innerHTML = `<section class="band page"><div class="wrap">
    ${ransom('設定金鑰','',true)}
    <p class="lead">${esc(msg || '第一次使用，請貼上金鑰。之後這台裝置會記住。')}<br>金鑰在 Google 試算表「工作日誌」的「設定」分頁，類型是「系統」、名稱是「金鑰」那一列。</p>
    <form id="keyForm" class="bubble"><div class="bubble-in"><div class="dlg"><label for="keyInput" class="sr">金鑰</label>
      <textarea id="keyInput" style="min-height:64px" placeholder="貼上金鑰" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="cap-foot"><span class="off">只存在這台裝置上</span>${B('連線','','type="submit"')}</div></div></div></form>
  </div></section>`;
  document.getElementById('nav').innerHTML = '';
}
async function boot(){
  const cached = store.get(STATE_KEY);
  if (cached) { try { load(JSON.parse(cached)); render(); } catch (e) {} }
  if (!store.get(TOKEN_KEY)) { keyScreen(); return; }
  if (!cached) document.getElementById('view').innerHTML = `<section class="band mast"><div class="wrap">${ransom('潛入中……','',true)}</div></section>`;
  try { load(await call('getState')); S.anim = !cached; render(); flushQueue(); showBrief(); }
  catch (e) { if (isAuth(e)) keyScreen(e.message.slice(5)); else if (!cached) keyScreen('連不上資料服務，請確認網路後再試。'); else toast('目前離線，顯示上次的資料'); }
}

/* ---------- 離線暫存 ---------- */
function readQueue(){ try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function writeQueue(q){ try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
let flushing = false;
async function flushQueue(){
  if (flushing || !navigator.onLine) return;
  const q = readQueue(); if (!q.length) return;
  flushing = true;
  let sent = 0;
  for (const rec of q) {
    try { load(await call('addRecord', rec.sendId, rec.text, rec.time)); sent++; writeQueue(readQueue().filter(r => r.sendId !== rec.sendId)); }
    catch (e) { break; }
  }
  flushing = false;
  if (sent) { render(); toast(`恢復連線，補送 ${sent} 筆`); }
}
addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flushQueue(); if (!document.querySelector('.sheet')) showBrief(); } });

/* 剪報標題：逐字換樣式，相鄰字不重複 */
function ransom(text, cls='', anim=false){
  let i = 0, prev = -1;
  const spans = [...text].map(ch => {
    if (ch === ' ') return ' ';
    const h = (ch.charCodeAt(0) * 31 + i * 17 + 7) % 97;
    let v = (h + i) % 4; if (v === prev) v = (v + 1) % 4; prev = v;
    const r = (h % 7) - 3, y = ((h >> 2) % 3) - 1;
    const lat = /[0-9A-Za-z]/.test(ch) ? ' lat' : '';
    return `<span class="rn r${v}${lat}" style="--r:${r}deg;--y:${y}px;--d:${(S.animDelay||0)+(i++)*28}ms">${esc(ch)}</span>`;
  }).join('');
  const tag = cls.includes('md') ? 'h2' : 'h1';
  return `<${tag} class="ransom ${cls}${anim?' anim':''}" aria-label="${esc(text)}"><span aria-hidden="true">${spans}</span></${tag}>`;
}

}

/* 快記的剪報字：輸入框照常運作（輸入法、游標、選取都不變），字本身藏起來，上面疊一層完全對齊的剪報字。
   只把認得的關鍵字做成色塊：客戶名稱＝黃紙、業務關鍵字＝朱紅，其他字保持整齊米白。
   色塊只換底色、不改字寬，才能跟底下的游標對齊；關鍵字第一次被認出來時彈一下。選字（組字）時暫時顯示一般文字。 */
let mirrorPrev = '', seenKeys = new Set();
function keywordMarks(v){
  const marks = new Array(v.length).fill(''), keys = new Set();
  const mark = (word, cls) => { if (!word) return; let at = v.indexOf(word);
    while (at >= 0) { if (marks.slice(at, at + word.length).every(x => !x)) { for (let j = at; j < at + word.length; j++) marks[j] = cls; keys.add(cls + ':' + at + ':' + word); } at = v.indexOf(word, at + word.length); } };
  // 長的先標，避免「國立屏東高級中學」被「屏中」之類的短詞切開
  const clientWords = S.clients.flatMap(c => [c.name, ...c.alias]).filter(Boolean).sort((a, b) => b.length - a.length);
  clientWords.forEach(w => mark(w, 't-paper'));
  [...(S.kwBiz || []), ...(S.steps || [])].filter(Boolean).sort((a, b) => b.length - a.length).forEach(w => mark(w, 't-red'));
  return { marks, keys };
}
function syncMirror(animate, force){
  const ta = document.getElementById('cap'), m = document.getElementById('capMirror'); if (!ta || !m) return;
  const v = ta.value;
  // 內容沒變就不重畫（重畫會把正在播的貼上動畫切掉），只移動游標
  if (!force && !cmp && v === mirrorPrev) { placeCaret(); return; }
  const { marks, keys } = keywordMarks(v);
  const fresh = new Set();
  if (animate) keys.forEach(k => { if (!seenKeys.has(k)) { const [, at, w] = k.split(':'); for (let j = +at; j < +at + w.length; j++) fresh.add(j); } });
  seenKeys = keys;
  // 剛打進來的字（選字完成或直接輸入，一次最多 4 個字；大段貼上不跑動畫）：像剪報字貼上去
  let bornFrom = -1, bornTo = -1;
  if (animate && !cmp) {
    const old = mirrorPrev;
    let p = 0; while (p < v.length && p < old.length && v[p] === old[p]) p++;
    let q = 0; while (q < v.length - p && q < old.length - p && v[v.length-1-q] === old[old.length-1-q]) q++;
    if (v.length - q - p <= 4) { bornFrom = p; bornTo = v.length - q; }
  }
  let html = '';
  for (let i = 0; i < v.length; i++) {
    // 組字中（注音還沒選字）：一個米白框框，注音寫在裡面，框框依打了幾個注音從底部填滿（--g 0～1）
    if (cmp && i === cmp.start && cmp.len) {
      const zy = v.slice(cmp.start, cmp.start + cmp.len), g = Math.min(cmp.len / 3, 1);
      html += `<span class="cmp" data-i="${i}" style="--g:${g}"><b class="zy">${esc(zy)}</b></span>`;
      i += cmp.len - 1; continue;
    }
    const ch = v[i];
    if (ch === '\n') { html += `<br data-i="${i}">`; continue; }
    if (ch === ' ') { html += `<span class="s" data-i="${i}"> </span>`; continue; }
    const tile = marks[i] ? ' ' + marks[i] : '';
    const han = marks[i] && /\p{Script=Han}/u.test(ch) ? ' han' : '';
    const fx = fresh.has(i) ? ' pop' : (!marks[i] && i >= bornFrom && i < bornTo ? ' paste' : '');
    const tilt = ((ch.charCodeAt(0) * 7 + i * 13) % 11) - 5;
    html += `<span class="ch${tile}${han}${fx}" data-i="${i}" style="--t:${tilt}deg">${esc(ch)}</span>`;
  }
  m.innerHTML = html + (v.endsWith('\n') ? '&nbsp;' : '');
  mirrorPrev = v;
  ta.style.height = '0px'; ta.style.height = Math.max(ta.scrollHeight, ta.closest('.dk-cap') ? 66 : ta.closest('.m-cap') ? 84 : 112) + 'px';
  placeCaret();
}
/* 游標：閃爍的米白空格，插在下一個字的位置；有選取範圍、組字中或沒在輸入時不顯示 */
function placeCaret(){
  const ta = document.getElementById('cap'), m = document.getElementById('capMirror'); if (!ta || !m) return;
  let c = m.querySelector('.caret');
  if (!c) { c = document.createElement('i'); c.className = 'caret'; }
  c.hidden = !(document.activeElement === ta && ta.selectionStart === ta.selectionEnd && !cmp);
  const before = m.querySelector(`[data-i="${ta.selectionStart}"]`);
  if (before) m.insertBefore(c, before); else m.append(c);
  // 上層是不透明的（蓋住 iPhone 組字的藍色底線），所以選取反白由這裡自己畫
  const a = ta.selectionStart, b = ta.selectionEnd;
  m.querySelectorAll('[data-i]').forEach(el => { const i = +el.dataset.i; el.classList.toggle('sel', a !== b && i >= a && i < b); });
}
document.addEventListener('selectionchange', () => { if (document.activeElement && document.activeElement.id === 'cap') placeCaret(); });
['focusin', 'focusout', 'click', 'keyup'].forEach(t => document.addEventListener(t, e => { if (e.target.id === 'cap') setTimeout(placeCaret); }));
let cmp = null;   // 組字中的範圍 { start, len }
// 選字完成時，拿「組字開始前的內容」當比對基準，剛選進來的字才會被當成新字貼上去
let preCmp = '';
document.addEventListener('compositionstart', e => { if (e.target.id === 'cap') { preCmp = e.target.value; cmp = { start: e.target.selectionStart, len: 0 }; } });
document.addEventListener('compositionupdate', e => { if (e.target.id === 'cap' && cmp) { cmp.len = (e.data || '').length; requestAnimationFrame(() => syncMirror(false, true)); } });
document.addEventListener('compositionend', e => { if (e.target.id === 'cap') { cmp = null; mirrorPrev = preCmp; syncMirror(true); } });

/* ---------- 背景城市（電腦版） ----------
   進行中的案件交給城市當霓虹招牌：缺件優先、再來是太久沒動、其他依多久沒動排，最多六件；招牌寫客戶簡稱（四個字內）。
   滑鼠移到任何一件案件（委託卡、右欄卡、開場清單）上，城市換成那件的氣氛；打開進度頁時固定在那件。 */
function cityCases(){
  return S.cases.filter(k => k.status !== '已結案').map(k => { const d = daysSince(k.updated);
      return { id: k.id, name: [...(nick(client(k.client)) || '案件')].slice(0, 4).join(''), st: /缺件/.test(k.progress) ? 'lock' : d > 14 ? 'stale' : 'idle', d }; })
    .sort((a, b) => (b.st === 'lock') - (a.st === 'lock') || (b.st === 'stale') - (a.st === 'stale') || b.d - a.d)
    .slice(0, 6).map(({ d, ...c }) => c);
}
function syncCity(){

function itemActs(it){

/* 業務＝委託清單：一件一張有厚度的卡紙，左邊凸出的墨色方塊寫「一個字＋英文」代表目前的階段（像「完 CLEAR」），

const STAGE_MARK = { '處理中': ['辦', 'ACTIVE'], '已傳送申請書給客戶': ['送', 'SENT'], '缺件': ['缺', 'MISSING'], '已通知客戶補件': ['催', 'NOTIFIED'],
  '客戶已補件': ['補', 'RECEIVED'], '已送受理': ['受', 'FILED'], '完成／開通': ['完', 'CLEAR'] };
const stageMark = k => k.status==='已結案' ? ['完', 'CLEAR'] : STAGE_MARK[k.progress] || [[...shortStep(k.progress)][0] || '辦', 'STAGE'];
function questHTML(k){
  const c = client(k.client), fin = k.status==='已結案', d = daysSince(k.updated), [mk, en] = stageMark(k);
  const last = S.items.filter(i => i.case===k.id && progParts(i.text).note).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];

  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };

/* 週報＝雜誌編排：刊頭（WEEKLY＋第幾週）→ 本週數字（大數字）→ 主欄「業務」專題（客戶名大字、動作・產品、狀態標籤）
   ＋側欄「諮詢」問答引言與「下週要追」核取清單。週報內容是排程寫的純文字（# 標題＋一行一件），在這裡拆開排版；
   認不得的段落照原文列出，不會漏。 */
function parseWeek(body){
  const secs = []; let cur = null;
  String(body || '').split('\n').forEach(l => { l = l.trim(); if (!l) return;
    if (l.startsWith('# ')) { cur = { h: l.slice(2).trim(), lines: [] }; secs.push(cur); return; }
    if (!cur) { cur = { h: '', lines: [] }; secs.push(cur); }
    cur.lines.push(l.replace(/^[-・•*]\s*/, '')); });
  return secs;
}
function weekHTML(){
  const w = S.weekly;
  const top = `<div class="wk-tabs">${tabs('week')}</div>`;
  if (!w) return `<section class="band wk"><div class="wrap">${top}<div class="wk-paper"><p class="wk-none">第一份週報會在週五 17:30 整理時產生。</p></div></div></section>`;
  const secs = parseWeek(w.body), pick = re => secs.find(s => re.test(s.h));
  const biz = pick(/業務/), ask = pick(/諮詢/), next = pick(/下週|要追/), sum = pick(/這週|本週|統計|數字/);
  const rest = secs.filter(s => ![biz, ask, next, sum].includes(s));
  const sumText = sum ? sum.lines.join(' ') : '', num = re => (re.exec(sumText) || [])[1];
  const stats = [['紀錄', num(/紀錄\s*(\d+)/), '筆'], ['新案件', num(/新案件\s*(\d+)/), '件'], ['結案', num(/結案\s*(\d+)/), '件'],
    ['諮詢', ask ? String(ask.lines.length) : null, '通']].filter(s => s[1] != null);

    return m ? `<li class="wk-biz"><b>${esc(m[1])}</b><span class="wk-kind">${esc(m[2])}</span><span class="wk-st">${esc(m[3])}</span></li>` : `<li class="wk-biz"><span class="wk-st">${esc(l)}</span></li>`; };
  const askRow = l => { const m = /^(\S+)\s+(.+)$/.exec(l);
    return `<li class="wk-q">${m ? `<b>${esc(m[1])}</b><q>${esc(m[2])}</q>` : `<q>${esc(l)}</q>`}</li>`; };
  const sec = (no, title, en, body) => `<section class="wk-sec"><h3 class="wk-h"><span class="wk-no">${no}</span>${esc(title)}<small>${en}</small></h3>${body}</section>`;

    <header class="wk-mast"><span class="wk-brand">WEEKLY</span><span class="wk-issue"><small>第</small><b>${esc(w.week)}</b><small>週</small></span>
      <span class="wk-tag">工作日誌・本週報告</span></header>
    ${stats.length ? `<div class="wk-stats">${stats.map(([l, v, u]) => `<div><b>${esc(v)}</b><span>${l}<small>${u}</small></span></div>`).join('')}</div>` : ''}

        ${rest.map(s => sec(n(), s.h || '其他', 'NOTES', `<ul class="wk-plain">${s.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`)).join('')}</div>

        ${next ? sec(n(), next.h, 'NEXT WEEK', `<ul class="wk-next">${next.lines.map(l => `<li><i aria-hidden="true"></i>${esc(l)}</li>`).join('')}</ul>`) : ''}</aside>

/* ---------- 客戶 ----------
   列表＝客戶檔案卡：名稱大字＋簡稱牌、進行中／等待中／結案三個數字、最後一次往來的日期與內容；有缺件的掛黃標。
   依最後往來排（最近的在前），上面可以搜尋、篩選「有案件在跑／還沒有案件」、新增客戶。 */
const mdw = ds => { const [y, m, d] = ds.split('-').map(Number); return `${m}/${d}（${'日一二三四五六'[new Date(y, m - 1, d).getDay()]}）`; };
function clientStats(c){
  const ks = S.cases.filter(k => k.client===c.id), its = S.items.filter(i => i.client===c.id);
  const last = its.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))[0];
  return { ks, its, last, open: ks.filter(k => k.status==='進行中').length, wait: ks.filter(k => k.status==='等待中').length,
    done: ks.filter(k => k.status==='已結案').length, lock: ks.some(k => k.status!=='已結案' && /缺件/.test(k.progress)) };
}
function renderClients(){
  if (S.clientId && client(S.clientId)) return renderClient(client(S.clientId));

    .filter(({ c }) => !q || c.name.includes(q) || c.alias.some(a => a.includes(q)) || String(c.phone).includes(q) || String(c.contact || '').includes(q))
    .filter(({ s }) => f==='all' || (f==='live' ? s.open + s.wait > 0 : s.ks.length===0))
    .sort((a, b) => ((b.s.last ? b.s.last.date + b.s.last.time : '') || '').localeCompare((a.s.last ? a.s.last.date + a.s.last.time : '') || '') || a.c.name.localeCompare(b.c.name));

  const lastLine = (h, cl) => { const pp = progParts(h.text), note = bare(pp.note, cl); return esc(pp.step ? pp.step + (pp.note ? '：' + note : '') : note); };

    <div class="frow cl-filter" role="group" aria-label="篩選">${chip('all','全部')}${chip('live','有案件在跑')}${chip('none','還沒有案件')}</div>
    ${rows.length ? `<div class="cr-list">${group('有案件在跑', live)}${group(f==='live' ? '' : '其他客戶', other)}</div>`
      : `<p class="lead">${S.clients.length ? '找不到符合的客戶' : '還沒有客戶。按「＋ 新增客戶」，或記錄裡出現新的客戶名稱時，會先到「待確認」讓你建立。'}</p>`}

/* 導覽換頁：星芒從點的按鈕炸開 → 蓋滿時換頁、網點與星星碎片進場、頁面圖示彈出 → 停一下 → 一起縮回（約 0.75 秒）。
   換頁發生在星芒蓋滿的時候，所以新頁的剪報標題延後到星芒縮回才開始動（animDelay）。 */
let navBusy = false;
async function navTo(view, btn){
  const go = (delay) => { if (view==='week') { S.view='home'; S.homeTab='week'; } else { S.view = view; if (view==='home') S.homeTab='today'; } S.clientId = null; S.anim = true; S.animDelay = delay; render(); scrollTo(0,0); };
  if (navBusy) return;
  if (navCurrent(view) && !S.clientId) return;
  // 手機不放全螢幕星芒（換頁要快、省電），直接換頁＋淡入
  if (!DESK() || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) { go(0); return; }
  navBusy = true;
  const label = (navItems().find(n => n[0] === view) || [])[1];
  const fx = document.getElementById('fx');
  const r = btn.getBoundingClientRect(), ox = r.left + r.width/2, oy = r.top + r.height/2;
  const anim = (el, kf, opt) => el.animate(kf, { duration:300, easing:'cubic-bezier(.2,0,0,1)', fill:'both', ...opt }).finished;
  const star = cls => { const d = document.createElement('div'); d.className = 'star ' + cls; d.style.left = ox+'px'; d.style.top = oy+'px'; fx.append(d); return d; };
  fx.innerHTML = '';
  const ink = star('ink'), red = star('');
  const dots = document.createElement('div'); dots.className = 'layer dots'; fx.append(dots);
  const bits = document.createElement('div'); bits.className = 'layer bits'; bits.innerHTML = '<i></i>'.repeat(8); fx.append(bits);
  const badge = document.createElement('div'); badge.className = 'badge'; badge.innerHTML = (ICONS[label] || '') + `<b>${esc(label)}</b>`; fx.append(badge);
  const big = Math.hypot(innerWidth, innerHeight) / 13, IN = 260, HOLD = 160, OUT = 220;
  const guard = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500));
  try { await Promise.race([guard, (async () => {
    // 1. 炸開（深色那層慢半拍，做出厚度）
    await Promise.all([
      anim(red, [{transform:'translate(-50%,-50%) scale(0) rotate(0)'}, {transform:`translate(-50%,-50%) scale(${big}) rotate(40deg)`}], {duration:280}),
      anim(ink, [{transform:'translate(-50%,-50%) scale(0) rotate(0)'}, {transform:`translate(-50%,-50%) scale(${big*.92}) rotate(26deg)`}], {duration:280, delay:50})]);
    go(IN + HOLD + OUT);
    // 2. 網點淡入、星星碎片往外炸、圖示彈出
    anim(dots, [{opacity:0}, {opacity:1}], {duration:160});
    bits.style.opacity = 1;
    [...bits.children].forEach((b, i) => { const a = i/8*Math.PI*2 + .3, d = 110 + (i%3)*40, x = Math.cos(a), y = Math.sin(a);
      anim(b, [{transform:'translate(-50%,-50%) scale(0) rotate(0)'},
               {transform:`translate(calc(-50% + ${x*d}px),calc(-50% + ${y*d}px)) scale(1) rotate(${120+i*20}deg)`, offset:.6},
               {transform:`translate(calc(-50% + ${x*(d+18)}px),calc(-50% + ${y*(d+18)}px)) scale(.8) rotate(${160+i*20}deg)`}], {duration:IN+HOLD, delay:i*12}); });
    await anim(badge, [{transform:'translate(-50%,-50%) scale(0) rotate(-30deg)'}, {transform:'translate(-50%,-50%) scale(1.12) rotate(4deg)', offset:.7}, {transform:'translate(-50%,-50%) scale(1) rotate(-3deg)'}],
      {duration:IN, easing:'cubic-bezier(.175,.885,.32,1.275)'});
    await new Promise(r => setTimeout(r, HOLD));
    // 3. 一起縮回（離場比進場快）
    [dots, bits].forEach(el => anim(el, [{opacity:1}, {opacity:0}], {duration:120}));
    await Promise.all([
      anim(badge, [{transform:'translate(-50%,-50%) scale(1) rotate(-3deg)'}, {transform:'translate(-50%,-50%) scale(0) rotate(25deg)'}], {duration:180, easing:'cubic-bezier(.3,0,1,1)'}),
      anim(red, [{transform:`translate(-50%,-50%) scale(${big}) rotate(40deg)`}, {transform:'translate(-50%,-50%) scale(0) rotate(90deg)'}], {duration:OUT, easing:'cubic-bezier(.3,0,1,1)', delay:30}),
      anim(ink, [{transform:`translate(-50%,-50%) scale(${big*.92}) rotate(26deg)`}, {transform:'translate(-50%,-50%) scale(0) rotate(70deg)'}], {duration:OUT-20, easing:'cubic-bezier(.3,0,1,1)'})]);
  })()]); } catch (e) { /* 逾時就直接收掉 */ } finally {
    if (S.view !== view) go(0);
    fx.innerHTML = ''; navBusy = false;
  }
}

/* 今日作戰簡報：每天第一次打開跳出還沒結案的案件（一天一次，記在這台裝置），最急的排最前面；點一列直接打開那件的進度 */
const BRIEF_KEY = 'worklog-brief';
function showBrief(force){
  if (!S.ready) return;
  const day = stamp(new Date()).slice(0, 10);
  if (!force && store.get(BRIEF_KEY) === day) return;
  const open = S.cases.filter(k => k.status !== '已結案');
  if (!open.length && !force) return;
  store.set(BRIEF_KEY, day);
  const old = k => daysSince(k.updated) > 14, lack = k => /缺件/.test(k.progress);
  const byAge = (a, b) => daysSince(b.updated) - daysSince(a.updated);
  const groups = [
    ['超過 14 天沒動', 'hot', open.filter(old)],
    ['缺件中', 'warn', open.filter(k => !old(k) && lack(k))],
    ['要你推進', '', open.filter(k => !old(k) && !lack(k) && k.status === '進行中')],
    ['等回覆', 'soft', open.filter(k => !old(k) && !lack(k) && k.status === '等待中')],
  ].map(([t, cls, list]) => [t, cls, list.sort(byAge)]);
  const row = (k, cls) => { const c = client(k.client), d = daysSince(k.updated);
    return `<button class="brief-row ${cls}" data-prog="${k.id}"><span class="b-who">${plate(c)}<small>${esc(k.action)}・${esc(k.product)}</small></span>
      <span class="b-step">${esc(shortStep(k.progress))}</span><span class="b-age">${d === 0 ? '<em>今天</em>' : `<b>${d}</b>天`}</span></button>`; };
  const [n] = [new Date()], wd = '日一二三四五六'[n.getDay()];
  const todaySch = S.sched.filter(x => x.day === '今天');
  if (DESK()) { briefStage(groups.flatMap(g => g[2]), todaySch); return; }
  sheet(`<h3>今日作戰簡報・${n.getMonth() + 1}/${n.getDate()}（${wd}）</h3>
    <div class="brief-sum">${groups.slice(0, 2).concat([groups[3]]).map(([t, cls, l]) => `<span class="${cls}"><b>${l.length}</b>${t.replace(" 沒動", "")}</span>`).join('')}</div>
    ${open.length ? groups.filter(g => g[2].length).map(([t, cls, l]) => `<h4>${t}<span>${l.length} 件</span></h4>${l.map(k => row(k, cls)).join('')}`).join('')
      : '<p>沒有未結案的案件。</p>'}
    ${todaySch.length ? `<h4>今天的行程</h4>${todaySch.map(x => `<div class="brief-sch">${tstamp(x.t)}<span>${esc(x.d)}</span></div>`).join('')}` : ''}
    <div class="sheet-foot">${B('開始作戰','','data-close')}</div>`);

document.addEventListener('submit', e => {
  if (e.target.id === 'keyForm') {
    e.preventDefault();
    const v = document.getElementById('keyInput').value.trim(); if (!v) return;
    store.set(TOKEN_KEY, v); S.anim = true; boot(); return;
  }
  if (e.target.id !== 'capForm') return; e.preventDefault();
  const ta = document.getElementById('cap'), text = ta.value.trim(); if (!text) { ta.focus(); return; }
  const rec = { sendId: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7), text, time: stamp(new Date()) };
  const segs = roughSplit(text);
  S.clearDraft = true;
  if (!navigator.onLine) { writeQueue([...readQueue(), rec]); render(); toast('沒有網路，先存在這台裝置'); return; }
  segs.forEach((s,n) => S.items.push({id:'tmp'+Date.now()+n, tmp:rec.sendId, n, date:S.today, time:rec.time.slice(11), cat:s.cat, client:s.client, text:s.text, source:'暫分', fresh:true}));
  S.flash = S.bump = [...new Set(segs.map(s=>s.cat))];
  const mine = S.items.filter(i => i.tmp === rec.sendId);
  render();
  S.confirmQ = mine.filter(i => i.cat==='業務');
  if (S.confirmQ.length) setTimeout(nextConfirm, 380);
  document.getElementById('sfx')?.classList.add('go');
  toast(`分進 ${segs.length} 格`);
  if (!S.confirmQ.length) setTimeout(() => document.querySelector('.today-band')?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}), 450);
  const openBefore = new Set(S.cases.filter(k => k.status!=='已結案').map(k => k.id));
  call('addRecord', rec.sendId, rec.text, rec.time)
    .then(async st => {
      load(st);
      // 伺服器回來前就對剛記下的紀錄做了操作（改分類、刪除……）：換成真的 id 依序補送，做完才重畫，畫面不會跳回去
      const ops = S.later[rec.sendId]; delete S.later[rec.sendId];
      const r = S.records.find(r => r.raw===rec.text && r.time===rec.time);
      const ids = r ? S.items.filter(i => i.recordId===r.id).map(i => i.id) : [];
      mine.forEach(t => { if (ids[t.n]) S.realId[t.id] = ids[t.n]; });
      if (ops) {
        for (const o of ops) if (ids[o.n]) { try { load(await call(o.fn, ids[o.n], ...o.rest)); } catch (e) { toast('有一項操作沒存到：' + e.message); } }
      }
      const fin = S.cases.find(k => k.status==='已結案' && openBefore.has(k.id));
      if (fin) { S.justClosed = fin.id; S.adv = fin.id; }
      render();
      if (fin) { toast('最終回！案件完結'); document.querySelector('.panel.just')?.scrollIntoView({behavior:'smooth', block:'center'}); }
    })
    .catch(() => { delete S.later[rec.sendId]; writeQueue([...readQueue(), rec]); render(); toast('沒送出去，已先存在這台裝置，稍後自動補送'); });
});

  if (e.target.id==='cap' && e.key==='Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('capForm').requestSubmit(); return; }
  // 新增選項的輸入框按 Enter 直接加入
  if (e.key==='Enter' && e.target.id && e.target.id.startsWith('optIn-')) { e.preventDefault(); document.querySelector(`[data-optsave="${e.target.id.slice(6)}"]`).click(); return; }
  const row = e.target.closest && e.target.closest('[data-menu]');
  if (row && e.target === row && (e.key==='Enter' || e.key===' ')) { e.preventDefault(); toggleMenu(row); }
});
addEventListener('offline', () => render());
boot();
</script>

</body></html>
