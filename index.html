/* ---------- 檔案縮圖與預覽 ----------
   縮圖由伺服器從雲端硬碟抓回來（手機不用登入 Google）。畫面先畫空框，畫完再補圖；同一個檔案這次打開 App 只問一次。 */
S.thumbs = {}; S.big = {};
// 只收圖片的 data URL（伺服器回來的東西直接放進 src 前先確認格式）
const safeImg = u => typeof u === 'string' && /^data:image\/[\w.+-]+;base64,[A-Za-z0-9+/=]+$/.test(u) ? u : '';
const fileById = id => (S.files || []).find(x => x.id === id);
const thumbHTML = (id, cls) => `<span class="${cls}" data-thumb="${esc(id)}" aria-hidden="true">${S.thumbs[id] ? `<img src="${S.thumbs[id]}" alt="">` : ''}</span>`;
let thumbAsked = {};
function hydrateThumbs(){
  const want = [...new Set([...document.querySelectorAll('[data-thumb]')].map(el => el.dataset.thumb))]
    .filter(id => !(id in S.thumbs) && !thumbAsked[id] && !id.startsWith('tmp'));
  for (let i = 0; i < want.length; i += 12) {
    const ids = want.slice(i, i + 12); ids.forEach(id => (thumbAsked[id] = 1));
    call('fileThumbs', ids, 240).then(r => {
      ids.forEach(id => { S.thumbs[id] = safeImg(r[id]); });
      document.querySelectorAll('[data-thumb]').forEach(el => { const u = S.thumbs[el.dataset.thumb]; if (u && !el.firstChild) el.innerHTML = `<img src="${u}" alt="">`; });
    }).catch(() => ids.forEach(id => delete thumbAsked[id]));
  }
}
function fileSheet(id){
  const f = fileById(id), m = f ? null : formById(id); if (!f && !m) return;
  const name = f ? f.name : m.name;
  const c = f && client(f.client), p = f && f.project ? pjById(f.project) : null, k = f && f.case ? kase(f.case) : null;
  const row = (l, v) => v ? `<div class="cd-f"><dt>${l}</dt><dd>${v}</dd></div>` : '';
  const img = u => u ? `<img src="${u}" alt="${esc(name)} 的預覽">` : `<span class="fp-msg">這種檔案沒有預覽，按「開啟原檔」看</span>`;
  const meta = f ? `${row('類型', esc(f.type))}${row('日期', esc(f.date || ''))}
      ${row('客戶', c ? `<button class="link" data-client="${c.id}">${esc(nick(c))}</button>` : '')}
      ${row('專案', p ? `<button class="link" data-proj="${p.id}">${esc(p.name)}</button>` : '')}
      ${row('案件', k ? esc([k.action, k.product].filter(Boolean).join('・')) : '')}
      ${row('資料夾', esc(f.folder || ''))}${row('摘要', esc(f.summary || ''))}`
    : `${row('業務', esc(m.biz))}${row('類別', esc([m.kind, m.sub].filter(Boolean).join('・')))}${row('代碼', esc(m.code))}${row('檔名', esc(m.file))}`;
  const fromPicker = S.fpOpen;   // 從申請書挑選畫面點進來的：多一個「返回」回去繼續勾
  sheet(`<h3>${esc(name)}</h3>
    <div class="fp"><div class="fp-img" id="fpImg">${id in S.big ? img(S.big[id]) : '<span class="fp-msg">載入預覽…</span>'}</div>
    ${m ? '<p class="hint">這裡只看得到第一頁，要看全部或列印請按「開啟原檔」</p>' : ''}
    <dl class="cd-info fp-meta">${meta}</dl></div>
    <div class="sheet-foot"><a class="btn sm" href="${esc(f ? f.url : m.url)}" target="_blank" rel="noopener"><span>開啟原檔</span></a>${fromPicker ? B('返回','ghost sm','data-fmback') : ''}${B('關閉','ghost sm','data-close')}</div>`);
  S.fpOpen = fromPicker;
  if (id in S.big) return;
  call('fileThumbs', [id], 1600).then(r => { S.big[id] = safeImg(r[id]); const el = document.getElementById('fpImg'); if (el) el.innerHTML = img(S.big[id]); })
    .catch(() => { const el = document.getElementById('fpImg'); if (el) el.innerHTML = '<span class="fp-msg">預覽載入失敗，按「開啟原檔」看</span>'; });
}

/* 一筆紀錄的相關檔案：同一位客戶，而且（同一件案件、紀錄裡提到檔案的關鍵字或類型、或日期前後 3 天內）。最多 2 個，新的在前 */
const dayDiff = (a, b) => Math.abs((new Date(a) - new Date(b)) / 864e5);
function relatedFiles(it){
  const c = itemClient(it); if (!c || !(S.files || []).length) return [];
  const names = [c.name, ...c.alias];
  const hit = f => {
    // 案件轉成專案後，紀錄的案件欄放的是專案 id
    if (it.case && (f.case === it.case || f.project === it.case)) return true;
    // 早期整理的檔案沒有關鍵字：改用資料夾名稱的每一層
    const words = String(f.keywords || f.folder || '').split(/[、,，\s／/]+/).filter(w => w.length >= 2 && !names.includes(w));
    if (words.some(w => it.text.includes(w))) return true;
    const t = String(f.type || '').replace(/單$/, '');
    if (t.length >= 2 && it.text.includes(t)) return true;
    return f.date && it.date && dayDiff(f.date, it.date) <= 3;
  };
  return S.files.filter(f => f.client === c.id && hit(f)).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 2);
}
// inButton：放在案件卡（本身是按鈕）裡面時不能再放按鈕，改用 span；點擊一律由 [data-file] 先攔下來
const relHTML = (list, inButton) => list.length ? `<span class="rfs">${list.map(f => { const tag = inButton ? 'span' : 'button';
  return `<${tag} class="rf" ${inButton ? 'role="link"' : 'type="button"'} data-file="${esc(f.id)}" aria-label="相關檔案：${esc(f.name)}">${thumbHTML(f.id, 'rf-th')}<span>${esc(f.type)}・${esc(String(f.date || '').slice(5).replace('-', '/'))}</span></${tag}>`; }).join('')}</span>` : '';
const caseFiles = k => (S.files || []).filter(f => f.case === k.id).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 2);

/* ---------- 申請書庫 ----------
   工作站「申請書庫」裡的申請書、同意書、切結書。業務分類後（歸到案件或開新案件）接著跳出挑選畫面，
   你自己勾這件要用哪幾份，存好後案件卡上列出來、點了就預覽。伺服器不幫忙判斷。 */
const FORM_BIZ = ['固網寬頻', '行動業務', '市內電話', '資安', '行動物聯網', '跨業務通用'];
const formById = id => (S.forms || []).find(m => m.id === id);
const formBizList = () => { const all = S.forms || [], have = new Set(all.map(m => m.biz)); return [...FORM_BIZ.filter(b => have.has(b)), ...[...have].filter(b => !FORM_BIZ.includes(b))]; };
// 依案件的動作、產品先打開比較可能的那一頁（只決定先看哪頁，勾哪幾份還是你自己選）
function guessBiz(k){
  const p = k ? k.action + ' ' + k.product : '';
  return /資安|防護|防禦/.test(p) ? '資安' : /物聯|IoT|CMP/i.test(p) ? '行動物聯網' : /行動|SIM|門號|手機|5G|4G/i.test(p) ? '行動業務'
    : /市話|電話/.test(p) ? '市內電話' : /光世代|寬頻|HiNet|ADSL|專線|固定IP|固網|1G|2G/i.test(p) ? '固網寬頻' : '';
}

/* keep：勾選、換分頁、打字時只重畫已選與清單（整張重畫會讓清單跳回最上面，打中文時還會打斷選字） */

/* 業務分類完（歸到案件、開新案件）接著問要哪些申請書；申請書庫是空的就不問 */

    const to = p.stage + 1; p.stage = to; p.updated = S.today;
    S.items.push({ id: 'tmp' + Date.now(), date: S.today, time: stamp(new Date()).slice(11), cat: '業務', client: p.client, case: p.id, prog: true, source: '進度', text: `進度 → ${pjStepName(p, to)}` });
    render(); toast(to >= PJ_N() ? '專案結案' : `推進到「${pjStepName(p, to)}」`); if (window.Fog) Fog.stir(innerWidth / 2, innerHeight / 2, to >= PJ_N() ? 2.2 : 1);
    server('advanceProject', p.id, to, ''); return; }
  if (d.pjlog) { if (waitTmp(d.pjlog)) return; pjLogSheet(pjById(d.pjlog)); return; }
  if (d.pjstage) { const p = pjById(S.projectId); if (!p || waitTmp(p.id)) return; pjLogSheet(p, Number(d.pjstage) === p.stage ? null : d.pjstage); return; }
  if (d.pjpick) {
    if (t.getAttribute('aria-disabled') === 'true') { toast('這已經是目前的關卡'); return; }
    const on = t.getAttribute('aria-pressed') !== 'true';
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    t.setAttribute('aria-pressed', String(on)); S.pjPick = on ? d.pjpick : ''; return;
  }
  if (d.pjapply) {
    const p = pjById(d.pjapply), noteEl = document.getElementById('pjLogNote'), note = noteEl.value.trim(), stage = S.pjPick;
    if (stage === '' && !note) { toast('寫一句進度，或選一個關卡'); noteEl.focus(); return; }
    if (stage !== '') p.stage = Number(stage); p.updated = S.today;
    const line = stage !== '' ? `進度 → ${pjStepName(p, Number(stage))}${note ? '：' + note : ''}` : note;
    S.items.push({ id: 'tmp' + Date.now(), date: S.today, time: stamp(new Date()).slice(11), cat: '業務', client: p.client, case: p.id, prog: true, source: '進度', text: line });
    closeSheet(); render(); toast(stage !== '' ? `推進到「${pjStepName(p, Number(stage))}」` : '記下進度');
    server('advanceProject', p.id, stage === '' ? '' : Number(stage), note); return;
  }
  if (d.toproj) { if (waitTmp(d.toproj)) return; const k = kase(d.toproj); if (k) toProjectSheet(k); return; }
  if (d.toprojgo) {
    const k = kase(d.toprojgo), name = document.getElementById('pjName').value.trim(), stage = S.pjPick === '' ? 1 : Number(S.pjPick), scale = S.pjScale;
    if (!k) return;
    // 先在畫面上搬好，伺服器回來後打開新專案
    const tmp = 'tmpj' + Date.now();
    (S.projects = S.projects || []).push({ id: tmp, client: k.client, name: name || k.action + '・' + k.product, scale, stage, created: k.created, updated: S.today, vendor: '', markup: '', tax: '外加', items: [], docs: {}, note: k.note || '' });
    S.items.forEach(i => { if (i.case === k.id) i.case = tmp; });
    S.cases = S.cases.filter(x => x.id !== k.id);
    closeSheet(); S.view = 'projects'; S.projectId = null; S.clientId = null; S.anim = true; render(true); scrollTo(0, 0); toast('已轉成專案');
    queued('caseToProject', k.id, name, scale, stage).then(st => { load(st); if (st.newProjectId) S.projectId = st.newProjectId; S.anim = true; render(true); })
      .catch(e => { toast('沒轉成功：' + (e && e.message || '請稍後再試')); call('getState').then(st => { load(st); render(); }).catch(() => {}); });
    return;
  }
  if (d.pjedit) { if (waitTmp(d.pjedit)) return; pjEditSheet(pjById(d.pjedit)); return; }
  if (d.pjsave) {
    const p = pjById(d.pjsave), cn = document.getElementById('ncClient').value.trim(), name = document.getElementById('pjName').value.trim(), note = document.getElementById('pjNote').value.trim();
    if (!name) { toast('專案名稱不能空白'); document.getElementById('pjName').focus(); return; }
    const old = client(p.client), moved = cn && (!old || old.name !== cn);
    Object.assign(p, { name, scale: S.pjScale, note });
    if (moved) { const c = S.clients.find(c => c.name === cn || c.alias.includes(cn)); if (c) p.client = c.id; }
    closeSheet(); render(); toast('已修改專案'); server('editProject', p.id, { name, scale: S.pjScale, note, clientName: moved ? cn : '' }); return;
  }
  if (d.pjdel) { if (!t.classList.contains('arm')) { t.classList.add('arm'); t.textContent = '再按一次刪除專案'; return; }
    S.projects = S.projects.filter(p => p.id !== d.pjdel); S.projectId = null; S.qDraft = null; closeSheet(); render(true); toast('已刪除專案'); server('deleteProject', d.pjdel); return; }
  if (d.qadd !== undefined) { document.getElementById('qBody').insertAdjacentHTML('beforeend', quoteRow({ n: '', q: 1, u: '', c: '' })); quoteRecalc(); document.querySelector('#qBody tr:last-child input').focus(); return; }
  if (d.qdel !== undefined) { const tr = t.closest('tr'); if (document.querySelectorAll('#qBody tr').length > 1) tr.remove(); else tr.querySelectorAll('input').forEach(i => { i.value = ''; }); quoteRecalc(); return; }
  if (d.qsave) {
    if (waitTmp(d.qsave)) return;
    const p = pjById(d.qsave), q = quoteRead();
    Object.assign(p, { vendor: q.vendor, markup: q.markup === '' ? '' : Number(q.markup), items: q.items.filter(x => x.n).map(x => ({ n: x.n, q: Number(x.q) || 0, u: x.u, c: Number(x.c) || 0, p: '' })) });
    S.qDraft = null; render(); toast('報價已存檔'); server('saveQuote', p.id, q); return;
  }
  if (d.qcopy) { const q = quoteRead(); copyText(bcrmText({ items: q.items.filter(x => x.n), markup: q.markup }), '已複製品項明細'); return; }
  if (d.gendoc) {
    if (waitTmp(d.gendoc)) return;
    // 報價試算還沒存檔就先存，文件才會用到剛填的品項
    const draft = document.getElementById('quote') ? quoteRead() : null, p = pjById(d.gendoc);
    const dirty = draft && JSON.stringify(draft.items.filter(x => x.n).map(x => [x.n, +x.q || 0, x.u, +x.c || 0])) !== JSON.stringify(p.items.map(x => [x.n, +x.q || 0, x.u, +x.c || 0]));
    const kind = d.kind, fn = kind === '報價單' ? 'generateQuote' : 'generateAcceptance';
    t.disabled = true; t.querySelector('span').textContent = '產生中…';
    (dirty || (draft && String(draft.markup) !== String(p.markup)) ? queued('saveQuote', p.id, draft) : Promise.resolve())
      .then(() => queued(fn, d.gendoc)).then(st => { S.qDraft = null; load(st); render(); toast(kind + '產生好了'); })
      .catch(e => { render(); const m = String(e && e.message || e); toast(/授權|authoriz|permission|權限/i.test(m) ? '還沒授權產生文件：請在 Apps Script 編輯器執行一次 authorizeDocs' : m); });
    return;
  }
  if (d.invcopy) { copyText(invoiceText(pjById(d.invcopy)), '已複製給祐芹姐的訊息'); return; }
  if (d.attach) { const it = itemFor(d.attach); if (it) caseSheet(it); return; }
  if (d.link) {
    const kid = d.link, it = live(S.ncItem), k = kase(kid);
    Object.assign(it, {case:kid, cat:'業務', source:'手動', pending:false, fresh:true}); k.updated=S.today;
    S.flash=['業務']; S.bump=['業務']; S.adv=kid; closeSheet(); render(); toast(`已歸到 ${k.action}・${k.product}`);
    serverItem(it, 'linkItem', kid); askForms(kid) || nextConfirm(); return;
  }
  if (d.ncc) { document.getElementById('ncClient').value = d.ncc; renderSug(); return; }
  if (d.addopt) {
    const box = document.getElementById('optNew-' + d.addopt), open = box.hidden;
    box.hidden = !open; t.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('optIn-' + d.addopt).focus();
    return;
  }
  if (d.optsave) {
    const kind = d.optsave, o = OPT[kind], inp = document.getElementById('optIn-' + kind), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    const list = o.list();
    if (!list.includes(v)) { const at = list.indexOf('其他'); at >= 0 ? list.splice(at, 0, v) : list.push(v); server('addOption', o.type, v); toast(`已新增${o.label}「${v}」`); }
    S.nc[kind] = v;
    // 只重畫這一排，抽屜裡其他已經填的東西不動
    const row = document.getElementById('pick-' + kind).previousElementSibling;
    document.getElementById('pick-' + kind).remove(); document.getElementById('optNew-' + kind).remove();
    row.insertAdjacentHTML('afterend', pickRow(kind)); row.remove();
    return;
  }
  if (d.na || d.np) { S.nc[d.na?'a':'p'] = d.na || d.np; t.parentElement.querySelectorAll('button:not(.add-opt)').forEach(b => b.setAttribute('aria-pressed', b===t)); return; }
  if (d.newcase !== undefined) {
    const it = S.ncItem ? live(S.ncItem) : null, step = S.pstep;
    const cEl = document.getElementById('ncClient'), cn = cEl ? cEl.value.trim() : '', note = document.getElementById('ncNote').value.trim();
    if (!S.nc.a || !S.nc.p) { toast('先選動作和產品'); return; }
    if (!(it && it.client) && !cn) { toast('先填客戶'); cEl.focus(); return; }
    // 先在畫面上建好，伺服器回來再換成正式資料
    let cid = it && it.client;
    if (!cid) { const c = S.clients.find(c => c.name===cn || c.alias.includes(cn)); cid = c ? c.id : 'tmpc'+Date.now(); if (!c) S.clients.push({id:cid, name:cn, alias:[]}); }
    const kid = 'tmpk'+Date.now(), now = stamp(new Date()).slice(11);
    const status = step ? (S.stepStatus[step] || '進行中') : '進行中';
    S.cases.push({id:kid, client:cid, action:S.nc.a, product:S.nc.p, progress:step || '處理中', status, created:S.today, updated:S.today, note});
    if (it) Object.assign(it, {case:kid, client:cid, cat:'業務', source:'手動', pending:false, fresh:true});
    const detail = [step ? shortStep(step) : '', note].filter(Boolean).join('：');
    if (!it || note || step) S.items.push({id:'tmp'+Date.now(), date:S.today, time:now, cat:'業務', client:cid, case:kid, prog:true, source:'進度', fresh:true,
      text: it ? (step ? `進度 → ${detail}` : note) : `開新案件${detail?'：'+detail:''}`});
    const [a, p] = [S.nc.a, S.nc.p];
    S.flash=['業務']; S.bump=['業務']; S.adv=kid; closeSheet(); render(); toast(`新案件：${a}・${p}`);
    if (it) serverItem(it, 'createCase', a, p, cn, note, step); else server('createCase', '', a, p, cn, note, step);
    askForms(kid) || nextConfirm(); return;
  }
  if (d.resolve) {
    const p = S.pending.find(x=>x.id===d.resolve); p.done = '處理中…';
    // 分類類的待確認：紀錄立刻搬到選的那一欄，不等伺服器
    const it = p.item && S.items.find(i => i.id===p.item);
    if (it && CATS.includes(d.val)) {
      if (it.cat !== d.val) { if (d.val!=='業務') it.case=''; it.cat=d.val; it.fresh=true; S.flash=[d.val]; S.bump=[d.val]; }
      it.pending = false; p.done = `已歸到「${d.val}」`;
    }
    render();
    server('resolvePending', d.resolve, d.val); return;
  }
  if (d.setcat) {
    const it = itemFor(d.setcat); if (!it) return;
    if (it.cat !== d.v) {
      // 改成待辦＝進待辦清單；從待辦改走＝拿掉那條沒做完的（伺服器 syncTodoForItem_ 同一套）
      if (d.v === '待辦') (S.todos = S.todos || []).push({ id: 'tmpt' + Date.now(), text: it.text, due: '', done: '', created: stamp(new Date()) });
      else if (it.cat === '待辦') S.todos = (S.todos || []).filter(x => !(x.text === it.text && !x.done));
      if (d.v!=='業務') it.case=''; it.cat=d.v; S.flash=[d.v]; S.bump=[d.v];
    }
    Object.assign(it, {source:'手動', pending:false, fresh:true}); render(); toast(`已改成「${d.v}」`);
    serverItem(it, 'setCategory', d.v);
    if (d.v==='業務' && !it.case) { S.confirmQ = [it]; nextConfirm(); }
    return;
  }
  if (d.edit) {
    const it = itemFor(d.edit); if (!it) return;
    S.back = t.closest('.sheet') ? S.sheetCase : null;
    sheet(`<h3>修改</h3><label for="edText">內容</label><textarea id="edText" rows="3">${esc(it.text)}</textarea>
      <div class="sheet-foot">${B('存檔','',`data-save="${it.id}"`)}${B('取消','ghost sm','data-close')}</div>`);
    return;
  }
  if (d.save) {
    const it = itemFor(d.save), el = document.getElementById('edText'), v = el.value.trim(); if (!it) return;
    if (!v) { el.focus(); return; }
    const back = S.back; S.back = null;
    Object.assign(it, {text:v, fresh:true}); closeSheet(); render(); toast('已修改');
    if (back) progSheet(kase(back));
    serverItem(it, 'editItem', v); return;
  }
  if (d.del) {
    const it = itemFor(d.del); if (!it) return;
    const back = t.closest('.sheet') ? S.sheetCase : null;
    S.items = S.items.filter(i => i !== it); render(); toast('已刪除');
    if (back) progSheet(kase(back));
    serverItem(it, 'deleteItem'); return;
  }
  if (d.delrec) {
    if (d.delrec.startsWith('q:')) { writeQueue(readQueue().filter(r => 'q:'+r.sendId !== d.delrec)); render(); toast('已刪除'); return; }
    S.records = S.records.filter(r => r.id !== d.delrec); S.items = S.items.filter(i => i.recordId !== d.delrec);
    render(); toast('已刪除'); server('deleteRecord', d.delrec); return;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'keyForm') {
    e.preventDefault();
    const v = document.getElementById('keyInput').value.trim(); if (!v) return;
    store.set(TOKEN_KEY, v); S.anim = true; boot(); return;
  }
  if (e.target.id === 'fileSearch') {
    e.preventDefault();
    const v = document.getElementById('fq').value.trim(); if (!v) { document.getElementById('fq').focus(); return; }
    searchSheet(v); return;
  }
  if (e.target.id === 'todoForm') {
    e.preventDefault();
    const inp = document.getElementById('todoIn'), v = inp.value.trim(), due = document.getElementById('todoDue').value;
    if (!v) { inp.focus(); return; }
    (S.todos = S.todos || []).push({ id: 'tmp' + Date.now(), text: v, due, done: '', created: stamp(new Date()) });
    // 先清空再重畫：重畫時會把輸入框裡還在的字填回去
    inp.value = ''; document.getElementById('todoDue').value = '';
    render(); document.getElementById('todoIn')?.focus(); server('addTodo', v, due); return;
  }
  if (e.target.id !== 'capForm') return; e.preventDefault();
  const ta = document.getElementById('cap'), text = ta.value.trim(); if (!text) { ta.focus(); return; }
  const rec = { sendId: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7), text, time: stamp(new Date()) };
  const segs = roughSplit(text);
  S.clearDraft = true;
  if (!navigator.onLine) { writeQueue([...readQueue(), rec]); render(); toast('沒有網路，先存在這台裝置'); return; }
  segs.forEach((s,n) => S.items.push({id:'tmp'+Date.now()+n, tmp:rec.sendId, n, date:S.today, time:rec.time.slice(11), cat:s.cat, client:s.client, text:s.text, source:'暫分', fresh:true}));
  segs.filter(s => s.cat === '待辦').forEach((s, n) => (S.todos = S.todos || []).push({ id: 'tmpt' + Date.now() + n, text: s.text, due: '', done: '', created: rec.time }));
  S.flash = S.bump = [...new Set(segs.map(s=>s.cat))];
  const mine = S.items.filter(i => i.tmp === rec.sendId);
  render();
  S.confirmQ = mine.filter(i => i.cat==='業務');
  if (S.confirmQ.length) setTimeout(nextConfirm, 380);
  if (window.Fog) { const r = e.target.getBoundingClientRect(); Fog.stir(r.left + r.width / 2, r.top + 40, 1.4); }
  toast(`分進 ${segs.length} 格`);
  if (!S.confirmQ.length) setTimeout(() => document.querySelector('.today-band')?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}), 450);
  const openBefore = new Set(S.cases.filter(k => k.status!=='已結案').map(k => k.id));
  queued('addRecord', rec.sendId, rec.text, rec.time)
    .then(async st => {
      load(st);
      // 伺服器回來前就對剛記下的紀錄做了操作（改分類、刪除……）：換成真的 id 依序補送，做完才重畫，畫面不會跳回去
      const ops = S.later[rec.sendId]; delete S.later[rec.sendId];
      const r = S.records.find(r => r.raw===rec.text && r.time===rec.time);
      const ids = r ? S.items.filter(i => i.recordId===r.id).map(i => i.id) : [];
      mine.forEach(t => { if (ids[t.n]) S.realId[t.id] = ids[t.n]; });
      if (ops) {
        for (const o of ops) if (ids[o.n]) { try { load(await call(o.fn, ids[o.n], ...o.rest)); } catch (e) { toast('有一項操作沒存到：' + e.message); } }
      }
      const fin = S.cases.find(k => k.status==='已結案' && openBefore.has(k.id));
      if (fin) { S.justClosed = fin.id; S.adv = fin.id; }
      render();
      if (fin) { toast('最終回！案件完結'); document.querySelector('.panel.just')?.scrollIntoView({behavior:'smooth', block:'center'}); }
    })
    .catch(() => { delete S.later[rec.sendId]; writeQueue([...readQueue(), rec]); render(); toast('沒送出去，已先存在這台裝置，稍後自動補送'); });
});
document.addEventListener('input', e => { if (e.target.id==='cap') syncMirror(!e.isComposing && !cmp, !!cmp); if (e.target.id==='ncClient') renderSug(); if (e.target.closest && e.target.closest('#quote')) quoteRecalc(); if (e.target.id==='q') { S.q=e.target.value; const p=e.target.selectionStart; render(); const i=document.getElementById('q'); i.focus(); i.setSelectionRange(p,p); } });
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeSheet(); closeMenus(); return; }
  // 電腦上打長紀錄：Ctrl（Mac 是 Cmd）＋Enter 直接記下來
  if (e.target.id==='cap' && e.key==='Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('capForm').requestSubmit(); return; }
  // 新增選項的輸入框按 Enter 直接加入
  if (e.key==='Enter' && e.target.id && e.target.id.startsWith('optIn-')) { e.preventDefault(); document.querySelector(`[data-optsave="${e.target.id.slice(6)}"]`).click(); return; }
  const row = e.target.closest && e.target.closest('[data-menu]');
  if (row && e.target === row && (e.key==='Enter' || e.key===' ')) { e.preventDefault(); toggleMenu(row); }
});
addEventListener('offline', () => render());
boot();
</script>
