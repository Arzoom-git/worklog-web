<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>工作日誌</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1E6C4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1A17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作日誌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>window.WORKLOG_API = 'https://script.google.com/macros/s/AKfycbyEq4XBGzIoE6YV8ME2s2VbshbHVzVy0f3aRitL89SNERO_f_xyMoiKlfuQlzfpqRg/exec'; window.WORKLOG_VERSION = '2.15.2'; if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chiron+Sung+HK:wght@700;900&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;900&display=swap">
<style>
/* v2「夜間潛入」：P5 介面原則（主色、剪報字、斜角鋸齒、視線引導線、亮度＝優先級）。
   底 #1F1A17 深焦茶、字 #DDD0B0 米黃（11:1）、卡片是黃紙、主色朱紅只給能點的東西。
   形狀：0px＋不規則四邊形裁切；唯一陰影：卡片後方的偏移底板。
   動態：招牌緩動 cubic-bezier(.2,0,0,1)；喜悅用回彈；140／260／520ms。 */
:root{
  color-scheme:dark;
  --bg:#1F1A17; --bg-2:#29221E; --bg-3:#141110;
  --text:#DDD0B0; --text-soft:#A89A7E;
  --paper:#EDE1BE; --paper-2:#E2D4AC; --ink:#2E2521; --ink-soft:#6A5A4E;
  --red:#C43228; --red-text:#E4503F; --on-red:#FFF4E0;
  --guide:#EDE3C8;
  --caution:#E8C21A; --on-caution:#1F1A17;
  --tone:rgba(221,208,176,.07); --tone-ink:rgba(46,37,33,.16);
  --serif:"Chiron Sung HK","Noto Serif TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --display:"Anton","Noto Sans TC",Impact,sans-serif;
  --hand:"LXGW WenKai TC","Chiron Sung HK",serif;
  --ease:cubic-bezier(.2,0,0,1); --pop:cubic-bezier(.175,.885,.32,1.275);
  --q:140ms; --s:260ms; --l:520ms;
  /* 不規則四邊形：P5 幾乎沒有方正的東西 */
  --jag-a:polygon(0 3px,100% 0,calc(100% - 4px) 100%,3px calc(100% - 4px));
  --jag-b:polygon(2px 0,calc(100% - 3px) 4px,100% calc(100% - 2px),0 100%);
  --jag-btn:polygon(6% 0,100% 8%,94% 100%,0 90%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#F1E6C4; --bg-2:#E8DBB3; --bg-3:#3A2E28;
  --text:#3A2E28; --text-soft:#6A5A4E;
  --paper:#FBF4DE; --paper-2:#F1E6C4;
  --red-text:#B52A20; --guide:#3A2E28;
  --tone:rgba(58,46,40,.08);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F1E6C4; --bg-2:#E8DBB3; --bg-3:#3A2E28;
  --text:#3A2E28; --text-soft:#6A5A4E;
  --paper:#FBF4DE; --paper-2:#F1E6C4;
  --red-text:#B52A20; --guide:#3A2E28;
  --tone:rgba(58,46,40,.08);
}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--red-text)}
:focus-visible{outline:3px solid var(--red-text);outline-offset:3px}
.big-num{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.t{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 剪報字 ---------- */
/* 協調規則：字重一律 900、大小差 ±8%、傾斜 ±3°；底色只用黃紙／深底／米黃字，相鄰不重複；朱紅不用在這裡 */
.ransom{margin:0;line-height:1.2;font-size:clamp(30px,8.4vw,50px);text-wrap:balance}
.ransom.md{font-size:24px}
.rn{display:inline-block;transform:rotate(var(--r)) translateY(var(--y));padding:.04em .1em;margin:.04em .02em;line-height:1.1}
.r0{background:var(--paper);color:var(--ink);font-family:var(--serif);font-weight:900;clip-path:var(--jag-a)}
.r1{background:var(--bg-3);color:var(--text);font-family:var(--sans);font-weight:900;box-shadow:inset 0 0 0 .07em var(--text)}
.r2{color:var(--text);font-family:var(--serif);font-weight:900;font-size:1.08em;padding-inline:.03em;-webkit-text-stroke:.05em var(--bg-3);paint-order:stroke fill}
.r3{background:var(--text);color:var(--bg);font-family:var(--serif);font-weight:900;font-size:.94em;clip-path:var(--jag-b)}
.rn.lat{font-family:var(--display);font-weight:400}
.ransom.anim .rn{animation:rnIn var(--s) var(--pop) both;animation-delay:var(--d)}
@keyframes rnIn{from{opacity:0;transform:rotate(calc(var(--r) * -5)) scale(1.8)}}

.band{padding-inline:16px}
.wrap{max-width:1120px;margin:0 auto}
.b-paper{background:var(--bg)}
.b-paper2{background:var(--bg-2)}
.b-band{background:var(--bg-3)}

/* ---------- 開場：日期當主角＋視線引導線 ---------- */
.mast{position:relative;overflow:hidden;padding-block:64px 26px;background-image:radial-gradient(var(--tone) 1.2px,transparent 1.5px);background-size:7px 7px}
.mast .wrap{position:relative;display:grid;gap:14px}
.date{display:flex;align-items:flex-end;gap:10px;transform:rotate(-5deg);transform-origin:left bottom;width:max-content;max-width:100%}
.date .md{font-family:var(--display);font-size:clamp(76px,22vw,120px);line-height:.82;color:var(--text);-webkit-text-stroke:3px var(--bg-3);paint-order:stroke fill}
.date .md small{font-size:.55em;margin-right:.04em}
.date .wd{display:grid;gap:4px;padding-bottom:6px}
.date .wd b{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1;background:var(--paper);color:var(--ink);padding:4px 8px;clip-path:var(--jag-a)}
.date .wd span{font-size:12.5px;color:var(--text-soft);letter-spacing:.08em}
.guide{position:absolute;left:-10%;right:-10%;top:58%;height:3px;background:var(--guide);transform:rotate(-8deg);transform-origin:left;opacity:.9;pointer-events:none}
.mast.anim .guide{animation:guide var(--l) var(--ease)}
@keyframes guide{from{transform:rotate(-8deg) scaleX(0)}}
.mast-meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 12px;background:var(--bg-3);color:var(--text);clip-path:var(--jag-b)}
.tag.warn{background:var(--caution);color:var(--on-caution)}

/* ---------- 按鈕：朱紅鋸齒 ---------- */
.btn{border:0;background:var(--red);color:var(--on-red);font-weight:900;min-height:48px;padding:0 24px;font-size:16.5px;letter-spacing:.1em;clip-path:var(--jag-btn);transition:transform var(--q) var(--ease),filter var(--q)}
.btn>span{display:inline-block;transform:rotate(-2deg)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.94) rotate(-2deg)}
.btn.ghost{background:var(--bg-3);color:var(--text);box-shadow:inset 0 0 0 2px var(--text-soft)}
.paper .btn.ghost,.sheet .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px;letter-spacing:.04em}

/* ---------- 快記：黃紙卡，後面墊一塊深色偏移底板 ---------- */
.cap-band{padding-block:6px 40px}
.bubble{position:relative;z-index:0;transform:rotate(-1deg)}
.bubble::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg-3);transform:translate(8px,8px) rotate(1.4deg);clip-path:var(--jag-b)}
.bubble-in{background:var(--paper);color:var(--ink);padding:14px 16px 12px;clip-path:var(--jag-a)}
.bubble textarea{width:100%;min-height:112px;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font-size:17px;line-height:1.7;display:block}
.cap-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft);padding-top:8px}
.cap-foot .off{margin-right:auto}
.sfx{position:absolute;right:14px;top:-40px;font-family:var(--hand);font-weight:700;font-size:44px;color:var(--text);-webkit-text-stroke:4px var(--bg-3);paint-order:stroke fill;pointer-events:none;transform:skewX(-14deg) rotate(-8deg);opacity:0}
.sfx.go{animation:sfx var(--l) var(--ease)}
@keyframes sfx{0%{opacity:0;transform:skewX(-14deg) rotate(-8deg) scale(.4)}30%{opacity:1;transform:skewX(-14deg) rotate(-8deg) scale(1.15)}100%{opacity:0;transform:skewX(-14deg) rotate(-8deg) translate(40px,-16px)}}

/* ---------- 區塊標題 ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.sec-h .ransom{transform:rotate(-2deg);transform-origin:left}
.sec-h .note{font-size:13px;color:var(--text-soft)}

/* ---------- 今日工作事項：三欄 ---------- */
.today-band{padding-block:32px 40px}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){.cols{grid-template-columns:1fr 1.45fr 1fr;align-items:start}}
.col{display:grid;grid-template-columns:50px 1fr;min-height:120px}
.col:nth-child(1){transform:rotate(-.6deg)} .col:nth-child(2){transform:rotate(.4deg)} .col:nth-child(3){transform:rotate(-.3deg)}
.col-h{position:relative;writing-mode:vertical-rl;background:var(--bg-3);color:var(--text);font-family:var(--serif);font-weight:900;font-size:23px;display:flex;align-items:center;padding:14px 0;overflow:hidden;clip-path:polygon(0 0,100% 6px,100% 100%,0 calc(100% - 8px))}
.col-h .cnt{writing-mode:horizontal-tb;font-family:var(--display);font-size:28px;line-height:1;margin-top:10px;color:var(--text)}
.cnt.bump{animation:bump var(--s) var(--pop)}
@keyframes bump{40%{transform:scale(1.5) rotate(-8deg)}}
.col-h.flash::after{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,var(--text) 0 2deg,transparent 2deg 9deg);opacity:0;animation:flash var(--l) var(--ease)}
@keyframes flash{25%{opacity:.5}}
.col-body{display:flex;flex-direction:column;min-width:0;background:var(--paper);color:var(--ink);clip-path:var(--jag-b)}
.item{padding:11px 12px;border-bottom:1.5px solid var(--tone-ink)}
.item:last-child{border-bottom:0}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:12.5px;color:var(--ink-soft)}
.item p{margin:3px 0 0;font-size:15.5px;line-height:1.55}
.who{font-weight:900}
.mini{font-size:11.5px;padding:0 6px;background:var(--ink);color:var(--paper)}
.links{margin-left:auto;display:flex;gap:10px}
.lnk{background:none;border:0;padding:0;color:var(--red);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:30px}
.empty{padding:14px 12px;font-size:14px;color:var(--ink-soft)}
.new{animation:enter var(--s) var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(-26px) skewX(-10deg)}}

/* 業務欄：案件卡 */
.kcard{position:relative;overflow:hidden;padding:12px;border-bottom:2.5px solid var(--ink)}
.kcard:last-child{border-bottom:0}
.k-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.k-top b{font-family:var(--serif);font-weight:900;font-size:19px}
.k-top .kind{font-size:13.5px;color:var(--ink-soft)}
.state{font-size:12px;padding:0 7px;box-shadow:inset 0 0 0 1.5px var(--ink);white-space:nowrap}
.state.doing{background:var(--ink);color:var(--paper)}
.stepper{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;margin:10px 0 4px}
.seg{display:block;height:10px;transform:skewX(-24deg);box-shadow:inset 0 0 0 1.5px currentColor;opacity:.55}
.seg.past{background:currentColor;opacity:.35}
.seg.cur{background:currentColor;opacity:1;transform:skewX(-24deg) scaleY(1.5);transform-origin:left}
.seg.cur.adv{animation:adv var(--s) var(--ease)}
@keyframes adv{from{transform:skewX(-24deg) scaleY(1.5) scaleX(0)}}
.k-now{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-top:6px;flex-wrap:wrap}
.k-now strong{font-weight:900}
.k-log{list-style:none;margin:8px 0 0;padding:0;font-size:14px;color:var(--ink-soft)}
.k-log li{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:2px 0}
.k-log li.fresh{color:var(--ink);font-weight:500}
.kcard.pop{animation:pop var(--l) var(--pop)}
@keyframes pop{30%{transform:scale(1.03) rotate(-.6deg)}}
.final{background-image:radial-gradient(var(--tone-ink) 1px,transparent 1.3px);background-size:5px 5px}
.final .k-top b,.final .p-client{opacity:.6}
.ribbon{position:absolute;right:-40px;top:14px;width:150px;text-align:center;background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:900;font-size:14px;letter-spacing:.3em;padding:3px 0;transform:rotate(35deg)}
.just .ribbon{animation:ribbon var(--l) var(--pop)}
@keyframes ribbon{from{transform:translateX(130px) rotate(35deg)}}

/* ---------- 連載中：最深的底，卡片交錯傾斜 ---------- */
.cases-band{padding-block:34px 40px}
.cases-band .note,.aside{color:var(--text-soft)}
.panels{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.panels{grid-template-columns:repeat(2,1fr)}}
.panel{position:relative;overflow:hidden;border:0;background:var(--paper);color:var(--ink);padding:14px 14px 12px;display:grid;gap:4px;text-align:left;width:100%;clip-path:var(--jag-a);transition:transform var(--q) var(--ease)}
.panel:nth-child(odd){transform:rotate(-.8deg)} .panel:nth-child(even){transform:rotate(.6deg)}
.panel:hover{transform:rotate(-1.6deg) scale(1.015)}
.panel:active{transform:scale(.97)}
.p-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-client{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.3}
.p-kind{font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:4px;flex-wrap:wrap}
.warn-strip{background:var(--caution);color:var(--on-caution);font-size:12.5px;font-weight:900;padding:1px 10px;background-image:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.14) 8px 12px);clip-path:var(--jag-b)}
.aside{font-size:13px;margin:14px 0 0}

/* ---------- 待確認＋行程 ---------- */
.side-band{padding-block:32px 44px}
.two{display:grid;gap:30px;grid-template-columns:1fr}
@media (min-width:900px){.two{grid-template-columns:1.2fr 1fr}}
.pend{padding:14px 14px 16px;margin-bottom:10px;background:var(--bg-2);clip-path:var(--jag-b)}
.pend .k{font-size:12.5px;letter-spacing:.12em;color:var(--text-soft)}
.pend .q{margin:2px 0 12px;font-size:15.5px}
.pend .q q{quotes:"「" "」";font-family:var(--serif);font-weight:900;font-size:19px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.done-line{padding:10px 0;font-size:14.5px;color:var(--text-soft)}
.sch{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px 0;align-items:baseline;border-top:1.5px solid var(--tone)}
.sch .big-num{font-size:28px;line-height:1}
.sch small{display:block;color:var(--text-soft);font-size:13px}
.day{display:inline-block;font-family:var(--serif);font-weight:900;font-size:15px;margin:12px 0 4px;padding:1px 10px;background:var(--text);color:var(--bg);clip-path:var(--jag-b)}

.tabs{display:inline-flex;gap:6px}
.tabs button{border:0;background:transparent;color:var(--text-soft);min-height:40px;padding:0 16px;font-size:15px;clip-path:var(--jag-btn);box-shadow:inset 0 0 0 2px var(--text-soft);transition:transform var(--q) var(--ease)}
.tabs button[aria-pressed="true"]{background:var(--red);color:var(--on-red);box-shadow:none;font-weight:900;transform:scale(1.08) rotate(-3deg)}
.report{background:var(--paper);color:var(--ink);padding:18px 16px;clip-path:var(--jag-a)}
.report h3{font-family:var(--serif);font-weight:900;font-size:18px;margin:14px 0 4px}
.report p{margin:0 0 6px}

/* ---------- 其他頁 ---------- */
.page{padding-block:44px 36px}
.page .lead{margin:14px 0 18px;color:var(--text-soft);font-size:14px}
.rec{background:var(--paper);color:var(--ink);margin-bottom:14px;clip-path:var(--jag-a)}
.rec:nth-child(odd){transform:rotate(-.4deg)}
.rec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--paper);padding:4px 12px;font-size:13px}
.rec-raw{margin:0;padding:12px;font-size:15.5px;white-space:pre-wrap}
.rec-seg{border-top:1.5px dashed var(--tone-ink);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14.5px}
.chip{font-size:13px;padding:1px 9px;box-shadow:inset 0 0 0 1.5px currentColor}
.chip.cat{background:var(--ink);color:var(--paper);box-shadow:none}
.hist .chip.cat{background:var(--text);color:var(--bg)}
.tl-day{display:inline-block;font-family:var(--serif);font-weight:900;font-size:18px;margin:24px 0 12px;padding:2px 12px;background:var(--text);color:var(--bg);clip-path:var(--jag-b);transform:rotate(-2deg)}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);padding:0 14px;margin-bottom:16px;clip-path:var(--jag-a)}
.search input{flex:1;border:0;outline:0;background:transparent;min-height:52px;font-size:17px;color:var(--ink)}
.cl{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1.5px solid var(--tone);padding:14px 0;text-align:left;color:var(--text);transition:transform var(--q) var(--ease)}
.cl:hover{transform:translateX(6px)}
.cl .n{font-family:var(--serif);font-weight:900;font-size:19px}
.cl small{display:block;font-size:13px;color:var(--text-soft)}
.cl .r{font-size:13.5px;color:var(--text-soft);white-space:nowrap}
.back{background:none;border:0;color:var(--red-text);min-height:44px;padding:0;font-size:15px;font-weight:500}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;margin:0 0 8px}
.kv dt{color:var(--text-soft)}
.kv dd{margin:0;overflow-wrap:anywhere}
.hist{border-top:1.5px solid var(--tone);padding:10px 0}
.hist .when{font-size:13px;color:var(--text-soft);display:flex;gap:8px;align-items:center}
.hist p{margin:2px 0 0}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.frow{display:flex;gap:8px;overflow-x:auto;align-items:center;padding:4px}
.frow>span{font-size:13px;color:var(--text-soft);min-width:36px}
.frow button,.pick button{border:0;background:transparent;min-height:38px;padding:0 13px;white-space:nowrap;font-size:14.5px;color:inherit;clip-path:var(--jag-btn);box-shadow:inset 0 0 0 2px currentColor;opacity:.72;transition:transform var(--q) var(--ease),opacity var(--q)}
.frow button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:var(--red);color:var(--on-red);box-shadow:none;opacity:1;font-weight:900;transform:scale(1.08) rotate(-3deg)}

/* ---------- 底部導覽：斜切的深色帶；選中＝朱紅鋸齒＋放大，沒選中＝縮小變暗 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.nav-in{pointer-events:auto;max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:var(--bg-3);padding:16px 8px calc(6px + env(safe-area-inset-bottom,0px));clip-path:polygon(0 18px,100% 0,100% 100%,0 100%)}
.nav button{position:relative;background:none;border:0;color:var(--text-soft);min-height:58px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.08em;opacity:.7;transition:opacity var(--q),transform var(--s) var(--pop)}
.nav button span{position:relative;z-index:1;display:inline-block}
.nav button[aria-current="page"]{color:var(--on-red);opacity:1;font-size:19px;transform:translateY(-6px) rotate(-6deg)}
.nav button[aria-current="page"] span{-webkit-text-stroke:3px var(--bg-3);paint-order:stroke fill}
.nav button[aria-current="page"]::before{content:"";position:absolute;inset:6px -2px 4px;background:var(--red);clip-path:polygon(10% 14%,97% 0,86% 100%,0 84%);animation:navPop var(--s) var(--pop)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:-6px;right:6px;bottom:0;height:3px;background:var(--guide);transform:rotate(-4deg)}
@keyframes navPop{from{transform:scale(0) rotate(-40deg)}}
.spacer{height:96px}

/* 換頁：從點的導覽按鈕炸出朱紅星芒（後面跟一層深色星芒做厚度），網點與星星碎片墊底，頁面圖示彈出後一起縮回 */
.fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.fx .star{position:absolute;width:40px;height:40px;background:var(--red);transform:translate(-50%,-50%) scale(0);
  clip-path:polygon(50% 0,61% 32%,98% 22%,70% 50%,98% 78%,61% 68%,50% 100%,39% 68%,2% 78%,30% 50%,2% 22%,39% 32%)}
.fx .star.ink{background:var(--bg-3)}
.fx .layer{position:absolute;inset:0;opacity:0}
.fx .dots{background-image:radial-gradient(rgba(20,17,16,.45) 2.2px,transparent 2.6px);background-size:11px 11px;
  -webkit-mask:radial-gradient(circle at 50% 46%,transparent 0 30%,#000 75%);mask:radial-gradient(circle at 50% 46%,transparent 0 30%,#000 75%)}
.fx .bits i{position:absolute;left:50%;top:46%;width:26px;height:26px;background:var(--paper);transform:translate(-50%,-50%) scale(0);
  clip-path:polygon(50% 0,61% 32%,98% 22%,70% 50%,98% 78%,61% 68%,50% 100%,39% 68%,2% 78%,30% 50%,2% 22%,39% 32%)}
.fx .bits i:nth-child(even){background:var(--bg-3);width:18px;height:18px}
.fx .badge{position:absolute;left:50%;top:46%;display:grid;justify-items:center;gap:8px;transform:translate(-50%,-50%) scale(0)}
.fx .badge svg{width:min(42vw,170px);height:auto;aspect-ratio:1;overflow:visible}
.fx .badge b{font:900 24px var(--serif);background:var(--paper);color:var(--ink);padding:2px 14px;clip-path:polygon(4% 0,100% 10%,96% 100%,0 88%);transform:rotate(-4deg)}
.mast.anim .guide{animation-delay:var(--ad,0ms);animation-fill-mode:both}
.view-in{animation:viewIn var(--l) var(--ease)}
@keyframes viewIn{0%,30%{opacity:0;transform:translateX(24px)}}

/* ---------- 抽屜 ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,8,7,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);padding:26px 16px calc(20px + env(safe-area-inset-bottom,0px));clip-path:polygon(0 14px,100% 0,100% 100%,0 100%);animation:up var(--s) var(--ease)}
.sheet h3{margin:0 0 2px;font-family:var(--serif);font-weight:900;font-size:22px}
.sheet h4{margin:18px 0 8px;font-size:14px;color:var(--ink-soft);font-weight:500;letter-spacing:.08em}
.sheet p{margin:0 0 12px;color:var(--ink-soft);font-size:14.5px}
.sheet label{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:4px}
.sheet input{width:100%;border:0;box-shadow:inset 0 0 0 2px var(--ink);background:var(--paper);color:var(--ink);min-height:46px;padding:0 12px;font-size:16px}
.addstep{margin-top:16px;font-size:14.5px}
.addstep summary{color:var(--red);font-weight:500;cursor:pointer;min-height:36px;display:flex;align-items:center}
.addstep .row{display:flex;gap:10px;align-items:center;margin-top:6px}
.hint{font-size:12.5px!important;margin-top:6px!important}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:4px}
.sheet-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@keyframes up{from{transform:translateY(60px)}}

.toast{position:fixed;left:50%;bottom:104px;z-index:30;transform:translateX(-50%) rotate(-3deg);background:var(--paper);color:var(--ink);padding:10px 22px;font-size:15.5px;font-weight:900;white-space:nowrap;clip-path:var(--jag-btn);animation:toast var(--s) var(--pop)}
@keyframes toast{from{opacity:0;transform:translateX(-50%) rotate(-12deg) scale(.6)}}
.sync{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:15;font-size:12.5px;background:var(--bg-3);color:var(--text);padding:2px 10px;clip-path:var(--jag-b)}
/* ---------- 厚卡紙：卡片面在 ::before、側邊厚度在 ::after（不是陰影，是同一塊紙的側面） ----------
   厚度往右下 6px；按下時卡片沉 4px、側面剩 2px。 */
:root{
  --th:6px; --edge:#B39F6E; --edge-dark:#0B0908; --edge-red:#7A1D16;
  --hull-a:polygon(0 3px,calc(100% - var(--th)) 0,100% var(--th),calc(100% - 4px) 100%,calc(3px + var(--th)) calc(100% - 4px),3px calc(100% - 4px - var(--th)));
  --hull-rect:polygon(0 0,calc(100% - var(--th)) 0,100% var(--th),100% 100%,var(--th) 100%,0 calc(100% - var(--th)));
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--edge:#CDBA86;--edge-dark:#2A211C}}
:root[data-theme="light"]{--edge:#CDBA86;--edge-dark:#2A211C}
.panel,.col,.bubble-in,.rec,.report,.search,.pend{position:relative;isolation:isolate;clip-path:none;background:transparent;overflow:visible}
.panel::before,.bubble-in::before,.rec::before,.report::before,.search::before,.pend::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--face,var(--paper));clip-path:var(--jag-a)}
.panel::after,.bubble-in::after,.rec::after,.report::after,.search::after,.pend::after,.col::after{content:"";position:absolute;inset:0 calc(-1 * var(--th)) calc(-1 * var(--th)) 0;z-index:-2;background:var(--slab-edge,var(--edge));clip-path:var(--hull-a);transition:transform var(--q) var(--ease)}
.col::after{clip-path:var(--hull-rect)}
.col-h,.col-body{clip-path:none}
.pend{--face:var(--bg-2);--slab-edge:var(--edge-dark)}
.rec-h{position:relative}
.bubble::before{display:none}
.panel:active{transform:translate(4px,4px)}
.panel:active::after{transform:translate(-4px,-4px)}
/* 卡片不再裁切，「最終回」改成貼在上緣的標籤 */
.panel .ribbon{right:12px;top:-10px;width:auto;padding:2px 14px;letter-spacing:.2em;transform:rotate(5deg);clip-path:var(--jag-b)}
.panel.just .ribbon{animation:tagIn var(--l) var(--pop)}
@keyframes tagIn{from{transform:translateY(-24px) rotate(-12deg) scale(1.5);opacity:0}}

/* 按鈕也是厚的：朱紅面＋深紅側面，按下去會沉 */
.btn{position:relative;isolation:isolate;background:transparent;clip-path:none;box-shadow:none}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--btn-face,var(--red));clip-path:var(--jag-btn)}
.btn::after{content:"";position:absolute;inset:0 -4px -4px 0;z-index:-2;background:var(--btn-edge,var(--edge-red));transition:transform var(--q) var(--ease);
  clip-path:polygon(calc((100% - 4px) * .06) 0,calc(100% - 4px) calc((100% - 4px) * .08),100% calc((100% - 4px) * .08 + 4px),calc((100% - 4px) * .94 + 4px) 100%,4px calc((100% - 4px) * .9 + 4px),0 calc((100% - 4px) * .9))}
.btn:active{transform:translate(3px,3px)}
.btn:active::after{transform:translate(-3px,-3px)}
.btn.ghost{--btn-face:var(--bg-3);--btn-edge:#000;background:transparent;color:var(--text);box-shadow:none}
.paper .btn.ghost,.sheet .btn.ghost{--btn-face:var(--paper-2);--btn-edge:var(--edge);background:transparent;color:var(--ink);box-shadow:none}

/* ---------- 快記：P5 對話框——黑底、米白粗邊（卡片面當邊框）、朱紅名牌、左下小尾巴 ---------- */
.bubble-in{--face:#EDE3C8;padding:5px}
.dlg{position:relative;background:#141110;color:#EDE3C8;padding:22px 16px 12px;clip-path:var(--jag-b)}
.dlg textarea{color:#EDE3C8;caret-color:#E4503F;font-size:17.5px}
.dlg .cap-foot{color:#A89A7E}
.nameplate{position:absolute;left:14px;top:-18px;z-index:2;background:var(--red);color:var(--on-red);font:900 16px/1 var(--serif);letter-spacing:.24em;padding:7px 12px 7px 16px;clip-path:var(--jag-btn);transform:rotate(-5deg)}
.tail{position:absolute;left:40px;bottom:-24px;width:34px;height:26px;background:#EDE3C8;clip-path:polygon(0 0,100% 0,8% 100%)}
.tail::after{content:"";position:absolute;left:5px;top:0;width:22px;height:14px;background:#141110;clip-path:polygon(0 0,100% 0,6% 100%)}
.cap-band{padding-block:14px 48px}

/* ---------- 邊角收齊（v1.3.1） ----------
   1. 有厚度的卡片：卡片面是矩形，厚度層用矩形外殼精確對齊，轉角不會出現階梯
   2. 對話框米白邊四邊一致 5px，內外兩層平行
   3. 厚度算進版面：右、下各預留 6px，卡片＋厚度整塊留在頁面邊界內
   鋸齒形狀只留給小東西（按鈕、標籤、名牌、導覽選中塊） */
.panel::before,.bubble-in::before,.rec::before,.report::before,.search::before,.pend::before{clip-path:none}
.panel::after,.bubble-in::after,.rec::after,.report::after,.search::after,.pend::after{clip-path:var(--hull-rect)}
.panel,.col,.bubble-in,.rec,.report,.search,.pend{margin-right:var(--th);margin-bottom:var(--th)}
.panels{gap:10px}
.cols{gap:10px}
.dlg{clip-path:none}
.tail{left:40px;bottom:-22px;width:34px;height:22px;clip-path:polygon(0 0,100% 0,6% 100%)}
.tail::after{left:5px;top:-5px;width:22px;height:16px;clip-path:polygon(0 0,100% 0,5% 100%)}
.rec-h{margin:0}
.date{margin-left:7px} /* 傾斜 5° 後左下角不再戳進左側留白 */

/* ---------- 快記：關鍵字色塊 ----------
   輸入框與上層剪報字必須同字型、同字級、同行高、同斷行，游標才會對齊；每個字只轉角度、換底色，不改字寬 */
.typebox{position:relative}
.typebox textarea,.mirror{font:500 17.5px/1.9 var(--sans);letter-spacing:.04em;padding:4px 2px;margin:0;border:0;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;text-align:left}
.typebox textarea{display:block;width:100%;min-height:112px;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#E4503F}
.mirror{position:absolute;inset:0;pointer-events:none;color:#EDE3C8;overflow:hidden;background:#141110} /* 不透明：蓋住 iPhone 組字時系統畫的藍色底線 */
.mirror .sel{background:rgba(237,227,200,.32)}
.ch{display:inline-block}
.ch.han{font-weight:900}
.ch.t-paper{background:#EDE3C8;color:#141110}
.ch.t-red{background:var(--red);color:var(--on-red)}
.typebox textarea::selection{background:rgba(228,80,63,.3)}
.ch.pop{animation:chPop .26s cubic-bezier(.175,.885,.32,1.275)}
@keyframes chPop{40%{transform:scale(1.35) rotate(-4deg)}}


/* ---------- 快記：游標、注音框、貼上去 ----------
   游標＝閃爍的米白空格；打注音時注音寫在米白框框裡、框框從底部淡淡填滿；
   選字那一下，字變成一小塊剪報（黃紙底墨色字、斜的）蓋上去，再褪回米白字 */
.typebox textarea{caret-color:transparent}
.caret{position:relative;display:inline-block;width:0;height:1em;vertical-align:-.14em}
.caret[hidden]{display:none}
.caret::before{content:"";position:absolute;left:1px;top:50%;width:1em;height:1em;transform:translateY(-50%);box-shadow:inset 0 0 0 1.5px #EDE3C8;opacity:.85;animation:caretBlink 1.1s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
.cmp{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:1.04em;height:1.15em;padding:0 5px;vertical-align:-.2em;box-shadow:inset 0 0 0 1.5px #EDE3C8;
  background:linear-gradient(to top,rgba(237,227,200,.22) calc(100% * var(--g)),transparent 0)}
.zy{font:500 12.5px/1 var(--sans);letter-spacing:.02em;color:#EDE3C8;white-space:nowrap}
.ch.paste{animation:paste .5s cubic-bezier(.2,0,0,1)}
@keyframes paste{
  0%{background:#EDE3C8;color:#141110;transform:rotate(calc(var(--t) * 2)) scale(1.45);opacity:0}
  35%{background:#EDE3C8;color:#141110;transform:rotate(var(--t)) scale(.92);opacity:1}
  65%{background:#EDE3C8;color:#141110;transform:rotate(var(--t)) scale(1)}
  100%{background:transparent;color:#EDE3C8;transform:none}}

/* ---------- 內容：任務清單式（v2.0） ----------
   時間戳記（斜的深色標籤＋Anton 數字）、客戶牌（黃紙小牌＋墨色框）、斜線分隔、操作收在點開的斜切選單 */
:root{--tile:#D9C68E;--hatch-ink:repeating-linear-gradient(-60deg,rgba(46,37,33,.28) 0 2px,transparent 2px 6px);--hatch-bg:repeating-linear-gradient(-60deg,color-mix(in srgb,var(--text) 24%,transparent) 0 2px,transparent 2px 6px)}
.stamp{flex:none;display:inline-block;align-self:start;font:400 15px/1 var(--display);letter-spacing:.04em;background:var(--ink);color:var(--paper);padding:5px 8px 4px;clip-path:var(--jag-btn);transform:rotate(-4deg);white-space:nowrap;font-variant-numeric:tabular-nums}
.stamp.lg{font-size:24px;padding:6px 11px 5px}
.plate{display:inline-block;font:900 15px/1.35 var(--serif);background:var(--tile);color:var(--ink);padding:0 6px;margin-right:6px;box-shadow:inset 0 0 0 1.5px var(--ink);transform:rotate(-2deg)}
.flag{display:inline-block;font:900 12px/1 var(--sans);letter-spacing:.12em;background:var(--ink);color:var(--paper);padding:5px 9px;clip-path:var(--jag-b);vertical-align:.1em}
.state{font:900 12px/1 var(--sans);letter-spacing:.08em;padding:5px 9px;clip-path:var(--jag-b);box-shadow:none;background:var(--tone-ink);color:var(--ink)}
.state.doing{background:var(--ink);color:var(--paper)}
.cat-tag{flex:none;display:inline-block;align-self:start;font:900 13px/1 var(--serif);background:var(--ink);color:var(--paper);padding:5px 8px;clip-path:var(--jag-b)}

/* 一筆紀錄 */
.item{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:13px 32px 13px 12px;border-bottom:0;cursor:pointer;outline-offset:-3px;transition:background var(--q)}
.item+.item::before,.kcard+.item::before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;background:var(--hatch-ink)}
.item p{margin:0;font-size:15.5px;line-height:1.6;transition:opacity var(--q)}
.item::after{content:"";position:absolute;right:11px;top:50%;width:9px;height:14px;margin-top:-7px;background:var(--ink-soft);clip-path:polygon(0 0,100% 50%,0 100%,35% 50%);opacity:.55;transition:transform var(--s) var(--ease)}
.item:hover{background:rgba(46,37,33,.05)}
.item.open p{opacity:.2}
.item.open::after{transform:rotate(180deg)}
.menu{position:absolute;right:30px;top:50%;display:flex;gap:6px;transform:translate(18px,-50%) skewX(-8deg);opacity:0;pointer-events:none;transition:transform var(--s) var(--ease),opacity var(--q)}
.item.open .menu{transform:translate(0,-50%) skewX(-8deg);opacity:1;pointer-events:auto}
.menu button{border:0;background:var(--ink);color:var(--paper);font:900 13.5px var(--sans);min-height:40px;padding:0 12px;white-space:nowrap;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--red);color:var(--on-red)}
.item .flag{font-size:11px;padding:4px 7px;margin-left:4px}

/* 業務欄的案件卡 */
.k-top{align-items:center;gap:6px 8px}
.k-top .plate{font-size:17px}
.k-top .kind{font-size:13.5px;color:var(--ink-soft)}
.k-now .now{display:flex;align-items:baseline;gap:8px}
.k-now small{font-size:12px;color:var(--ink-soft);letter-spacing:.12em}
.k-now strong{font:900 20px var(--serif)}
.k-log li{display:flex;gap:10px;align-items:center;padding:5px 0}
.k-log .stamp{font-size:12.5px;padding:4px 6px 3px}

/* 連載中的案件卡 */
.panel .kind{font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
.p-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:2px}
.p-now strong{font:900 18px var(--serif)}
.p-now span{font-size:14px;color:var(--ink-soft)}
.p-foot{margin-top:6px}
.p-foot .age{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;color:var(--ink-soft)}
.p-foot .age b{font:400 28px/1 var(--display);color:var(--ink)}

/* 行程、待確認（深色底上） */
.sch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 0;border-top:0}
.sch+.sch::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hatch-bg)}
.sch .stamp{background:var(--text);color:var(--bg)}
.sch-d{font-size:15.5px}
.pend .flag{background:var(--text);color:var(--bg);margin-bottom:10px}
.pend .q q{display:inline-block;margin-right:4px}
.done-line{display:flex;gap:10px;align-items:center}
.flag.done{background:var(--bg-3);color:var(--text-soft)}

/* 時間軸 */
.rec-h{display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--ink);padding:12px 12px 0}
.rec-state{font:900 12px var(--sans);letter-spacing:.12em;color:var(--ink-soft)}
.rec-raw{padding:10px 12px 12px}
.rec-seg{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-top:0;padding:12px}
.rec-seg::before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;background:var(--hatch-ink)}

/* 客戶列表、客戶資料、往來紀錄（深色底上） */
.cl{position:relative;border-top:0}
.cl+.cl::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hatch-bg)}
.cl .r{display:inline-flex;align-items:baseline;gap:5px}
.cl .r b{font:400 28px/1 var(--display);color:var(--text)}
.kv{grid-template-columns:auto 1fr;align-items:center;gap:12px 14px;margin-top:6px}
.kv .flag{background:var(--text);color:var(--bg)}
.hist{position:relative;display:grid;grid-template-columns:auto auto 1fr;gap:8px 10px;align-items:start;border-top:0;padding:14px 0}
.hist+.hist::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hatch-bg)}
.hist .stamp{background:var(--text);color:var(--bg);font-size:13px}
.hist .cat-tag{background:var(--bg-3);color:var(--text)}
.hist p{margin:0;grid-column:1 / -1}

/* ---------- 審稿修正（v2.0） ----------
   深色面上的字一律用 --on-dark，不跟著頁面字色走；淺色模式時深色帶裡的整組顏色翻過來 */
:root{--on-dark:#DDD0B0;--on-dark-soft:#A89A7E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--on-dark:#EDE3C8;--on-dark-soft:#C2B596}
  .b-band{--text:var(--on-dark);--text-soft:var(--on-dark-soft);--bg:#3A2E28;--bg-3:#241C18;color:var(--on-dark)}}
:root[data-theme="light"]{--on-dark:#EDE3C8;--on-dark-soft:#C2B596}
:root[data-theme="light"] .b-band{--text:var(--on-dark);--text-soft:var(--on-dark-soft);--bg:#3A2E28;--bg-3:#241C18;color:var(--on-dark)}
.r1{color:var(--on-dark)}
.col-h,.col-h .cnt{color:var(--on-dark)}
.btn.ghost{color:var(--on-dark)}
.paper .btn.ghost,.sheet .btn.ghost{color:var(--ink)}
.nav button{color:var(--on-dark-soft)}
.nav button[aria-current="page"]{color:var(--on-red)}
.sync,.tag{color:var(--on-dark)}
.tag.warn{color:var(--on-caution)}
.hist .cat-tag{color:var(--on-dark)}
.flag.done{color:var(--on-dark-soft)}
/* 「今天」不是數字，不用 Anton */
.p-foot .age b.td{font:900 18px/1 var(--serif)}
/* 三欄直書欄名收緊，單筆紀錄時卡片不會空一大塊 */
.col-h{font-size:20px;padding:12px 0}
.col-h .cnt{font-size:24px;margin-top:8px}

/* ---------- v2.1：操作展開在那筆下面（不蓋住內容）、修改刪除、自由寫進度 ---------- */
.menu{position:static;grid-column:1 / -1;display:none;flex-wrap:wrap;gap:6px;transform:none;opacity:1;pointer-events:auto;padding:2px 0 0}
[data-menu].open>.menu{display:flex;animation:menuIn var(--s) var(--ease)}
/* 舊的「浮在右邊」規則（.item.open .menu 往上移半個高度）權重比較高，會把按鈕疊到內容上；這裡蓋回來，操作一律排在內容下面 */
.item.open .menu{transform:none}
@keyframes menuIn{from{opacity:0;transform:translateX(18px)}}
.menu button{transform:skewX(-8deg)}
.item.open p{opacity:1}
.item.open{background:rgba(46,37,33,.07)}
.menu button.del{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.menu button.del.arm{background:var(--red);color:var(--on-red);box-shadow:none}
.k-log li{flex-wrap:wrap;cursor:pointer;outline-offset:2px}
.k-log li.open{background:rgba(46,37,33,.07)}
.k-log .menu{flex-basis:100%;padding-left:2px}
.rec{cursor:pointer}
.rec>.menu{padding:0 12px 12px}
.sheet label{margin-top:14px}
.sheet textarea{display:block;width:100%;border:0;outline:0;box-shadow:inset 0 0 0 2px var(--ink);background:var(--paper);color:var(--ink);padding:10px 12px;font-size:16px;line-height:1.6;resize:vertical}
.sheet input:focus,.sheet textarea:focus{outline:0;box-shadow:inset 0 0 0 3px var(--red)}
.sug{margin-top:8px;min-height:0}
.sug-new{align-self:center;font-size:13.5px;color:var(--ink-soft)}
.plog{list-style:none;margin:0;padding:0}
.plog li{position:relative;display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14.5px;line-height:1.55}
.plog li+li::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hatch-ink)}
.plog .stamp{flex:none;font-size:12.5px;padding:4px 6px 3px}
.plog li{flex-wrap:wrap;cursor:pointer}
.plog li.open{background:rgba(46,37,33,.07)}
.plog .menu{flex-basis:100%}
.st-tag{display:inline-block;margin-right:6px;font:900 12px/1 var(--serif);background:var(--ink);color:var(--paper);padding:4px 7px;vertical-align:.08em}
.c-acts{margin:4px 0 14px}
.sheet .hint{margin-top:10px!important}
/* v2.2：案件卡只放最新一筆進度，完整紀錄點「＋ 進度」看 */
.k-last{display:flex;gap:10px;align-items:center;margin:10px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
.k-last .stamp{flex:none;font-size:12.5px;padding:4px 6px 3px}
.k-last.fresh{color:var(--ink);font-weight:500;animation:enter var(--s) var(--ease)}

/* ---------- v2.4：抽屜＝遊戲選單，跟快記對話框同一套 ----------
   深色 #141110 底、上緣 5px 米白框，標題是跨在上緣的朱紅名牌（不再斜切上緣）。
   裡面的顏色 token 整組換成深底版，時間戳記、標籤、按鈕、清單分隔都自動跟著反過來；深淺色模式一樣（跟對話框一致）。 */
.scrim{background:rgba(10,8,7,.72) radial-gradient(rgba(237,227,200,.07) 1.2px,transparent 1.6px) 0 0/9px 9px}
.sheet{--ink:#EDE3C8;--ink-soft:#A89A7E;--paper:#141110;--paper-2:#29221E;--tone-ink:rgba(237,227,200,.14);
  --hatch-ink:repeating-linear-gradient(-60deg,rgba(237,227,200,.22) 0 2px,transparent 2px 6px);--chip-face:#29221E;--chip-text:#C9BC9C;--warn-text:#F07060;
  position:relative;display:flex;flex-direction:column;width:100%;max-width:600px;max-height:86vh;margin-top:30px;padding:0;overflow:visible;
  background:#141110;color:#EDE3C8;border-top:5px solid #EDE3C8;clip-path:none;animation:up var(--s) var(--ease)}
.sheet h3.sheet-plate{position:absolute;left:14px;top:-24px;z-index:2;max-width:calc(100% - 40px);margin:0;padding:8px 16px 8px 18px;background:var(--red);color:var(--on-red);
  font:900 18px/1.3 var(--serif);letter-spacing:.04em;clip-path:var(--jag-btn);transform:rotate(-2.5deg);transform-origin:left bottom}
.sheet-in{overflow:auto;overscroll-behavior:contain;padding:36px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h4{color:var(--ink-soft)}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:4px}
.sheet .sheet-head p{margin:0;display:flex;align-items:baseline;gap:8px;font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft)}
.sheet-head b{font:900 19px/1.3 var(--serif);letter-spacing:0;color:#EDE3C8}
.sheet-tools{display:flex;gap:10px}
.sheet textarea{resize:none}
.sheet input,.sheet textarea{background:#1F1A17;color:#EDE3C8;box-shadow:inset 0 0 0 2px rgba(237,227,200,.4);caret-color:#E4503F}
.sheet input:focus,.sheet textarea:focus{box-shadow:inset 0 0 0 2px #EDE3C8}
.sheet .btn.ghost{--btn-face:#2E2521;--btn-edge:#0B0908;color:#EDE3C8}
.sheet [data-menu].open{background:rgba(237,227,200,.06)}
.sheet .addstep summary{color:var(--warn-text)}
/* 底部動作列：黏在抽屜底，換一塊底色跟內容分開（不用分隔線） */
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3;align-items:center;margin:22px -16px 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#1F1A17}
.sheet-foot .danger{margin-left:auto;border:0;background:transparent;color:var(--warn-text);font:900 14px var(--sans);min-height:44px;padding:0 6px;cursor:pointer;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.sheet-foot .danger.arm{background:var(--red);color:var(--on-red);text-decoration:none;padding:0 12px}

/* 階段：P5 選單式任務清單。選中的後面墊朱紅鋸齒塊、放大微斜，其他變暗；列與列之間是斜線 */
.stages{display:flex;flex-direction:column;margin-top:2px}
.stage{position:relative;isolation:isolate;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;min-height:52px;padding:6px 14px 6px 10px;border:0;background:transparent;color:var(--ink-soft);text-align:left;cursor:pointer;transition:transform var(--q) var(--ease),color var(--q)}
.stage+.stage::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;z-index:-2;background:var(--hatch-ink)}
.stage::after{content:"";position:absolute;inset:3px -4px 3px -6px;z-index:-1;background:var(--red);clip-path:polygon(1% 14%,99% 0,97% 86%,0 100%);transform:scaleX(0);transform-origin:left center;transition:transform var(--s) var(--ease)}
.stage .no{font:400 21px/1 var(--display);opacity:.75}
.stage b{font:900 17px/1.3 var(--serif)}
.stage small{display:flex;align-items:center;gap:8px;font:500 12px/1 var(--sans);letter-spacing:.1em;white-space:nowrap}
.stage em{font-style:normal;font-weight:900;background:#EDE3C8;color:#141110;padding:4px 7px;transform:rotate(-4deg)}
.stage.cur,.stage:hover{color:#EDE3C8}
.stage[aria-pressed="true"]{z-index:1;color:var(--on-red);transform:scale(1.04) rotate(-1.5deg)}
.stage[aria-pressed="true"]::after{transform:scaleX(1)}
.stage[aria-pressed="true"] .no{opacity:1}
.stage[aria-pressed="true"] em{background:#141110;color:var(--on-red)}
.stage:active{transform:scale(.97)}

/* 可選的小選項（首頁今天／週報、案件篩選、動作／產品）：不描邊，深色小塊；選中的換朱紅鋸齒塊、放大微斜。
   鋸齒只裁實心色塊，不再裁描邊（描邊被裁會斷斷續續） */
.frow button,.pick button,.tabs button{position:relative;isolation:isolate;background:transparent;box-shadow:none;clip-path:none;opacity:1;color:var(--chip-text,var(--on-dark-soft))}
.frow button::before,.pick button::before,.tabs button::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--chip-face,var(--bg-3))}
.frow button[aria-pressed="true"],.pick button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:transparent;color:var(--on-red);font-weight:900;transform:scale(1.08) rotate(-3deg)}
.frow button[aria-pressed="true"]::before,.pick button[aria-pressed="true"]::before,.tabs button[aria-pressed="true"]::before{background:var(--red);clip-path:var(--jag-btn)}

/* 業務欄的「＋ 開新案件」：跟其他次要按鈕同一套厚卡紙 */
.add-case{padding:8px 12px 16px}
/* 動作／產品的「＋ 新增」：跟其他選項同一種小塊，字用亮朱紅表示是動作；展開的輸入框跟抽屜其他輸入框一樣 */
.pick button.add-opt{color:var(--warn-text,var(--red-text));font-weight:900}
.pick button.add-opt[aria-expanded="true"]{color:var(--chip-text,var(--on-dark-soft))}
.opt-new{display:flex;gap:10px;align-items:center;margin:0 0 12px;padding:0 4px}
.opt-new[hidden]{display:none}
.opt-new input{flex:1;min-width:0}
.col-body .btn.ghost{--btn-face:var(--paper-2);--btn-edge:var(--edge);color:var(--ink)}
.menu button.del:not(.arm){box-shadow:none;background:var(--ink);color:#F07060}
.sheet .menu button.del:not(.arm){background:#2E2521}

/* ---------- v2.6：電腦版「作戰指揮室」（寬度 1100 以上） ----------
   左：固定的 P5 直式選單（選中的墊朱紅鋸齒塊、放大微斜、配頁面圖示）；中：今天；右：連載中／待確認／行程固定欄。
   手機版完全不受影響：這些元素在窄螢幕都是隱藏的。 */
.rail,.side-brand{display:none}
.nav-ic{display:none}
@media (min-width:1100px){
  body{padding:0 360px 0 216px}
  .spacer{display:none}
  .nav{top:0;bottom:0;left:0;right:auto;width:216px}
  .nav-in{height:100%;max-width:none;margin:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:32px 16px 24px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
  .side-brand{display:block;margin:0 0 30px 2px}
  .side-brand .ransom{font-size:26px}
  .side-brand small{display:block;margin-top:8px;font:400 12px/1 var(--display);letter-spacing:.14em;color:var(--on-dark-soft)}
  .nav button{min-height:64px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px;font-size:19px;text-align:left}
  .nav-ic{display:block;flex:none;width:44px;height:44px;position:relative;z-index:1;transition:transform var(--s) var(--pop)}
  .nav-ic svg{display:block;width:100%;height:100%}
  .nav button[aria-current="page"]{font-size:22px;transform:translateX(10px) rotate(-3deg)}
  .nav button[aria-current="page"] .nav-ic{transform:scale(1.15) rotate(-6deg)}
  .nav button[aria-current="page"]::before{inset:2px -14px 2px -10px}
  .nav button[aria-current="page"]::after{display:none}
  .rail{display:block;position:fixed;top:0;right:0;bottom:0;width:360px;overflow-y:auto;overscroll-behavior:contain;background:var(--bg-3);color:var(--text);padding:36px 18px 40px}
  .rail-sec+.rail-sec{margin-top:36px}
  .rail .sec-h{margin-bottom:14px}
  .rail .panels{grid-template-columns:1fr}
  .rail .aside{margin-top:10px}
  /* 中間變窄，三欄的欄名改成橫的放上面，內容才有空間 */
  .cols{grid-template-columns:1fr 1.3fr 1fr}
  .col{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .col-h{writing-mode:horizontal-tb;justify-content:space-between;padding:8px 14px;font-size:19px}
  .col-h .cnt{margin-top:0;font-size:22px}
  .today-band .cols{align-items:start}
  /* 點開的頁面在畫面中間，不從底部彈出 */
  .scrim{align-items:center}
  .sheet{max-height:84vh;margin-top:24px}
  .toast{left:calc(50% - 72px);bottom:40px}
}

/* v2.8：今日作戰簡報。上面三個大數字（Anton），下面依急迫程度分組的案件列；
   超過 14 天＝亮朱紅數字、缺件＝黃、等回覆＝暗。列與列之間是斜線，整列可點。 */
.brief-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}
.brief-sum span{display:flex;flex-direction:column;gap:4px;padding:12px 12px 10px;background:#29221E;font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft)}
.brief-sum b{font:400 34px/1 var(--display);color:#EDE3C8}
.brief-sum .hot b{color:var(--warn-text)} .brief-sum .warn b{color:#E8C21A}
.sheet h4 span{margin-left:8px;font:400 13px/1 var(--display);letter-spacing:.08em}
.brief-row{position:relative;display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;width:100%;min-height:56px;padding:10px 6px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background var(--q)}
.brief-row+.brief-row::before{content:"";position:absolute;left:6px;right:6px;top:0;height:3px;background:var(--hatch-ink)}
.brief-row:hover{background:rgba(237,227,200,.06)}
.b-who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.b-who .plate{background:#EDE1BE;color:#141110;box-shadow:none}
.b-who small{font-size:12.5px;color:var(--ink-soft)}
.b-step{font:900 15px/1.3 var(--serif)}
.b-age{display:flex;align-items:baseline;gap:3px;font-size:12px;color:var(--ink-soft);min-width:44px;justify-content:flex-end}
.b-age b{font:400 22px/1 var(--display);color:#EDE3C8}
.b-age em{font:900 13px/1 var(--serif);font-style:normal;color:#EDE3C8}
.brief-row.hot .b-age b{color:var(--warn-text)} .brief-row.warn .b-step{color:#E8C21A}
.brief-row.soft .b-step,.brief-row.soft .b-age b{color:var(--ink-soft)}
.brief-sch{display:flex;gap:12px;align-items:center;padding:8px 6px}
.stage[aria-disabled="true"]{cursor:default}
.stage[aria-disabled="true"]:active{transform:none}
/* ---------- v2.7.2：電腦螢幕上的字要清楚 ----------
   整塊傾斜的內容（對話框、三欄、案件卡、時間軸）在一般解析度的螢幕上會讓字被重新取樣而變糊，
   所以電腦版與低解析度螢幕把它們擺正，傾斜只留給標題、時間戳記、標籤這類小元件。
   滑鼠移過案件卡不再旋轉放大（看起來會晃），改成像紙片浮起來：往左上移、右下的厚度變厚。 */
@media (min-width:1100px), (max-resolution:1.5dppx){
  .bubble,.col:nth-child(n),.panel:nth-child(n),.rec:nth-child(n){transform:none}
  .panel:hover{transform:translate(-2px,-2px)}
  .panel:hover::after{transform:translate(2px,2px)}
  .panel::after{transition:transform var(--q) var(--ease)}
}
/* ---------- v2.9：三欄各有自己的樣子 ----------
   業務＝大欄，最上面「待歸案」條（還沒接到案件的業務紀錄），下面是案件看板（卡片兩張一排）；
   日誌＝時間軸手帳（時間｜線上的菱形節點｜內容），由早到晚；諮詢＝深色對話泡泡，客戶名牌跨在左上角。
   電腦與平板：業務佔左邊約三分之二，日誌與諮詢疊在右邊；手機：業務排第一。 */
.col-side{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,2.3fr) minmax(0,1fr)}}
.tray{margin:10px 10px 4px;background:var(--paper-2)}
.tray-h{display:inline-block;margin:10px 0 0 12px;font:900 12px/1 var(--sans);letter-spacing:.2em;background:var(--ink);color:var(--paper);padding:5px 8px}
.kgrid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));padding:12px 16px 6px 12px}
.kgrid .kcard{border-bottom:0;background:var(--paper-2);box-shadow:5px 5px 0 var(--edge);overflow:visible}
.kgrid .kcard .ribbon{right:8px;top:-12px;width:auto;padding:3px 12px;transform:rotate(5deg)}
.col-log .item.log{grid-template-columns:44px 14px minmax(0,1fr);gap:8px;padding:9px 32px 9px 10px}
.col-log .item.log::before{content:"";position:absolute;left:69px;right:auto;top:0;bottom:0;width:2px;height:auto;background:var(--ink-soft);opacity:.45}
.col-log .item.log:first-child::before{top:50%}
.col-log .item.log:last-of-type::before{bottom:50%}
.col-log .item.log:only-of-type::before{display:none}
.tl-t{font:400 15px/1.6 var(--display);letter-spacing:.04em;color:var(--ink);text-align:right}
.tl-dot{position:relative;z-index:1;justify-self:center;width:10px;height:10px;margin-top:8px;background:var(--ink);transform:rotate(45deg);box-shadow:0 0 0 3px var(--paper)}
.col-ask .item.ask{display:block;padding:16px 12px 18px}
.col-ask .item.ask::before,.col-ask .item.ask::after{display:none}
.ask-b{position:relative;background:#141110;color:#EDE3C8;padding:20px 12px 10px}
.ask-b::after{content:"";position:absolute;left:18px;bottom:-12px;width:18px;height:13px;background:#141110;clip-path:polygon(0 0,100% 0,8% 100%)}
.ask-who{position:absolute;left:8px;top:-12px;font:900 14px/1 var(--serif);background:#D9C68E;color:#141110;padding:5px 9px;transform:rotate(-3deg)}
.ask-b p{margin:0;font-size:15px;line-height:1.6;color:#EDE3C8}
.ask-b .flag{background:#E8C21A;color:#141110}
.ask-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.ask-t{font:400 14px/1 var(--display);letter-spacing:.06em;color:#A89A7E}
.ask-go{border:0;background:var(--red);color:var(--on-red);font:900 13px var(--sans);letter-spacing:.06em;min-height:36px;padding:0 14px;cursor:pointer;clip-path:var(--jag-btn)}
.col-ask .item.ask.open{background:transparent}
.col-ask .item.ask>.menu{margin-top:18px}
/* ---------- v2.10：委託清單／打卡紙／來電卡 ----------
   業務：每件一張有厚度的卡紙，左邊凸出的墨色方塊＝「一個字＋英文」代表目前階段；滑過方塊翻紅、卡片浮起。
   日誌：撕紙孔收據紙，時間打在左欄，每筆最多兩行、分上午／下午、紙內捲動。
   諮詢：待回覆是完整大卡；回覆過的收成通話紀錄。 */
.quests{display:grid;gap:14px;padding:6px 10px 6px 18px}
.quest{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;width:100%;min-height:76px;padding:12px 16px 12px 70px;border:0;background:var(--paper-2);color:var(--ink);text-align:left;box-shadow:5px 5px 0 var(--edge);cursor:pointer;transition:transform var(--q) var(--ease),box-shadow var(--q) var(--ease)}
.quest:hover,.quest:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--edge)}
.quest.pop{animation:pop var(--l) var(--pop)}
.q-mark{position:absolute;left:-14px;top:50%;width:66px;height:62px;margin-top:-31px;display:grid;place-content:center;text-align:center;background:var(--ink);color:var(--paper);clip-path:polygon(0 5%,100% 0,95% 100%,4% 95%);transition:background var(--q),color var(--q)}
.quest:hover .q-mark,.quest:focus-visible .q-mark{background:var(--red);color:var(--on-red)}
.q-mark b{font:900 27px/1 var(--serif)}
.q-mark small{margin-top:4px;font:400 9.5px/1 var(--display);letter-spacing:.16em}
.q-name{grid-column:1;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.q-name strong{font:900 19px/1.25 var(--serif)}
.q-name>span{font-size:13px;color:var(--ink-soft)}
.dark-tag{background:var(--ink);color:var(--paper)}
.q-meta{grid-column:1;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;min-width:0}
.q-meta .stepper{width:150px;max-width:42%;margin:0}
.q-meta em{font:900 14.5px/1.2 var(--serif);font-style:normal}
.q-meta em.lock{background:#E8C21A;color:#141110;padding:2px 7px}
.q-note{flex:1 1 140px;min-width:0;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-age{grid-column:2;grid-row:1 / 3;text-align:right}
.q-age b{display:block;font:400 28px/1 var(--display)}
.q-age span{font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
.q-age.hot b{color:#B52A20}
.quest.fin{background:transparent;box-shadow:none;outline:2px dashed rgba(46,37,33,.35);outline-offset:-2px}
.quest.fin .q-mark{clip-path:none;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.quest.fin .q-name strong,.quest.fin .q-meta{opacity:.6}
.col-biz .tray{margin:6px 10px 6px 10px}

.col-log .col-body{padding:12px}
.strip{position:relative;background:#F5ECCF;color:#2E2521;padding:14px 10px 14px 0;
  -webkit-mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) 0 0/14px 51% repeat-x,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 100%/14px 51% repeat-x;
          mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) 0 0/14px 51% repeat-x,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 100%/14px 51% repeat-x}
.p-head{display:grid;grid-template-columns:58px 1fr;font:400 11px/1 var(--display);letter-spacing:.24em;color:#6A5A4E;padding:0 0 6px}
.p-head span:first-child{text-align:center}
.p-scroll{max-height:340px;overflow-y:auto;overscroll-behavior:contain}
.p-half{display:inline-block;margin:8px 0 2px 10px;font:400 11px/1 var(--display);letter-spacing:.3em;background:#2E2521;color:#F5ECCF;padding:4px 8px}
.item.punch{grid-template-columns:58px minmax(0,1fr);gap:0;align-items:baseline;padding:7px 28px 7px 0}
.item.punch::before{content:"";position:absolute;left:0;right:0;top:0;height:0;border-top:1.5px dashed rgba(46,37,33,.35);background:none}
.p-half+.item.punch::before{display:none}
.p-t{font:400 18px/1.2 var(--display);text-align:center;color:#B52A20;border-right:2px solid #2E2521;padding-right:2px;letter-spacing:.02em}
.item.punch p{padding-left:10px;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.open .clamp2,.open .clamp3{display:block;-webkit-line-clamp:unset}
.more-t{display:block;margin-top:2px;font:900 12px var(--sans);letter-spacing:.06em;color:#B52A20;text-decoration:underline;text-underline-offset:3px}
.open .more-t{display:none}
.item.punch>.menu{grid-column:2;padding-left:10px}
.p-sum{display:flex;justify-content:flex-end;gap:6px;align-items:baseline;border-top:2px solid #2E2521;padding-top:8px;margin-top:2px;font-size:12px;letter-spacing:.14em}
.p-sum b{font:400 20px/1 var(--display)}

.col-ask .col-body{padding:12px}
.item.call{display:block;padding:0;margin-bottom:12px;background:var(--paper-2)}
.item.call::before,.item.call::after,.item.callrow::after{display:none}
.c-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);padding:6px 10px}
.c-bar b{font:400 13px/1 var(--display);letter-spacing:.3em}
.c-bar span{font:400 15px/1 var(--display)}
.c-in{display:grid;gap:6px;padding:10px 12px 12px}
.c-who{font:900 18px/1.2 var(--serif)}
.c-q{position:relative;display:block;padding-left:16px;font-size:14.5px;line-height:1.6}
.c-q::before{content:"「";position:absolute;left:-4px;top:-6px;font:900 24px var(--serif);color:var(--ink-soft)}
.c-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.warn-tag{background:#E8C21A;color:#141110}
.c-acts{display:flex;gap:8px}
.c-reply{border:0;background:var(--ink);color:var(--paper);font:900 13px var(--sans);min-height:36px;padding:0 12px;cursor:pointer}
.item.call>.menu{padding:0 12px 12px}
.c-log{margin-top:4px}
.c-log-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px;border-bottom:2px solid var(--ink)}
.c-log-h b{font:900 14px var(--serif)} .c-log-h span{font:400 14px/1 var(--display);color:var(--ink-soft)}
.item.callrow{grid-template-columns:44px auto minmax(0,1fr);gap:8px;align-items:baseline;padding:8px 2px}
.item.callrow::before{content:"";position:absolute;left:0;right:0;top:auto;bottom:0;height:0;border-bottom:1.5px dashed rgba(46,37,33,.3);background:none}
.r-t{font:400 14px/1 var(--display);color:var(--ink-soft)}
.r-w{font:900 14px var(--serif)}
.r-x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--ink-soft)}
.r-a{grid-column:2 / -1;font-size:13px;display:none}
.callrow.open .r-x{white-space:normal}
.callrow.open .r-a{display:block}
.item.callrow>.menu{grid-column:1 / -1}
.c-more{margin-top:8px;border:0;background:transparent;color:#B52A20;font:900 13.5px var(--sans);text-decoration:underline;text-underline-offset:4px;padding:6px 2px;cursor:pointer}

/* ---------- v2.11：電腦版背景城市、早上開場、結案斬殺、打卡紙時鐘、來電計時 ----------
   城市是一張固定在最底層的畫布，內容一律疊在它上面、不旋轉（v2.7.2 的規則照舊，字不會糊、不會晃）。
   電腦版：日期那一段（mast）變透明，城市從標題後面露出來；下面每一段內容是實心紙，段與段之間留縫；
   左選單和右欄九成不透明。手機版完全不變。 */
#city{display:none}
@media (min-width:1100px){
  body{background:#0B0807}
  #city{display:block;position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
  #view{position:relative;z-index:1;padding:0 26px 56px}
  #view>.band+.band{margin-top:20px}
  .nav,.rail{z-index:5}
}
/* 早上開場（電腦版）：城市整片露出來，右邊斜切進來一張「今天要追的委託」；手機仍是原本的簡報抽屜 */
.stage-brief{position:fixed;inset:0;z-index:40;display:grid;place-items:center end;padding:24px 64px 24px 24px;background:linear-gradient(90deg,rgba(11,8,7,.45),rgba(11,8,7,.78) 62%);overflow-y:auto}
.sb-panel{width:min(560px,100%);animation:sbIn .55s var(--ease) both}
.stage-brief.out .sb-panel{animation:sbOut .3s cubic-bezier(.3,0,1,1) both}
@keyframes sbIn{from{transform:translateX(115%)}to{transform:none}}
@keyframes sbOut{to{transform:translateX(120%)}}
.sb-top{display:flex;align-items:end;gap:12px;margin-bottom:10px}
.sb-top b{font:900 54px/1 var(--serif);background:var(--red);color:var(--on-red);padding:4px 16px 8px;clip-path:var(--jag-a)}
.sb-top span{font:900 15px/1.35 var(--sans);color:#EDE3C8;background:#141110;padding:5px 9px}
.sb-sub{display:inline-block;margin:0 0 12px 4px;font:400 14px/1 var(--display);letter-spacing:.4em;color:#EDE3C8;background:#141110;padding:5px 10px}
.sb-list{display:grid;gap:8px}
.sb-list .quest{animation:sbRow .45s var(--ease) both}
.sb-list .quest:nth-child(2){animation-delay:.08s} .sb-list .quest:nth-child(3){animation-delay:.16s} .sb-list .quest:nth-child(4){animation-delay:.24s} .sb-list .quest:nth-child(n+5){animation-delay:.3s}
@keyframes sbRow{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.sb-more{margin:10px 0 0;font-size:13px;color:#C9BC9C;background:rgba(11,8,7,.8);padding:6px 10px;display:inline-block}
.sb-sch{display:flex;gap:10px;align-items:center;margin-top:8px;background:rgba(11,8,7,.85);color:#EDE3C8;padding:8px 10px}
.sb-go{display:flex;justify-content:flex-end;margin-top:16px}
.sb-go .go{position:relative;isolation:isolate;border:0;background:transparent;min-height:48px;padding:0 24px;font:400 22px/1 var(--display);letter-spacing:.06em;color:#141110;cursor:pointer}
.sb-go .go::before{content:"";position:absolute;inset:0;z-index:-1;background:#EDE1BE;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.sb-go .go::after{content:"";position:absolute;inset:4px -6px -6px 4px;z-index:-2;background:var(--red);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.sb-go .go small{font:900 14px var(--sans);margin-left:8px}
.sb-go .go:active{transform:translate(3px,3px)}
.sb-go .go:focus-visible{outline:3px solid #E8C21A;outline-offset:4px}

/* 結案＝斬：白光劃過 → 城市沿刀痕裂成兩半錯開、露出底下朱紅網點 → 碎片噴出 →「完 CLEAR」蓋在裂口上 → 合回去。
   手機沒有城市：白光＋閃光＋碎片＋一條朱紅斜帶上的字（lite）。 */
.gapfill{position:fixed;inset:0;z-index:2;display:none;background:radial-gradient(rgba(11,8,7,.38) 1.6px,transparent 2.1px) 0 0/8px 8px,linear-gradient(180deg,#A3271F,#C43228 45%,#E4503F)}
.half{position:fixed;inset:0;width:100vw;height:100vh;z-index:3;pointer-events:none}
body.slashing .gapfill{display:block}
body.slashing-lite .gapfill{display:block;background:rgba(11,8,7,.6)}
body.slashing #city{visibility:hidden}
.streak{position:fixed;left:0;top:0;height:0;z-index:62;pointer-events:none;transform-origin:0 0}
.streak i{position:absolute;left:0;top:-3px;height:6px;width:100%;background:#FFF8EA;box-shadow:0 0 12px 3px rgba(255,248,234,.9),0 0 40px 10px rgba(228,80,63,.6);transform-origin:0 50%;transform:scaleX(0)}
.cutflash{position:fixed;inset:0;z-index:60;background:#FFF4E0;opacity:0;pointer-events:none}
.shard{position:fixed;z-index:59;pointer-events:none;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2)}
.cut{position:fixed;left:50%;top:50%;z-index:61;pointer-events:none;width:0;height:0}
.cut .rot{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:14px;transform:translate(-50%,-50%) rotate(var(--a))}
.cut .band{display:none;position:absolute;left:50%;top:50%;width:160vmax;height:30vh;margin:-15vh 0 0 -80vmax;transform:scaleX(0);transform-origin:0 50%;
  background:radial-gradient(rgba(11,8,7,.35) 1.6px,transparent 2.1px) 0 0/8px 8px,#C43228;box-shadow:0 -6px 0 #141110,0 6px 0 #141110}
.cut.lite .band{display:block}
.word-wrap{position:relative}
.word{display:grid;opacity:0}
.word>div{display:flex;align-items:center;gap:clamp(10px,2vw,22px);white-space:nowrap}
.word b{font:900 min(15vh,15vw)/1 var(--serif);background:#EDE1BE;color:#141110;padding:.06em .14em;box-shadow:10px 10px 0 #141110}
.word span{font:400 min(17vh,17vw)/.9 var(--display);color:#EDE1BE;letter-spacing:.02em;-webkit-text-stroke:min(.6vh,4px) #141110;paint-order:stroke fill}
.wstreak{position:absolute;left:-10%;width:120%;top:51%;height:3px;background:#FFF8EA;box-shadow:0 0 10px 2px #FFF8EA;transform:scaleX(0) rotate(-3deg);transform-origin:0 50%}
.who{opacity:0;font:900 clamp(14px,1.8vw,21px) var(--sans);background:#141110;color:#EDE1BE;padding:6px 14px;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}

/* 打卡紙：右上角一個照現實時間走的鐘；最後一筆下面一條「現在」虛線；每筆旁邊標幾小時前 */
.p-head{grid-template-columns:58px 1fr auto;align-items:center}
.p-clock{margin-right:10px;background:#2E2521;color:#E8C21A;font:400 17px/1 var(--display);letter-spacing:.05em;padding:4px 7px 3px;font-variant-numeric:tabular-nums}
.p-clock small{font-size:11px;color:#B49A20;margin-left:1px}
.p-ago{display:block;margin-top:1px;font-size:11.5px;color:#6A5A4E;letter-spacing:.04em}
.p-now{display:grid;grid-template-columns:58px 1fr;align-items:center;padding:8px 10px 2px 0}
.p-now b{font:400 16px/1 var(--display);color:#2E2521;text-align:center}
.p-now i{height:2px;margin-left:10px;background:repeating-linear-gradient(90deg,#B52A20 0 8px,transparent 8px 13px)}
.p-now span{grid-column:2;margin:4px 0 0 10px;font-size:12px;color:#6A5A4E}
/* 來電卡：沒回的那通，深色條上一盞閃的紅燈＋等了多久（每秒更新） */
.c-bar .c-led{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#E4503F;box-shadow:0 0 8px #E4503F;animation:led 1.1s steps(1) infinite;vertical-align:1px}
@keyframes led{50%{opacity:.15}}
.c-wait{font:400 12px/1 var(--display);letter-spacing:.12em;color:var(--ink-soft)}
.c-wait b{font-weight:400;font-size:15px;color:#B52A20;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- v2.12：電腦版首頁＝桌面背景版 ----------
   城市鋪滿畫面（調暗到 62%，打字時不搶眼），內容是浮在上面的實心卡：
   亮紙卡＋硬陰影＝委託（最搶眼）；牛皮打卡紙＝日誌；深色來電卡＝諮詢；右欄與選單是半透明深色小卡。
   卡片本身一律不旋轉（字才不會糊），只有標題牌、時間戳記這類小元件可以斜。顏色固定，深淺色模式一樣。 */
@media (min-width:1100px){
  body{padding:0 316px 0 222px}
  #city,.half{filter:brightness(.62) saturate(.92)}
  #view{padding:26px 24px 64px}
  /* 左選單：品牌字＋一排深色按鈕，目前那頁墊朱紅鋸齒塊 */
  .nav{width:222px;background:none}
  .nav-in{background:none;clip-path:none;padding:28px 14px 24px 26px;gap:8px}
  .nav .nav-ic{display:none}
  .side-brand{margin:0 0 22px 2px}
  .nav button{min-height:46px;padding:0 16px;gap:0;font:500 16px/1 var(--sans);letter-spacing:.06em;color:#DDD0B0;opacity:1;background:rgba(11,8,7,.82)}
  .nav button[aria-current="page"]{font:900 17px/1 var(--sans);color:#FFF4E0;background:transparent;transform:rotate(-2deg) scale(1.04)}
  .nav button[aria-current="page"] span{-webkit-text-stroke:0}
  .nav button[aria-current="page"]::before{inset:0;clip-path:polygon(4% 0,100% 6%,96% 100%,0 92%)}
  /* 右欄：透明底，一張張深色小卡 */
  .rail{width:316px;background:none;padding:26px 24px 40px 6px}
  .rc{background:rgba(11,8,7,.86);padding:14px 16px 12px;color:#DDD0B0}
  .rc+.rc{margin-top:12px}
  .rc-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:900 14px/1.2 var(--sans);letter-spacing:.2em;color:#E4503F}
  .rc-h span{font:500 12px var(--sans);letter-spacing:.06em;color:#A89A7E}
  .rc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;width:100%;padding:8px 0;border:0;border-top:1px solid rgba(221,208,176,.1);background:none;color:#DDD0B0;text-align:left;cursor:pointer;transition:color var(--q)}
  .rc-row:first-of-type{border-top:0}
  .rc-row b{font:900 15px/1.3 var(--serif);color:#EDE1BE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc-row span{font-size:13px;color:#C9BC9C} .rc-row span.lock{background:#E8C21A;color:#141110;padding:1px 6px}
  .rc-row em{font:400 14px/1 var(--display);font-style:normal;color:#A89A7E} .rc-row em.hot{color:#E4503F}
  .rc-row:hover b,.rc-row:focus-visible b{color:#FFF4E0;text-decoration:underline;text-underline-offset:4px}
  .rc-empty{margin:4px 0;font-size:13px;color:#A89A7E}
  .rc .pend{background:#221C19;clip-path:none;color:#DDD0B0;margin:6px 0 4px}
  .rc .sch{color:#DDD0B0}
}
.dk{display:grid;gap:16px}
.dk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:2px;--bg:#1F1A17;--bg-2:#29221E;--bg-3:#141110;--text:#EDE3C8;--text-soft:#C9BC9C;--paper:#EDE1BE;--ink:#2E2521}
.dk-head .ransom{font-size:30px}
.dk-en{font:400 15px/1 var(--display);letter-spacing:.3em;color:#EDE1BE;background:rgba(11,8,7,.75);padding:5px 9px}
.dk-meta{margin-left:auto;display:flex;align-items:center;gap:8px;color:#DDD0B0;background:rgba(11,8,7,.75);padding:4px 6px 4px 12px}
.dk-meta>b{font:400 22px/1 var(--display);letter-spacing:.02em;color:#EDE1BE}
.dk-meta>span:not(.tag){font-size:13px;margin-right:6px}
.dk-empty{margin:0;padding:12px 14px;font-size:14px;color:#A89A7E;background:rgba(11,8,7,.8)}
/* 記一筆：快記對話框收成一條（兩行高，打多了會自己長高） */
.dk-cap .cap-band{padding:14px 0 0;background:none}
.dk-cap .wrap{max-width:none;padding:0;margin:0}
.dk-cap .bubble{transform:none}
.dk-cap .tail{display:none}
.dk-cap .dlg{padding:18px 14px 10px}
.dk-cap .typebox textarea{min-height:66px}
.dk-cap .cap-foot{padding-top:4px}
/* 委託清單 */
.dk-board{display:grid;gap:10px}
.dk-board .quests{padding:0 6px 0 14px;gap:10px}
.dk-board .quest{background:#EDE1BE;color:#2E2521;box-shadow:6px 6px 0 rgba(11,8,7,.85)}
.dk-board .quest:hover,.dk-board .quest:focus-visible{box-shadow:8px 8px 0 rgba(11,8,7,.85)}
.dk-board .quest.fin{background:#B9AB86;box-shadow:none;outline-color:rgba(20,17,16,.45)}
.dk-board .tray{margin:0 6px 0 14px;background:#E2D4AC;color:#2E2521}
.dk-board .add-case{padding:0 6px 0 14px}
.dk-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
/* 日誌＝牛皮打卡紙：左邊一排打孔、紅色打卡時間、右上角照現實時間走的鐘、最後一條「現在」虛線 */
.tc{position:relative;background:#C9B78C;color:#141110;padding:0 0 12px 30px;
  background-image:linear-gradient(rgba(11,8,7,.05) 1px,transparent 1px);background-size:100% 26px}
.tc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;background:radial-gradient(circle at 14px 50%,#0B0807 5px,transparent 5.6px) 0 8px/30px 34px repeat-y,rgba(11,8,7,.08)}
.tc::after{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:rgba(196,50,40,.45)}
.tc-h{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 14px;border-bottom:2px solid #141110}
.tc-t{font:400 18px/1 var(--display);letter-spacing:.14em}
.tc-d{font:900 12.5px var(--sans);color:#5A4B40}
.tc-clock{margin-left:auto;background:#141110;color:#E8C21A;font:400 24px/1 var(--display);letter-spacing:.06em;padding:5px 9px 4px;font-variant-numeric:tabular-nums}
.tc-clock small{font-size:14px;color:#B49A20;margin-left:1px}
.tc-rows{display:flex;flex-direction:column;padding:2px 12px 0 14px;max-height:420px;overflow-y:auto;overscroll-behavior:contain}
.tc-half{align-self:flex-start;margin:10px 0 2px;font:900 11px/1 var(--sans);letter-spacing:.3em;color:#5A4B40}
.tc .item.punch{grid-template-columns:58px minmax(0,1fr);padding:7px 74px 7px 0;border-bottom:1px dashed rgba(11,8,7,.22);background:none}
.tc .item.punch::before,.tc .item.punch::after{display:none}
.tc .item.punch:hover,.tc .item.punch.open{background:rgba(11,8,7,.06)}
.tc .p-t{border:0;color:#A8281F;text-align:left;font-size:18px;transform:rotate(-1deg)}
.tc .item.punch p{padding-left:0;font-size:14px;line-height:1.5}
.tc .p-ago{position:absolute;right:0;top:10px;margin:0;font:500 11.5px var(--sans);color:#6F5E4E}

/* 諮詢＝深色來電卡：紅燈＋計數；沒回的那通話筒會響、計時；回過的一行一通 */
.ph{background:rgba(11,8,7,.9);border-top:4px solid #C43228;color:#DDD0B0;padding-bottom:6px}
.ph-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;font:400 15px/1 var(--display);letter-spacing:.24em;color:#EDE1BE}
.ph-bar .dot{width:9px;height:9px;border-radius:50%;background:#5A4B40}
.ph-bar .dot.on{background:#E4503F;box-shadow:0 0 10px #E4503F;animation:led 1.1s steps(1) infinite}
.ph-n{font:500 12px var(--sans);letter-spacing:.06em;color:#A89A7E}
.ph-bar em{margin-left:auto;font:900 12px var(--sans);font-style:normal;letter-spacing:.06em;color:#141110;background:#E8C21A;padding:3px 7px}
.item.ph-card{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;margin:0 10px 8px;padding:12px;background:#221C19;border-left:3px solid #E8C21A;color:#DDD0B0}

.item.ph-card:hover,.item.ph-card.open{background:#2A221E}

.ph-icon::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #E4503F;animation:pulse 2.4s infinite}
@keyframes ring{0%,40%,100%{transform:none}4%,12%,20%,28%{transform:rotate(-14deg)}8%,16%,24%,32%{transform:rotate(14deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}60%,100%{transform:scale(1.7);opacity:0}}
.ph-who{font:900 17px/1.25 var(--serif);color:#EDE1BE}
.ph-who small{margin-left:8px;font:400 13px var(--display);letter-spacing:.06em;color:#A89A7E}

.ph-wait{font:400 13px/1 var(--display);letter-spacing:.12em;color:#A89A7E} .ph-wait b{font-weight:400;color:#E8C21A;font-size:17px;font-variant-numeric:tabular-nums;margin-left:4px}
.ph-btn{border:0;min-height:34px;padding:0 12px;font:900 13px var(--sans);background:#EDE1BE;color:#141110;cursor:pointer;clip-path:none}

.ph-f .c-reply{margin-left:auto}
.ph-card>.ph-main>.menu{margin-top:8px}
.ph-card.open>.ph-main>.menu{display:flex}
.ph-log{padding:4px 14px 6px}
.ph .item.callrow{padding:7px 2px;color:#A89A7E;background:none}
.ph .item.callrow::before{border-bottom-color:rgba(221,208,176,.12)}
.ph .r-t{color:#DDD0B0}
.ph .r-w{color:#EDE1BE}
.ph .r-x{color:#A89A7E}
.ph .r-a{color:#C9BC9C}
.ph .c-more{color:#E4503F}

/* ---------- v2.12.1：閒置變夜景 ----------
   電腦版 45 秒沒動滑鼠或鍵盤，選單、內容、右欄慢慢淡出（1.2 秒），城市亮回原本的亮度；一動就立刻回來（0.25 秒）。
   淡出只改透明度，不移動、不縮放，回來時字的位置與清晰度跟原本一樣。 */
@media (min-width:1100px){
  #view,.rail,.nav-in{transition:opacity .25s var(--ease)}
  #city{transition:filter 1.2s var(--ease)}
  body.idle #view,body.idle .rail,body.idle .nav-in{opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease)}
  body.idle #city{filter:none}
}

/* ---------- v2.13：手機輕量化（寬度 1099 以下，手機與電腦不必長一樣） ----------
   1. 字型：內文、數字字裡的中文改用手機內建的蘋方（不再下載思源黑體），「唰——」改用已經載入的明朝宋，不再下載霞鶩文楷；
      標題的明朝宋與數字的 Anton 照舊，風格不變。
   2. 大塊內容（對話框、三欄、案件卡、時間軸）擺正：斜的大塊在捲動時要一直重畫。
   3. 打卡紙拿掉撕紙孔遮罩（遮罩裡捲動最吃效能），改成上下兩條虛線。
   4. 來電卡的紅燈不閃。 */
@media (max-width:1099px){
  :root{--sans:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif;--display:"Anton","PingFang TC",Impact,sans-serif;--hand:"Chiron Sung HK","PingFang TC",serif}
  .bubble,.col:nth-child(n),.panel:nth-child(n),.rec:nth-child(n){transform:none}
  .strip{-webkit-mask:none;mask:none;border-top:2px dashed rgba(46,37,33,.45);border-bottom:2px dashed rgba(46,37,33,.45)}
  .c-bar .c-led{animation:none}
}

/* 手機首頁版面：一行日期列 → 記一筆 → 黏在上面的四個大分頁 → 分頁內容（按鈕都至少 44px 高，拇指好按） */
.mh{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 6px}
.mh-date{display:flex;align-items:baseline;gap:6px}
.mh-date b{font:400 34px/1 var(--display);letter-spacing:.01em;color:var(--text);-webkit-text-stroke:2px var(--bg-3);paint-order:stroke fill}
.mh-date small{font:900 15px/1 var(--serif);color:var(--text-soft)}
.mh-acts{margin-left:auto;display:flex;gap:6px}
.mh-acts .btn{min-height:40px}
.m-cap .cap-band{padding:6px 16px 14px}
.m-cap .bubble{margin-top:10px}
.mtabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 10px 8px;background:var(--bg-3)}
.mtabs::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg-3)}
.mtabs button{position:relative;isolation:isolate;min-height:50px;border:0;background:transparent;color:var(--text-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.mtabs button span{font:900 16px/1 var(--serif);letter-spacing:.06em}
.mtabs button b{font:400 15px/1 var(--display);letter-spacing:.04em}
.mtabs button[aria-pressed="true"]{color:var(--on-red)}
.mtabs button[aria-pressed="true"]::before{content:"";position:absolute;inset:2px 0;z-index:-1;background:var(--red);clip-path:polygon(6% 4%,100% 0,94% 100%,0 94%)}
.m-dot{position:absolute;top:7px;right:calc(50% - 26px);width:9px;height:9px;border-radius:50%;background:#E8C21A;box-shadow:0 0 0 2px var(--bg-3)}
.mt-body{padding:14px 12px calc(110px + env(safe-area-inset-bottom,0px));min-height:60vh;background:var(--bg-2)}
.mt-body .quests{padding:2px 4px 2px 14px}
.mt-body .tray{margin:0 0 12px}
.mt-body .add-case{padding:14px 4px 0;display:flex;justify-content:center}
.mt-body .add-case .btn{min-height:46px;padding-inline:22px}
.mt-body .item.call{margin-bottom:12px;color:var(--ink)}
.mt-body .tray{color:var(--ink)}
.m-cap .typebox textarea{min-height:84px}
.m-empty{margin:0;padding:18px 12px;text-align:center;font-size:14.5px;color:var(--text-soft)}
.m-sec+.m-sec{margin-top:22px}
.m-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;font:900 19px/1.2 var(--serif);color:var(--text)}
.m-h span{font:500 12.5px var(--sans);color:var(--text-soft)}

/* ---------- v2.14：週報＝雜誌編排、客戶頁新增客戶 ----------
   週報是一張固定配色的雜誌紙（深淺色模式一樣）：刊頭 WEEKLY＋第幾週（朱紅大數字）→ 本週數字列 → 主欄專題＋側欄（細黑線分欄）。
   大標用 Anton／明朝宋，字距收緊；段落編號是唯一的朱紅色塊。 */
.wk{padding-block:6px 48px}
.wk .wrap{max-width:1120px}
.wk-tabs{display:flex;justify-content:flex-end;margin:0 0 12px}

.wk-brand{font:400 clamp(58px,9vw,112px)/.84 var(--display);letter-spacing:-.01em;color:#1E1916}
.wk-issue{justify-self:end;display:flex;align-items:baseline;gap:4px;font:900 18px/1 var(--serif)}
.wk-issue b{font:400 clamp(48px,6vw,72px)/.8 var(--display);color:#C43228;letter-spacing:-.02em}
.wk-tag{grid-column:1 / -1;font:900 12px/1 var(--sans);letter-spacing:.32em;border-top:1.5px solid #1E1916;padding-top:8px}
.wk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-bottom:1.5px solid #1E1916}
.wk-stats div{display:flex;align-items:baseline;gap:10px;padding:14px 16px 12px;border-right:1.5px solid #1E1916}
.wk-stats div:last-child{border-right:0}
.wk-stats b{font:400 50px/1 var(--display);letter-spacing:-.02em}
.wk-stats span{font:900 15px var(--serif)}
.wk-stats small{margin-left:3px;font:500 12px var(--sans);color:#6A5A4E}
.wk-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0 32px;margin-top:24px}
.wk-side{border-left:1.5px solid #1E1916;padding-left:28px}
.wk-sec+.wk-sec{margin-top:28px}
.wk-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;font:900 26px/1.1 var(--serif);letter-spacing:-.02em}
.wk-no{align-self:center;font:400 14px/1 var(--display);color:#F2E8CC;background:#C43228;padding:5px 6px}
.wk-h small{margin-left:auto;font:400 12px/1 var(--display);letter-spacing:.3em;color:#6A5A4E}
.wk-list,.wk-plain,.wk-next{list-style:none;margin:0;padding:0}
.wk-biz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 0;border-top:1px solid rgba(30,25,22,.22)}
.wk-biz b{font:900 18px/1.3 var(--serif)}
.wk-kind{font-size:13px;color:#6A5A4E}
.wk-st{justify-self:end;text-align:right;font-size:14px;line-height:1.5}
.wk-q{padding:10px 0;border-top:1px solid rgba(30,25,22,.22)}

@media (max-width:1099px){.wk-tabs{display:none}}
@media (max-width:760px){
  .wk{padding-inline:12px}
  .wk-paper{padding:20px 16px 24px;box-shadow:5px 5px 0 rgba(11,8,7,.85)}
  .wk-stats{grid-template-columns:repeat(2,1fr)} .wk-stats div:nth-child(2n){border-right:0} .wk-stats div:nth-child(n+3){border-top:1.5px solid #1E1916}
  .wk-stats b{font-size:40px}
  .wk-grid{grid-template-columns:1fr}
  .wk-side{border-left:0;padding-left:0;border-top:6px solid #1E1916;margin-top:24px;padding-top:18px}
  .wk-biz{grid-template-columns:auto minmax(0,1fr)} .wk-st{grid-column:1 / -1;justify-self:start;text-align:left}
