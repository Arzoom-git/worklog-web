<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>工作日誌</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作日誌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>window.WORKLOG_API = 'https://assistant-app.cbcb411012.workers.dev/'; window.WORKLOG_VERSION = '3.7.6'; if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400;500&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* v3「助理」：跟助理 App 同一套。米白木漏れ日、背景是呼吸的霧；青磁只給能點的主要動作；
   她的聲音（標題、空狀態）用宋體，介面用黑體，數字用等寬字。圓角膠囊、細線、沒有陰影堆疊。
   刻意只做淺色（使用者指定米白定調）。v2 P5 的樣式留在 git 歷史（v2.15.2）。 */
:root{
  --bg:#F4F1EA; --surf:#FBF9F4; --ink:#22251F; --soft:#4C5047; --mute:#6E7068; --line:#DCD7CB; --mark:rgba(34,37,31,.07);
  --acc:#2F6B5F; --on-acc:#F5F3EC; --warn:#A4482E; --good:#3F6B3A;
  --f-voice:"Noto Serif TC","PMingLiU",serif; --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-num:"Martian Mono",ui-monospace,monospace;
  --calm:cubic-bezier(.4,0,.2,1); --in:cubic-bezier(.4,0,1,1);
  --r-lg:28px; --r-sm:16px; --lift:0 24px 60px -32px rgba(34,37,31,.45);
  --tile:color-mix(in srgb,var(--surf) 90%,transparent);
  color-scheme:light;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(34,37,31,.18) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(34,37,31,.18);border-radius:6px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
input,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--acc)}
#fog{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,#rail,.nav{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes sink{to{opacity:0;transform:translateY(10px);filter:blur(4px)}}

/* ---------- 版面 ---------- */
main#view{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 120px}
.view-in{animation:rise 420ms var(--calm) both}
.view-out{animation:sink 180ms var(--in) forwards}
.band{margin:0 0 14px}
.wrap{display:flex;flex-direction:column;gap:14px}
.ttl{margin:6px 0 2px;font:300 clamp(34px,6vw,48px)/1.15 var(--f-voice);letter-spacing:.06em}
.ttl.md{font-size:clamp(26px,4vw,34px)}
.ttl.anim{animation:rise 640ms var(--calm) both}
.lead,.aside{margin:0;font:400 16px/1.8 var(--f-voice);color:var(--soft)}
.mast{padding:30vh 0 0;text-align:center}
.spacer{display:none}
#rail{display:none}

/* 底部導覽（手機）：一顆膠囊浮在霧上 */
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--surf) 84%,transparent);box-shadow:inset 0 0 0 1px var(--line),var(--lift);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav-in button{min-height:44px;padding:0 18px;border-radius:999px;font-size:15px;color:var(--soft);transition:background-color 180ms var(--calm),color 180ms var(--calm)}
.nav-in button:hover{color:var(--ink);background:var(--mark)}
.nav-in button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side-brand{display:none}

/* ---------- 共用元件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:15px;font-weight:500;white-space:nowrap;transition:transform 180ms var(--calm),background-color 180ms var(--calm)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:color-mix(in srgb,var(--surf) 85%,transparent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--surf)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.danger{min-height:36px;padding:0 14px;border-radius:999px;color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 40%,transparent);font-size:14px}
.danger.arm{background:var(--warn);color:var(--surf);box-shadow:none}
.plate{display:inline-block;background:var(--mark);padding:0 8px;border-radius:6px;font-weight:500;margin-right:6px;line-height:1.6}
.stamp{font:300 13px/1.6 var(--f-num);color:var(--soft);white-space:nowrap}
.stamp.lg{font-size:15px;color:var(--ink)}
.tag,.flag,.cat-tag,.st-tag,.state{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft);vertical-align:1px}
.state.doing,.dark-tag{background:var(--ink);color:var(--bg);box-shadow:none}
.flag{color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent)}
.flag.done{color:var(--good);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 45%,transparent)}
.tag.warn{color:var(--warn)}
.st-tag{margin-right:6px}
.hint{margin:0;font-size:13px;color:var(--soft)}
.co-row{display:flex;gap:8px;align-items:center}.co-row input{flex:1;min-width:0}.co-row .btn{flex:none}
.co-note:empty{display:none}.co-note{margin-top:6px}
.co-list{display:grid;gap:6px;margin-top:6px}.co-list:empty{display:none}
.co-item{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:var(--r-sm);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow 180ms var(--calm)}
.co-item:hover,.co-item:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.co-item b{display:block;font-weight:500}.co-item span{display:block;font-size:13px;color:var(--soft)}.co-item i{font-style:normal;font-family:var(--f-num)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:999px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:rise 320ms var(--calm) both}
.sync{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:15;font-size:12px;color:var(--soft);background:var(--tile);padding:3px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.fx{display:none}
.tile,.bubble,.today-col,.tc,.ph,.strip,.c-log,.rc,.wk-paper,.cd-card,.cd-sec,.filters,.cl-tools,.tray,.m-sec,.pend,.cal{background:var(--tile);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.open .clamp2,.open .clamp3{display:block;-webkit-line-clamp:unset}
.more-t{display:inline-block;margin-left:6px;font-size:12px;color:var(--acc)}
.open .more-t{display:none}
.c-more{min-height:36px;padding:0 12px;border-radius:999px;font-size:14px;color:var(--acc)}

/* ---------- 快記 ---------- */
.bubble{display:block;padding:18px 20px 14px;margin:0}
.bubble-in{display:flex;flex-direction:column;gap:6px}
.nameplate{font-size:13px;color:var(--soft);letter-spacing:.1em}
.tail{display:none}
.dlg{display:flex;flex-direction:column;gap:10px}
.typebox{position:relative;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:8px 12px;transition:box-shadow 180ms}
.typebox:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.typebox textarea,.mirror{font:400 17px/1.9 var(--f-ui);letter-spacing:.02em;padding:4px 2px;margin:0;border:0;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;text-align:left}
.typebox textarea{display:block;width:100%;min-height:112px;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:transparent;outline:0}
.mirror{position:absolute;inset:8px 12px;pointer-events:none;color:var(--ink);overflow:hidden;background:var(--bg)}
.mirror .sel{background:rgba(47,107,95,.18)}
.ch{display:inline-block}
.ch.t-paper{background:var(--mark);border-radius:4px;font-weight:500}
.ch.t-red{box-shadow:inset 0 -2px 0 var(--ink);font-weight:500}
.ch.pop{animation:chPop 320ms var(--calm)}
.ch.paste{animation:fade 260ms var(--calm)}
@keyframes chPop{40%{background:rgba(34,37,31,.16)}}
.caret{position:relative;display:inline-block;width:0;height:1em;vertical-align:-.14em}
.caret[hidden]{display:none}
.caret::before{content:"";position:absolute;left:0;top:50%;width:1.5px;height:1.15em;transform:translateY(-50%);background:var(--acc);animation:caretBlink 1.1s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
.cmp{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:1.04em;height:1.2em;padding:0 5px;vertical-align:-.2em;border-radius:6px;box-shadow:inset 0 0 0 1px var(--soft);background:linear-gradient(to top,rgba(47,107,95,.15) calc(var(--g,0)*100%),transparent 0)}
.zy{font:400 12.5px/1 var(--f-ui);color:var(--soft);white-space:nowrap}
.nav-in:empty{display:none}
#keyForm textarea{width:100%;border:0;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:12px 16px;outline:0;resize:vertical;font-family:var(--f-num);font-size:14px}
#keyForm textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
#keyForm .off{color:var(--soft)}
.cap-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.cap-foot .off{margin-right:auto;font-size:13px;color:var(--warn)}
.cap-band{margin-bottom:14px}

/* ---------- 一筆紀錄＋展開的操作 ---------- */
.item{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:12px 10px;border-radius:var(--r-sm);text-align:left;cursor:pointer;transition:background-color 180ms var(--calm)}
.item:hover,.item.open{background:var(--mark)}
.item p{margin:0;font-size:15.5px;line-height:1.6;min-width:0}
.item.new{animation:rise 520ms var(--calm) both}
.menu{grid-column:1 / -1;display:none;flex-wrap:wrap;gap:6px;padding-top:6px}
[data-menu].open>.menu,[data-menu].open .menu{display:flex;animation:fade 200ms var(--calm)}
.menu button{min-height:34px;padding:0 13px;border-radius:999px;font-size:13.5px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.menu button:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.menu button.del{color:var(--warn)}
.menu button.del.arm{background:var(--warn);color:var(--surf);box-shadow:none}

/* ---------- 案件列（questHTML）：客戶｜分段進度條｜幾天沒動 ---------- */
.quests,.panels{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 64px;gap:16px;align-items:center;width:100%;padding:15px 18px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:background-color 180ms var(--calm),transform 180ms var(--calm)}
.quest:hover{background:var(--surf)}
.quest:active{transform:scale(.99)}
.quest.pop,.quest.just{animation:rise 520ms var(--calm) both}
.q-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.q-name strong{font:400 18px/1.3 var(--f-voice)}
.q-name span{font-size:13px;color:var(--soft)}
.q-meta{display:flex;flex-direction:column;gap:7px;min-width:0}
.q-lab{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.q-lab b{font-weight:500;white-space:nowrap}
.q-lab i{font:300 12px var(--f-num);font-style:normal;color:var(--mute)}
.who{font-size:12px;padding:0 9px;border-radius:999px;white-space:nowrap;line-height:20px}
.who.me{background:var(--ink);color:var(--bg)}
.who.them{box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.who.done{color:var(--mute)}
.q-note{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-age{text-align:right;font:300 24px/1 var(--f-num)}
.q-age span{display:block;margin-top:4px;font:400 11px var(--f-ui);color:var(--soft)}
.q-age.hot{color:var(--warn)}
.quest.fin{opacity:.6;background:transparent}
.quest.lock .q-lab b{color:var(--warn)}
.stepper{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.stepper .seg{height:6px;border-radius:6px;background:rgba(34,37,31,.1);transition:background-color 420ms var(--calm)}
.stepper .seg.past{background:rgba(34,37,31,.45)}
.stepper .seg.cur{background:var(--ink)}
.stepper .seg.adv{animation:segIn 800ms var(--calm)}
@keyframes segIn{from{transform:scaleX(.2);transform-origin:left}}
.quest.lock .seg.cur{background:var(--warn)}
.quest.fin .seg{background:rgba(34,37,31,.3)}
@media (max-width:620px){.quest{grid-template-columns:minmax(0,1fr) 54px;gap:10px 12px}.q-meta{grid-column:1 / -1;grid-row:2}}
.add-case{display:flex;justify-content:flex-end}
.tray{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tray-h{font-size:13px;color:var(--soft);letter-spacing:.1em}

/* ---------- 首頁（手機）：日期列 → 記一筆 → 四個分頁 ---------- */
.mh{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.mh-date b{font:300 30px/1 var(--f-num)}
.mh-date small{margin-left:8px;font:400 16px var(--f-voice);color:var(--soft)}
.mh-acts{margin-left:auto;display:flex;gap:6px}
.m-cap .typebox textarea{min-height:84px}
.mtabs{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:2px;margin:14px 0;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--surf) 84%,transparent);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mtabs button{position:relative;flex:1;min-height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--soft)}
.mtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mtabs b{font:300 13px var(--f-num)}
.m-dot{position:absolute;top:8px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mt-body{display:flex;flex-direction:column;gap:12px;animation:fade 260ms var(--calm)}
.m-empty,.dk-empty,.rc-empty,.cd-none,.sb-more,.cal-none,.wk-none{margin:0;padding:6px 4px;font:400 16px/1.8 var(--f-voice);color:var(--soft)}
.m-sec{padding:16px;display:flex;flex-direction:column;gap:10px}
.m-h,.rc-h,.cr-h,.cd-h3{display:flex;align-items:baseline;gap:10px;margin:0;font:400 13px var(--f-ui);color:var(--soft);letter-spacing:.1em}
.m-h span,.rc-h span,.cr-h span,.cd-h3 span{margin-left:auto;letter-spacing:0}

/* 日誌：時間一欄＋內容（手機 strip、電腦 tc） */
.strip,.tc{padding:16px 14px;display:flex;flex-direction:column}
.p-head,.tc-h{display:flex;align-items:baseline;gap:10px;padding:0 6px 8px;font-size:13px;color:var(--soft);letter-spacing:.1em}
.p-clock,.tc-clock{margin-left:auto;font:300 20px var(--f-num);color:var(--ink);letter-spacing:0}
.p-clock small,.tc-clock small{font-size:12px;color:var(--mute)}
.p-scroll,.tc-rows{display:flex;flex-direction:column}
.p-half,.tc-half{padding:10px 8px 2px;font-size:12px;color:var(--mute);letter-spacing:.2em}
.item.punch{grid-template-columns:3.4em minmax(0,1fr)}
.p-t{font:300 13px/1.9 var(--f-num);color:var(--soft)}
.p-ago{display:block;font-size:12px;color:var(--mute)}
.p-now{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:12px;align-items:center;padding:10px 10px 2px;font-size:12px;color:var(--mute)}
.p-now b{font:300 13px var(--f-num);color:var(--ink)}
.p-now i{display:none}
.p-now span{border-top:1px dashed var(--line);padding-top:6px}
.p-sum{padding:8px 8px 0;font-size:13px;color:var(--soft)}
.p-sum b{font:300 15px var(--f-num);margin:0 4px;color:var(--ink)}
.tc-t{color:var(--ink);font-size:15px;letter-spacing:.1em}

/* 諮詢：沒回的一張卡（等了多久），回過的一行一通 */
.ph{padding:16px;display:flex;flex-direction:column;gap:10px}
.ph-bar{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.1em}
.ph-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ph-bar .dot.on{background:var(--warn);animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.ph-n{font-size:13px;color:var(--soft);letter-spacing:0}
.ph-bar em{margin-left:auto;font-style:normal;font-size:13px;color:var(--warn)}
.item.call,.item.ph-card{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);flex-direction:column}
.item.ph-card{flex-direction:row}
.ph-icon{display:none}
.ph-main,.c-in{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ph-who,.c-who{font:400 17px var(--f-voice)}
.ph-who small{margin-left:8px;font:300 12px var(--f-num);color:var(--soft)}
.ph-q,.c-q{margin:0;font-size:15px;color:var(--ink)}
.ph-f,.c-f{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ph-wait,.c-wait{margin-right:auto;font-size:12px;color:var(--soft)}
.ph-wait b,.c-wait b{margin-left:6px;font:300 13px var(--f-num);color:var(--ink)}
.c-bar{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.c-bar b{display:inline-flex;align-items:center;gap:6px;font-weight:500;letter-spacing:.1em}
.c-led{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.c-acts{display:flex;gap:6px}
.ph-btn,.c-reply,.ask-go{min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;background:var(--acc);color:var(--on-acc)}
.ph-btn.ghost,.ask-go{background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ph-log,.c-log{display:flex;flex-direction:column}
.c-log{padding:12px}
.c-log-h{display:flex;justify-content:space-between;padding:0 8px 6px;font-size:13px;color:var(--soft)}
.item.callrow{grid-template-columns:3.4em 4.5em minmax(0,1fr);gap:4px 10px}
.r-t{font:300 13px var(--f-num);color:var(--soft)}
.r-w{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.r-a{grid-column:3;display:none;font-size:14px;color:var(--good)}
.callrow.open .r-x{white-space:normal}
.callrow.open .r-a{display:block}

/* 追蹤：待確認、行程 */
.pend{padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pend .q{font-size:15px}
.pend q{font-family:var(--f-voice)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.done-line{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:14px;color:var(--soft)}
.day{padding:10px 4px 2px;font-size:12px;color:var(--mute);letter-spacing:.1em}
.sch{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:10px;padding:6px 4px}
.sch-d small{display:block;font-size:12px;color:var(--soft)}

/* ---------- 行程月曆 ---------- */
.cal{padding:16px;display:flex;flex-direction:column;gap:6px;background:transparent;box-shadow:none}
.rc .cal,.m-sec .cal{padding:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-title{display:flex;align-items:baseline;gap:10px}
.cal-title b{font:300 30px/1 var(--f-voice)}
.cal-title b small{font-size:16px;margin-left:2px}
.cal-wa{font:400 14px var(--f-voice);color:var(--soft)}
.cal-wa small{margin-left:6px;font:300 12px var(--f-num)}
.cal-season{display:none}
.cal-nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);font-size:18px}
.cal-nav:hover{background:var(--mark)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-w span{text-align:center;font-size:12px;color:var(--soft);padding:4px 0}
.cal-w span:first-child,.cal-w span:last-child{color:var(--mute)}
.cal-d{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:5px;border-radius:var(--r-sm);min-width:0}
.cal-d:hover{background:var(--mark)}
.cal-d b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font:300 14px var(--f-num)}
.cal-d small{font-size:10px;color:var(--warn);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal-d.we b{color:var(--mute)}
.cal-d.holi b{color:var(--warn)}
.cal-d.past{opacity:.55}
.cal-d.today b{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-d.sel b{background:var(--ink);color:var(--bg)}
.cal-d.run::before{content:"";position:absolute;left:0;right:0;bottom:3px;height:3px;background:rgba(164,72,46,.3)}
.cal-d.run-s::before{left:20%;border-radius:3px 0 0 3px}.cal-d.run-e::before{right:20%;border-radius:0 3px 3px 0}
.cal-dot{display:grid;place-items:center;min-width:5px;height:5px;border-radius:50%;background:var(--ink);font:400 9px var(--f-num);font-style:normal;color:var(--bg)}
.cal-dot:not(:empty){min-width:14px;height:14px;border-radius:7px;padding:0 3px}
.cal-x{visibility:hidden}
.cal-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.cal-lh{display:flex;align-items:baseline;gap:10px}
.cal-lh b{font:300 20px var(--f-num)}
.cal-lh span{font-size:13px;color:var(--soft)}
.cal-back{margin-left:auto;font-size:13px;color:var(--acc);min-height:32px}
.cal-notes{display:flex;flex-wrap:wrap;gap:6px}
.cal-notes span{font-size:12px;padding:0 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.cal-ev{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 4px}
.cal-t{font:300 13px var(--f-num);color:var(--soft)}
.cal-dsc small{display:block;font-size:12px;color:var(--soft)}

/* ---------- 抽屜：手機從下面浮上來、電腦在中間 ---------- */
.scrim{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(34,37,31,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade 240ms var(--calm)}
.sheet{width:100%;max-width:640px;max-height:min(88vh,860px);overflow:auto;background:var(--surf);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line),var(--lift);animation:rise 420ms var(--calm) both}
.sheet-plate{margin:0 0 6px;font:400 22px/1.35 var(--f-voice)}
.sheet-in{display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;line-height:1.7}
.sheet h4{margin:10px 0 0;font:400 13px var(--f-ui);color:var(--soft);letter-spacing:.1em}
.sheet h4 span{margin-left:8px;letter-spacing:0}
.sheet label{font-size:13px;color:var(--soft);letter-spacing:.06em;margin-top:4px}
.sheet input,.sheet textarea{width:100%;min-height:46px;border:0;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:10px 16px;outline:0;line-height:1.6;transition:box-shadow 180ms}
.sheet input:focus,.sheet textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sheet textarea{resize:vertical}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sheet-head p b{margin:0 8px;font-weight:500}
.sheet-head p span{font-size:13px;color:var(--soft)}
.sheet-tools{display:flex;gap:6px}
.sheet-foot{position:sticky;bottom:-22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px -22px -22px;padding:14px 22px calc(18px + env(safe-area-inset-bottom,0px));background:var(--surf);border-top:1px solid var(--line)}
.sheet-foot .danger{margin-left:auto}
.stages{display:flex;flex-direction:column;gap:6px}
.stage{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.stage .no{font:300 12px var(--f-num);color:var(--mute)}
.stage b{font-weight:500}
.stage small{font-size:12px;color:var(--soft)}
.stage small em{font-style:normal;margin-right:6px;color:var(--ink)}
.stage[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.stage[aria-pressed="true"] .no,.stage[aria-pressed="true"] small,.stage[aria-pressed="true"] small em{color:var(--bg)}
.stage.cur{box-shadow:inset 0 0 0 1.5px var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:38px;padding:0 15px;border-radius:999px;font-size:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.pick .add-opt{color:var(--acc)}
.sug-new{align-self:center;font-size:13px;color:var(--soft)}
.opt-new,.addstep .row{display:flex;gap:8px;align-items:center}
.addstep summary{cursor:pointer;font-size:14px;color:var(--acc);padding:6px 0}
.plog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plog li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px;border-radius:var(--r-sm);cursor:pointer}
.plog li:hover,.plog li.open{background:var(--mark)}
.brief-sum{display:flex;gap:16px;flex-wrap:wrap}
.brief-sum span{display:flex;flex-direction:column;font-size:13px;color:var(--soft)}
.brief-sum b{font:300 30px var(--f-num);color:var(--ink)}
.brief-sum .hot b{color:var(--warn)}
.brief-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;min-height:52px;padding:8px 12px;border-radius:var(--r-sm);text-align:left}
.brief-row:hover{background:var(--mark)}
.b-who small{margin-left:4px;font-size:13px;color:var(--soft)}
.b-step{font-size:14px}
.b-age{font:300 14px var(--f-num);color:var(--soft)}
.brief-row.hot .b-age{color:var(--warn)}
.brief-sch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:6px 12px}
/* 電腦版開場：中間一塊，從霧裡浮上來 */
.stage-brief{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(244,241,234,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade 400ms var(--calm)}
.sb-panel{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surf);border-radius:var(--r-lg);padding:32px 34px;box-shadow:inset 0 0 0 1px var(--line),var(--lift);display:flex;flex-direction:column;gap:14px;animation:rise 640ms var(--calm) both}
.sb-top{display:flex;align-items:baseline;gap:18px}
.sb-top b{font:300 44px/1.1 var(--f-voice)}
.sb-top span{font:400 18px/1.6 var(--f-voice);color:var(--soft)}
.sb-list{display:flex;flex-direction:column;gap:8px}
.sb-sch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.sb-go{display:flex;justify-content:flex-end;padding-top:6px}

/* ---------- 其他頁 ---------- */
.filters{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.frow>span{min-width:3em;font-size:13px;color:var(--soft)}
.frow button,.tabs button{min-height:34px;padding:0 13px;border-radius:999px;font-size:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.frow button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.tabs{display:flex;gap:6px}
.sec-h .ttl{margin:0}
.cases-band .wrap{gap:10px}
.tl-day{margin:18px 0 6px;font-size:13px;color:var(--soft);letter-spacing:.1em}
.rec{display:flex;flex-direction:column;gap:6px;padding:14px 16px;margin-bottom:8px;border-radius:var(--r-sm);background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.rec.open{box-shadow:inset 0 0 0 1px var(--ink)}
.rec-h{display:flex;align-items:center;gap:10px}
.rec-state{font-size:12px;color:var(--soft)}
.rec-raw{margin:0;font:400 16px/1.8 var(--f-voice)}
.rec-seg{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--soft)}
.back{align-self:flex-start;min-height:40px;padding:0 18px;border-radius:999px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
/* 客戶 */
.cl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cl-count{font-size:13px;color:var(--soft)}
.cl-count b{font:300 20px var(--f-num);color:var(--ink);margin-right:4px}
.cl-tools{display:flex;gap:8px;align-items:center;padding:8px;border-radius:999px}
.search{flex:1}
.search input{width:100%;min-height:44px;border:0;background:transparent;padding:0 14px;outline:0}
.cr-list{display:flex;flex-direction:column;gap:16px}
.cr-g{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-lg);background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.cr-h{padding:0 6px 4px}
button.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n d" "s s" "l l";gap:2px 10px;width:100%;padding:12px 10px;border-radius:var(--r-sm);text-align:left}
button.cr:hover{background:var(--mark)}
.cr-name{grid-area:n;display:flex;align-items:baseline;gap:6px;min-width:0}
.cr-name b{font:400 17px var(--f-voice)}
.cr-name i,.cc-alias i{font-style:normal;font-size:12px;padding:0 7px;border-radius:6px;background:var(--mark)}
.cr-st{grid-area:s;display:flex;gap:6px;flex-wrap:wrap}
.cr-st em{font-style:normal;font-size:12px;color:var(--soft)}
.cr-st em.on{color:var(--ink);font-weight:500}
.cr-st em.lk{color:var(--warn)}
.cr-last{grid-area:l;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-date{grid-area:d;font:300 13px var(--f-num);color:var(--soft)}
.cd-grid{display:grid;gap:14px}
.cd-card{padding:22px;display:flex;flex-direction:column;gap:10px}
.cd-nm{margin:0;font:300 34px/1.2 var(--f-voice)}
.cd-full{margin:0;color:var(--soft)}
.cc-alias{margin:0;display:flex;gap:6px}
.cd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0;border-block:1px solid var(--line)}
.cd-stats span{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--soft)}
.cd-stats b{font:300 22px var(--f-num);color:var(--ink)}
.cd-info{margin:0;display:flex;flex-direction:column;gap:6px}
.cd-f{display:grid;grid-template-columns:3.5em minmax(0,1fr);gap:10px;align-items:center}
.cd-f dt{font-size:13px;color:var(--soft)}
.cd-f dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd-empty{color:var(--mute)}
.cd-acts{display:flex;gap:8px;flex-wrap:wrap}
.cd-main{display:flex;flex-direction:column;gap:14px}
.cd-sec{padding:18px;display:flex;flex-direction:column;gap:10px}
.cd-tl{display:flex;flex-direction:column}
.cd-day{padding:10px 4px 4px;font-size:12px;color:var(--mute);letter-spacing:.1em}
.cd-h{display:grid;grid-template-columns:3.4em auto minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 4px}
.cd-h p{margin:0;font-size:15px}
.cd-t{font:300 13px var(--f-num);color:var(--soft)}
/* 週報 */
.wk-tabs{display:flex}
.wk-paper{padding:26px 24px;display:flex;flex-direction:column;gap:18px}
.wk-mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wk-brand{font:300 34px/1 var(--f-voice);letter-spacing:.1em}
.wk-issue{font-size:14px;color:var(--soft)}
.wk-issue b{font:300 22px var(--f-num);color:var(--ink);margin:0 4px}
.wk-tag{margin-left:auto;font-size:13px;color:var(--soft)}
.wk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.wk-stats div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.wk-stats b{font:300 30px/1.1 var(--f-num)}
.wk-stats span{font-size:13px;color:var(--soft)}
.wk-stats small{margin-left:2px}
.wk-grid{display:grid;gap:18px}
.wk-main,.wk-side{display:flex;flex-direction:column;gap:18px}
.wk-sec{display:flex;flex-direction:column;gap:8px}
.wk-h{margin:0;display:flex;align-items:baseline;gap:10px;font:400 18px var(--f-voice)}
.wk-no{font:300 12px var(--f-num);color:var(--mute)}
.wk-h small{display:none}
.wk-list,.wk-plain,.wk-next{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wk-biz{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.wk-biz b{font:400 17px var(--f-voice)}
.wk-kind{font-size:13px;color:var(--soft)}
.wk-st{font-size:14px}
.wk-q{display:flex;flex-direction:column;gap:2px}
.wk-q q{font-family:var(--f-voice);color:var(--soft)}
.wk-next li{display:flex;gap:10px;align-items:baseline}
.wk-next i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--ink);flex:none;transform:translateY(1px)}
.wk-plain li{font-size:15px}

/* ---------- 待辦：今日頁最上面的勾選清單。做完的淡掉（不畫刪除線），期限是小膠囊，過期變紅 ---------- */
.td{display:flex;flex-direction:column;gap:4px;padding:14px 16px;margin:0 0 14px;background:var(--tile);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.td-h{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;font:400 13px var(--f-ui);color:var(--soft);letter-spacing:.1em}
.td-h span{margin-left:auto;letter-spacing:0}
.td-list{display:flex;flex-direction:column}
.td-row{display:flex;align-items:center;gap:10px;min-height:44px;transition:opacity 260ms var(--calm)}
.td-chk{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:grid;place-items:center;transition:background-color 180ms var(--calm)}
.td-chk svg{width:14px;height:14px;fill:none;stroke:var(--bg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.td-chk[aria-pressed="true"]{background:var(--ink)}
.td-chk[aria-pressed="true"] svg{opacity:1}
.td-x{flex:1;min-width:0;padding:8px 0;font-size:15px;line-height:1.5;text-align:left;overflow-wrap:anywhere}
.td-due{flex:none;padding:0 9px;border-radius:999px;font:300 12px/22px var(--f-num);color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.td-due.now{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.td-due.late{color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent)}
.td-row.done{opacity:.5}
.td .c-more{align-self:flex-start}
.td-add{display:flex;gap:6px;align-items:center;margin-top:4px}
.td-add input{min-width:0;min-height:40px;border:0;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;outline:0}
.td-add input:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
#todoIn{flex:1}
#todoDue{flex:none;width:9.6em;padding:0 10px;font:300 13px var(--f-num);color:var(--soft)}
@media (max-width:620px){.td-add{flex-wrap:wrap}#todoIn{flex-basis:100%}#todoDue{flex:1}}

/* ---------- 專案：列表沿用案件列；文件關卡在進度條上多一個紅點 ---------- */
.pj-track .seg{position:relative}
.pj-track .seg.doc::after{content:"";position:absolute;left:50%;top:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--warn)}
.pj-row .q-meta{padding-top:4px}
.pj-done-h{padding:6px 6px 0}
.pj-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pj-title{min-width:0}
.pj-nm{margin:0;font:400 clamp(26px,4vw,34px)/1.2 var(--f-voice);letter-spacing:.02em}
.pj-sub{margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:14px;color:var(--soft)}
.pj-cl{color:var(--acc);font-size:15px}
.pj-acts{display:flex;flex-wrap:wrap;gap:8px}
.pj-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.pj-side{display:flex;flex-direction:column;gap:14px;min-width:0}
/* 流程：照使用者的流程圖。左欄是誰負責，右邊是關卡；文件關卡紅框；走過的淡掉、目前那關黑框＋「目前」；最後一關是深色結案 */
.pj-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pf{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:10px}
.pf-who{align-self:center;padding-bottom:14px;font-size:12px;color:var(--soft);text-align:right;letter-spacing:.04em}
.pf-box{position:relative;width:100%;margin:0 0 14px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:var(--r-sm);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.pf:not(:last-child) .pf-box::after{content:"";position:absolute;left:50%;bottom:-14px;width:1px;height:14px;background:var(--line)}
.pf-box b{font-size:15px;font-weight:500}
.pf-box small{font-size:12px;color:var(--soft)}
.pf-box em{margin-bottom:2px;padding:0 9px;border-radius:999px;background:var(--ink);color:var(--bg);font:500 12px/20px var(--f-ui);font-style:normal}
button.pf-box:hover{background:var(--bg)}
.pf.doc .pf-box{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 70%,transparent)}
.pf.doc .pf-box small{color:var(--warn)}
.pf.past .pf-box{opacity:.45}
.pf.cur .pf-box{box-shadow:inset 0 0 0 2px var(--ink)}
.pf.cur.doc .pf-box{box-shadow:inset 0 0 0 2px var(--warn)}
.pf.end .pf-box{align-items:center;background:var(--ink);color:var(--bg);box-shadow:none;opacity:.3}
.pf.end.cur .pf-box{opacity:1}
/* 報價試算：品項表（窄螢幕橫向捲動）＋合計格；含稅總計是唯一深色格 */
.qt-top{display:flex;flex-wrap:wrap;gap:10px}
.qt-top label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.qt-top input,.qt input{width:100%;min-width:0;min-height:38px;border:0;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px;outline:0}
.qt-top input:focus,.qt input:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
#qVendor{width:12em}

<script>
/* 背景的霧（助理風格）：幾團淡淡的霧慢慢飄，整片隨 4.6 秒的呼吸變濃變淡；點按、記下、換頁時撥開一圈（Fog.stir）。
   霧本來就是糊的，所以畫布只用畫面的 1/4 解析度再放大，每秒最多畫 30 次；切到背景就停，減少動態時只畫一張不動的。 */
window.Fog = (() => {
  const cv = document.getElementById('fog'), ctx = cv.getContext('2d'), SCALE = .25;
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let imps = [], last = 0;
  const fr = x => x - Math.floor(x);
  const breath = t => .5 - .5 * Math.cos(2 * Math.PI * t / 4600);
  // 霧的顏色跟著一天走（跟助理大廳同一組）：深夜沉、清晨冷藍、白天青灰綠、傍晚暖橘、晚上暗下來；米白底不變
  const TINTS = [[0, [150, 160, 156], .34], [5, [168, 182, 190], .3], [7.5, [186, 200, 204], .26], [11, [196, 204, 190], .24], [15.5, [200, 204, 184], .24], [17.5, [218, 196, 168], .28], [19.5, [178, 176, 168], .32], [24, [150, 160, 156], .34]];
  function tint() {
    const n = new Date(), h = n.getHours() + n.getMinutes() / 60; let i = 0; while (i < TINTS.length - 2 && TINTS[i + 1][0] <= h) i++;
    const [h0, c0, a0] = TINTS[i], [h1, c1, a1] = TINTS[i + 1], k = Math.min(1, Math.max(0, (h - h0) / (h1 - h0)));
    return { rgb: c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(','), a: a0 + (a1 - a0) * k };
  }
  function size(){ cv.width = Math.max(1, Math.round(innerWidth * SCALE)); cv.height = Math.max(1, Math.round(innerHeight * SCALE)); }
  function blob(x, y, r, rgb, a){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.55, `rgba(${rgb},${a * .45})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function paint(t){
    const w = innerWidth, h = innerHeight, b = breath(t), tt = t / 1000, tn = tint();
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.fillStyle = 'rgb(244,241,234)'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {
      const x = w * fr(i * .31 + .1) + Math.sin(tt * .05 + i) * 80, y = h * fr(i * .57 + .15) + Math.cos(tt * .04 + i * 1.3) * 60;
      blob(x, y, w * (.38 + .28 * fr(i * .77)) + 60, tn.rgb, tn.a + .12 * b);
    }
    imps = imps.filter(m => t - m.t < 2400);
    // 撥霧的時間戳記可能比這一格晚一點點（負數開根號會變 NaN），夾在 0 以上
    for (const m of imps) { const a = Math.max(0, (t - m.t) / 2400); blob(m.x, m.y, 40 + 170 * Math.sqrt(a) * m.s, '244,241,234', Math.pow(1 - a, 1.4)); }
  }
  function loop(t){ requestAnimationFrame(loop); if (document.hidden || t - last < 33) return; last = t; paint(t); }
  size(); addEventListener('resize', () => { size(); paint(performance.now()); });
  if (still.matches) paint(0); else requestAnimationFrame(loop);
  // 點任何按鈕都會撥一下霧
  addEventListener('pointerdown', e => { if (e.target.closest('button,a,[data-menu]')) Fog.stir(e.clientX, e.clientY, .7); }, { passive: true });
  return { stir(x, y, s = 1){ if (!still.matches) imps.push({ x, y, s, t: performance.now() }); if (imps.length > 16) imps.shift(); } };
})();
</script>

  const prevWaiting = S.station && S.station.waiting;
  Object.assign(S, state, state.settings); S.ready = true;
  // 「今天」取伺服器時間與手機時間比較晚的那個：打開 App 先顯示上次存的畫面時，日期不會停在上次那天
  const localDay = stamp(new Date()).slice(0, 10); S.today = state.now.slice(0, 10) > localDay ? state.now.slice(0, 10) : localDay;
  // 伺服器沒有快取的收件匣數量時，沿用剛剛背景問到的
  if (S.station && S.station.waiting == null && prevWaiting != null) S.station.waiting = prevWaiting;
  // 新案件建立前就勾好的申請書：伺服器回來、有真的 id 了，找到那件補送（同客戶、同動作與產品、最新的那件）
  const pf = S.pendingForms;
  if (pf && !S.cases.some(k => String(k.id).startsWith('tmp') && k.client === pf.client)) {
    const hit = S.cases.filter(k => k.client === pf.client && k.action === pf.action && k.product === pf.product).sort((a, b) => String(b.created).localeCompare(String(a.created)))[0];
    S.pendingForms = null;

}

/* 伺服器呼叫：GitHub Pages 上用 fetch 帶金鑰呼叫 Apps Script。text/plain 不會觸發 CORS 預檢。 */
const BUSY_RE = /lock|鎖|逾時|timed out|too many|頻繁|Service invoked|稍後再試/i;
const LOST = '伺服器沒有正常回應';
const READ_FNS = new Set(['getState', 'stationCount', 'fileThumbs', 'searchFiles', 'inboxList', 'company_byName', 'company_byId']);
function call(fn, ...args){
  const k = store.get(TOKEN_KEY);
  if (!k) return Promise.reject(new Error('AUTH:還沒設定金鑰'));
  S.busy++; syncTag();
  // 60 秒沒回應就放棄（不然後面排隊的操作全部卡住）；Google 偶爾回錯誤頁而不是 JSON，也當成「沒有正常回應」。
  // 這兩種情況伺服器可能其實已經做完了，所以不自動重送（重送會重複寫入），由 server() 重新整理畫面讓你確認
  // 只讀的呼叫：Google 偶爾在「拿結果」那一步回「找不到網頁」，這時馬上重問（讀取重問不會重複寫入），最多 3 次。寫入的不重送
  const read = READ_FNS.has(fn);
  // （等待上限不能太短：慢的時候一次要 20～30 秒但會成功，太早放棄反而永遠拿不到）
  const once = () => { const ctl = window.AbortController ? new AbortController() : null, timer = ctl && setTimeout(() => ctl.abort(), read ? 45000 : 60000);
    return fetch(window.WORKLOG_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ k, fn, args }), signal: ctl ? ctl.signal : undefined })
      .then(r => r.text()).then(t => { let o; try { o = JSON.parse(t); } catch (e) { throw new Error(LOST); } if (!o.ok) throw new Error(o.error); return o.data; })
      .catch(e => { throw e && e.name === 'AbortError' ? new Error(LOST) : e; }).finally(() => clearTimeout(timer)); };
  // 伺服器在忙（排程正在整理、等鎖逾時）：等一下自動再送，最多三次。這類錯誤發生在動作執行之前，重送不會重複寫入
  const attempt = n => once().catch(e => { const m = String(e && e.message); if (n < 3 && (BUSY_RE.test(m) || (read && m === LOST))) return new Promise(r => setTimeout(r, 1500 * (n + 1))).then(() => attempt(n + 1)); throw e; });
  return attempt(0).finally(() => { S.busy--; syncTag(); });
}
function syncTag(){ const el = document.getElementById('sync'); if (el) el.hidden = S.busy === 0; }
function isAuth(e){ return String(e && e.message || e).startsWith('AUTH:'); }
/* 伺服器操作一個接一個送（同時送的話，先送的可能晚回來，把畫面蓋回舊的）；全部回來才用伺服器的資料重畫 */
let chain = Promise.resolve(), inflight = 0;
function server(fn, ...args){
  inflight++;
  const p = chain.then(async () => {
    try { load(await call(fn, ...args)); }
    catch (e) {
      if (isAuth(e)) { inflight = 0; keyScreen(e.message.slice(5)); return; }
      toast(e && e.message === LOST ? '伺服器沒回應，已重新整理畫面，請確認剛剛的動作有沒有存到' : '沒存到：' + (e && e.message ? e.message : '請稍後再試'));
      try { load(await call('getState')); } catch (_) {}
    } finally { inflight = Math.max(0, inflight - 1); }
    if (inflight === 0) render();
  });
  chain = p.catch(() => {});
  return p;
}
/* 直接拿回應自己處理的呼叫（產生文件、轉專案、快記…）也排進同一條隊伍，晚送的回應不會被早送的蓋掉 */
function queued(fn, ...args){
  inflight++;
  const p = chain.then(() => call(fn, ...args)).finally(() => { inflight = Math.max(0, inflight - 1); });
  chain = p.catch(() => {});
  return p;
}
/* 對某筆紀錄送出操作。剛記下、伺服器還沒回來的紀錄（tmp）先排隊，等 addRecord 回來換成真的 id 再補送。 */
function serverItem(it, fn, ...rest){
  const real = S.realId[it.id];
  if (it.tmp && !real) { (S.later[it.tmp] = S.later[it.tmp] || []).push({ n: it.n, fn, rest }); return; }
  server(fn, real || it.id, ...rest);
}
/* 剛記下的紀錄在伺服器回來後會換成新的物件，用這個找到畫面上現在那一份 */
const live = it => S.items.find(i => i.id === it.id || i.id === S.realId[it.id]) || it;
/* 找紀錄；更新進度這類剛建立、還沒有真 id 的，請使用者稍等 */
function itemFor(id){

  if (it && String(it.id).startsWith('tmp') && !it.tmp) { toast('還在存，等一下再試'); return null; }
  return it || null;
}

/* ---------- 離線暫存 ---------- */
function readQueue(){ try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function writeQueue(q){ try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
let flushing = false;
async function flushQueue(){
  if (flushing || !navigator.onLine) return;
  const q = readQueue(); if (!q.length) return;
  flushing = true;
  let sent = 0;
  for (const rec of q) {
    try { load(await call('addRecord', rec.sendId, rec.text, rec.time)); sent++; writeQueue(readQueue().filter(r => r.sendId !== rec.sendId)); }
    catch (e) { break; }
  }
  flushing = false;
  if (sent) { render(); toast(`恢復連線，補送 ${sent} 筆`); }
}

/* 粗分（跟伺服器 roughSplit_ 同一套：待辦開頭、學到的規則、設定關鍵字），只用來讓畫面立刻有反應 */
const TODO_RE = /^(待辦|要記得|記得|TODO)\s*[:：、]?\s*/i;
function learnKey(t){
  let s = String(t || '');
  S.clients.flatMap(c => [c.name, ...c.alias]).filter(Boolean).sort((a, b) => b.length - a.length).forEach(n => { s = s.split(n).join(''); });
  s = s.replace(/[0-9０-９\s，,、。．.:：;；!！?？()（）「」『』\-—~～\/／]+/g, '');
  return s.length >= 2 ? s.slice(0, 30) : '';
}
function roughSplit(text){
  const has = (s, l) => l.some(k => k && s.includes(k));
  const rules = (S.learned || []).filter(r => r.type === '分類' && String(r.key).length >= 2).sort((a, b) => String(b.key).length - String(a.key).length);
  return text.split(/[。\n；;！!]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const todo = TODO_RE.exec(s); if (todo && s.slice(todo[0].length).trim()) s = s.slice(todo[0].length).trim();
    const c = S.clients.find(c => s.includes(c.name) || c.alias.some(a => s.includes(a)));
    const key = learnKey(s), rule = key && rules.find(r => key.includes(String(r.key)));
    const cat = todo ? '待辦' : rule ? rule.result : has(s,S.kwAsk) && !has(s,S.kwBizStrong) ? '諮詢' : has(s,S.kwBiz) ? '業務' : '日誌';
    return { cat, client:c ? c.id : '', text:s };
  });
}

/* 快記的剪報字：輸入框照常運作（輸入法、游標、選取都不變），字本身藏起來，上面疊一層完全對齊的剪報字。
   只把認得的關鍵字做成色塊：客戶名稱＝黃紙、業務關鍵字＝朱紅，其他字保持整齊米白。
   色塊只換底色、不改字寬，才能跟底下的游標對齊；關鍵字第一次被認出來時彈一下。選字（組字）時暫時顯示一般文字。 */
let mirrorPrev = '', seenKeys = new Set();
function keywordMarks(v){
  const marks = new Array(v.length).fill(''), keys = new Set();
  const mark = (word, cls) => { if (!word) return; let at = v.indexOf(word);
    while (at >= 0) { if (marks.slice(at, at + word.length).every(x => !x)) { for (let j = at; j < at + word.length; j++) marks[j] = cls; keys.add(cls + ':' + at + ':' + word); } at = v.indexOf(word, at + word.length); } };
  // 長的先標，避免「國立屏東高級中學」被「屏中」之類的短詞切開
  const clientWords = S.clients.flatMap(c => [c.name, ...c.alias]).filter(Boolean).sort((a, b) => b.length - a.length);
  clientWords.forEach(w => mark(w, 't-paper'));
  [...(S.kwBiz || []), ...(S.steps || [])].filter(Boolean).sort((a, b) => b.length - a.length).forEach(w => mark(w, 't-red'));
  return { marks, keys };
}
function syncMirror(animate, force){
  const ta = document.getElementById('cap'), m = document.getElementById('capMirror'); if (!ta || !m) return;
  const v = ta.value;
  // 內容沒變就不重畫（重畫會把正在播的貼上動畫切掉），只移動游標
  if (!force && !cmp && v === mirrorPrev) { placeCaret(); return; }
  const { marks, keys } = keywordMarks(v);
  const fresh = new Set();
  if (animate) keys.forEach(k => { if (!seenKeys.has(k)) { const [, at, w] = k.split(':'); for (let j = +at; j < +at + w.length; j++) fresh.add(j); } });
  seenKeys = keys;
  // 剛打進來的字（選字完成或直接輸入，一次最多 4 個字；大段貼上不跑動畫）：像剪報字貼上去
  let bornFrom = -1, bornTo = -1;
  if (animate && !cmp) {
    const old = mirrorPrev;
    let p = 0; while (p < v.length && p < old.length && v[p] === old[p]) p++;
    let q = 0; while (q < v.length - p && q < old.length - p && v[v.length-1-q] === old[old.length-1-q]) q++;
    if (v.length - q - p <= 4) { bornFrom = p; bornTo = v.length - q; }
  }
  let html = '';
  for (let i = 0; i < v.length; i++) {
    // 組字中（注音還沒選字）：一個米白框框，注音寫在裡面，框框依打了幾個注音從底部填滿（--g 0～1）
    if (cmp && i === cmp.start && cmp.len) {
      const zy = v.slice(cmp.start, cmp.start + cmp.len), g = Math.min(cmp.len / 3, 1);
      html += `<span class="cmp" data-i="${i}" style="--g:${g}"><b class="zy">${esc(zy)}</b></span>`;
      i += cmp.len - 1; continue;
    }
    const ch = v[i];
    if (ch === '\n') { html += `<br data-i="${i}">`; continue; }
    if (ch === ' ') { html += `<span class="s" data-i="${i}"> </span>`; continue; }
    const tile = marks[i] ? ' ' + marks[i] : '';
    const han = marks[i] && /\p{Script=Han}/u.test(ch) ? ' han' : '';
    const fx = fresh.has(i) ? ' pop' : (!marks[i] && i >= bornFrom && i < bornTo ? ' paste' : '');
    const tilt = ((ch.charCodeAt(0) * 7 + i * 13) % 11) - 5;
    html += `<span class="ch${tile}${han}${fx}" data-i="${i}" style="--t:${tilt}deg">${esc(ch)}</span>`;
  }
  m.innerHTML = html + (v.endsWith('\n') ? '&nbsp;' : '');
  mirrorPrev = v;
  ta.style.height = '0px'; ta.style.height = Math.max(ta.scrollHeight, ta.closest('.dk-cap') ? 66 : ta.closest('.m-cap') ? 84 : 112) + 'px';
  placeCaret();
}
/* 游標：閃爍的米白空格，插在下一個字的位置；有選取範圍、組字中或沒在輸入時不顯示 */
function placeCaret(){
  const ta = document.getElementById('cap'), m = document.getElementById('capMirror'); if (!ta || !m) return;
  let c = m.querySelector('.caret');
  if (!c) { c = document.createElement('i'); c.className = 'caret'; }
  c.hidden = !(document.activeElement === ta && ta.selectionStart === ta.selectionEnd && !cmp);
  const before = m.querySelector(`[data-i="${ta.selectionStart}"]`);
  if (before) m.insertBefore(c, before); else m.append(c);
  // 上層是不透明的（蓋住 iPhone 組字的藍色底線），所以選取反白由這裡自己畫
  const a = ta.selectionStart, b = ta.selectionEnd;
  m.querySelectorAll('[data-i]').forEach(el => { const i = +el.dataset.i; el.classList.toggle('sel', a !== b && i >= a && i < b); });
}
document.addEventListener('selectionchange', () => { if (document.activeElement && document.activeElement.id === 'cap') placeCaret(); });
['focusin', 'focusout', 'click', 'keyup'].forEach(t => document.addEventListener(t, e => { if (e.target.id === 'cap') setTimeout(placeCaret); }));
let cmp = null;   // 組字中的範圍 { start, len }
// 選字完成時，拿「組字開始前的內容」當比對基準，剛選進來的字才會被當成新字貼上去
let preCmp = '';
document.addEventListener('compositionstart', e => { if (e.target.id === 'cap') { preCmp = e.target.value; cmp = { start: e.target.selectionStart, len: 0 }; } });
document.addEventListener('compositionupdate', e => { if (e.target.id === 'cap' && cmp) { cmp.len = (e.data || '').length; requestAnimationFrame(() => syncMirror(false, true)); } });
document.addEventListener('compositionend', e => { if (e.target.id === 'cap') { cmp = null; mirrorPrev = preCmp; syncMirror(true); } });

/* 一筆紀錄的操作：點這筆才展開。改分類一鍵完成；刪除要按兩次 */
function itemActs(it){

/* 週報＝雜誌編排：刊頭（WEEKLY＋第幾週）→ 本週數字（大數字）→ 主欄「業務」專題（客戶名大字、動作・產品、狀態標籤）
   ＋側欄「諮詢」問答引言與「下週要追」核取清單。週報內容是排程寫的純文字（# 標題＋一行一件），在這裡拆開排版；
   認不得的段落照原文列出，不會漏。 */
function parseWeek(body){
  const secs = []; let cur = null;
  String(body || '').split('\n').forEach(l => { l = l.trim(); if (!l) return;
    if (l.startsWith('# ')) { cur = { h: l.slice(2).trim(), lines: [] }; secs.push(cur); return; }
    if (!cur) { cur = { h: '', lines: [] }; secs.push(cur); }
    cur.lines.push(l.replace(/^[-・•*]\s*/, '')); });
  return secs;
}
function weekHTML(){
  const w = S.weekly;

  if (!w) return `<section class="band wk"><div class="wrap">${top}<div class="wk-paper"><p class="wk-none">第一份週報會在週五 17:30 整理時產生。</p></div></div></section>`;
  const secs = parseWeek(w.body), pick = re => secs.find(s => re.test(s.h));
  const biz = pick(/業務/), ask = pick(/諮詢/), next = pick(/下週|要追/), sum = pick(/這週|本週|統計|數字/);
  const rest = secs.filter(s => ![biz, ask, next, sum].includes(s));
  const sumText = sum ? sum.lines.join(' ') : '', num = re => (re.exec(sumText) || [])[1];
  const stats = [['紀錄', num(/紀錄\s*(\d+)/), '筆'], ['新案件', num(/新案件\s*(\d+)/), '件'], ['結案', num(/結案\s*(\d+)/), '件'],

  const sec = (no, title, en, body) => `<section class="wk-sec"><h3 class="wk-h"><span class="wk-no">${no}</span>${esc(title)}<small>${en}</small></h3>${body}</section>`;

        ${rest.map(s => sec(n(), s.h || '其他', '', `<ul class="wk-plain">${s.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`)).join('')}</div>

/* 單一客戶＝檔案頁：左邊資料卡（簡稱大字、正式名稱、簡稱牌、電話可撥可複製、窗口、統編、備註、三個數字），
   右邊這位客戶的案件（含已結案）與往來紀錄（依日期分組的時間軸）。手機改成上下排。 */
function renderClient(c){
  const s = clientStats(c), cases = s.ks.slice().sort((a, b) => urgency(a) - urgency(b) || daysSince(b.updated) - daysSince(a.updated));
  /* 往來時間軸：這位客戶的紀錄、整理進來的檔案、案件的行程、待辦，照時間排成一條（新的在上；還沒到的行程排最上面，標「接下來」） */
  const kids = new Set(s.ks.map(k => k.id)), md = ds => String(ds || '').slice(5).replace('-', '/').replace(/^0/, '');
  const allEnt = [
    ...s.its.map(h => ({ date: h.date, time: h.time, kind: '紀錄', tag: h.cat, html: h.prog ? progHTML(h, c) : esc(bare(h.text, c)) })),
    ...(S.files || []).filter(f => f.client === c.id).map(f => ({ date: f.date || String(f.at || '').slice(0, 10), time: String(f.at || '').slice(11, 16), kind: '檔案', tag: '檔案',
      html: `<button class="tl-file" type="button" data-file="${esc(f.id)}">${thumbHTML(f.id, 'rf-th')}<span>${esc(f.type)}・${esc(f.name)}</span></button>` })),
    ...(S.events || []).filter(e => kids.has(e.case)).map(e => ({ date: e.date, time: e.t || '', kind: '行程', tag: '行程', html: esc(e.d) + (e.end && e.end !== e.date ? `<span class="tl-note">到 ${md(e.end)}</span>` : '') })),
    ...(S.todos || []).filter(t => t.client === c.id).map(t => ({ date: String(t.created || '').slice(0, 10), time: String(t.created || '').slice(11, 16), kind: '待辦', tag: '待辦',
      html: esc(t.text) + (t.done ? '<span class="tl-note">完成</span>' : t.due ? `<span class="tl-note">期限 ${md(t.due)}</span>` : '') })),
  ].filter(x => x.date).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const tlk = S.tlk || '全部', hist = tlk === '全部' ? allEnt : allEnt.filter(x => x.kind === tlk), shown = S.histAll ? hist : hist.slice(0, 30);
  const kinds = ['全部', '紀錄', '檔案', '行程', '待辦'].filter(k => k === '全部' || allEnt.some(x => x.kind === k));
  const tel = String(c.phone || '').replace(/[^0-9+]/g, '');
  const field = (label, v, extra = '') => `<div class="cd-f"><dt>${label}</dt><dd>${v ? v + extra : '<span class="cd-empty">未填</span>'}</dd></div>`;
  let day = '', tl = '';
  shown.forEach(h => { if (h.date !== day) { day = h.date; tl += `<div class="cd-day">${esc(day > S.today ? '接下來・' + mdw(day) : day===S.today ? '今天・' + mdw(day) : mdw(day))}</div>`; }
    tl += `<div class="cd-h${h.kind === '紀錄' ? '' : ' k-' + (h.kind === '檔案' ? 'file' : h.kind === '行程' ? 'ev' : 'todo')}"><span class="cd-t">${esc(h.time)}</span><span class="cat-tag">${esc(h.tag)}</span><p>${h.html}</p></div>`; });
  return `<section class="band page cd-page"><div class="wrap">
    <button class="back" data-back>← 客戶列表</button>
    <div class="cd-grid">
      <aside class="cd-card">
        <h2 class="cd-nm">${esc(nick(c))}</h2>
        <p class="cd-full">${esc(c.name)}</p>
        ${c.alias.length ? `<p class="cc-alias">${c.alias.map(a => `<i>${esc(a)}</i>`).join('')}</p>` : ''}
        <div class="cd-stats"><span><b>${s.open}</b>進行中</span><span><b>${s.wait}</b>等待中</span><span><b>${s.done}</b>結案</span><span><b>${s.its.length}</b>往來</span></div>
        <dl class="cd-info">
          ${field('電話', c.phone ? `<a class="t" href="tel:${esc(tel)}">${esc(c.phone)}</a>` : '', c.phone ? B('複製','ghost sm',`data-copy="${esc(c.phone)}"`) : '')}
          ${field('窗口', esc(c.contact || ''))}${field('統編', c.tax ? `<span class="t">${esc(c.tax)}</span>` : '')}
          ${field('地址', esc(c.addr || ''))}${field('發票抬頭', esc(c.title || ''))}${field('Email', c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '')}${field('備註', esc(c.note || ''))}
        </dl>
        <div class="cd-acts">${B('修改資料','ghost sm',`data-editclient="${c.id}"`)}${B('＋ 開新案件','sm','data-opencase')}</div>
      </aside>
      <div class="cd-main">
        <section class="cd-sec"><h3 class="cd-h3">案件<span>${cases.length} 件</span></h3>
          ${cases.length ? `<div class="quests">${cases.map(questHTML).join('')}</div>` : '<p class="cd-none">這位客戶還沒有案件</p>'}</section>
        ${(() => { const ps = (S.projects || []).filter(p => p.client === c.id).sort(pjSort);
          return ps.length ? `<section class="cd-sec"><h3 class="cd-h3">專案<span>${ps.length} 件</span></h3><div class="quests">${ps.map(projectRow).join('')}</div></section>` : ''; })()}
        ${(() => { const fs = (S.files || []).filter(x => x.client === c.id);
          return fs.length ? `<section class="cd-sec"><h3 class="cd-h3">檔案<span>${fs.length} 個</span></h3>${filesHTML(fs, '')}</section>` : ''; })()}
        <section class="cd-sec"><h3 class="cd-h3">往來時間軸<span>${hist.length} 筆${s.last ? '・最後往來 ' + esc(s.last.date===S.today ? '今天' : mdw(s.last.date)) : ''}</span></h3>
          ${kinds.length > 2 ? `<div class="frow tl-kinds" role="group" aria-label="篩選時間軸">${kinds.map(k => `<button data-tlk="${k}" aria-pressed="${tlk===k}"><span>${k}</span></button>`).join('')}</div>` : ''}

      </div>
    </div>
  </div></section>`;
}
function renderCases(){

const NAV = [['home','今日'],['timeline','時間軸'],['clients','客戶'],['cases','案件'],['projects','專案']];
/* 電腦版（寬度 1100 以上）：左邊直式選單、右邊固定欄；多一個「週報」直接進去 */
const DESK_MQ = matchMedia('(min-width:1100px)');
const DESK = () => DESK_MQ.matches;
DESK_MQ.addEventListener?.('change', () => render());
const navItems = () => DESK() ? [NAV[0], ['week','週報'], ...NAV.slice(1)] : NAV;
const navCurrent = id => id==='week' ? S.view==='home' && S.homeTab==='week'

function render(pageChange){

  // 報價試算還沒存檔時重畫（例如別的操作的伺服器回應回來了），先記下正在填的內容，畫完再填回去
  const qEl = document.getElementById('quote'); if (qEl && S.view === 'projects' && S.projectId === qEl.dataset.quote) S.qDraft = Object.assign({ id: qEl.dataset.quote }, quoteRead());

  }

  document.getElementById('nav').innerHTML = (DESK() ? `<div class="side-brand" title="工作日誌 v${esc(window.WORKLOG_VERSION||'')}">${document.getElementById('logoTpl').innerHTML}</div>` : '')
    + navItems().map(([id,l])=>`<button data-nav="${id}" ${navCurrent(id)?'aria-current="page"':''}><span>${l}</span></button>`).join('');

  syncCity();

  S.items.forEach(i => delete i.fresh); S.flash=[]; S.bump=[]; S.adv=null; S.justClosed=null; S.anim=false; S.animDelay=0;

/* 導覽換頁：舊頁往下沉、霧被撥一下、新頁從霧裡浮上來（約 0.4 秒；減少動態時直接換） */
let navBusy = false;
function navTo(view, btn){
  const go = () => { if (view==='week') { S.view='home'; S.homeTab='week'; } else { S.view = view; if (view==='home') S.homeTab='today'; } S.clientId = null; S.projectId = null; S.qDraft = null; S.anim = true; render(true); scrollTo(0,0); };
  if (navBusy) return;
  if (navCurrent(view) && !S.clientId && !S.projectId) return;
  if (btn && window.Fog) { const r = btn.getBoundingClientRect(); Fog.stir(r.left + r.width / 2, r.top + r.height / 2, 1); }
  const v = document.getElementById('view');
  if (document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) { go(); return; }
  navBusy = true; v.classList.add('view-out');
  setTimeout(() => { v.classList.remove('view-out'); go(); navBusy = false; }, 180);
}
function sheet(html){

    <h3 class="sheet-plate" id="sheetTitle">${title}</h3><div class="sheet-in">${body}</div></div></div>`;
  o.querySelector('.sheet textarea, .sheet input, .sheet button')?.focus({ preventScroll: true });
  hydrateThumbs();
}
const closeSheet = () => { document.getElementById('overlay').innerHTML = ''; S.sheetCase = null; S.fpOpen = false; if (City.on) City.setFocus(null); };

/* 案件進度：寫一句這次的進度（自由寫），要換階段再點一個；兩者至少一個。下面列出這個案件所有的進度紀錄 */
function progSheet(k, keep={}){
  const c = client(k.client);
  S.pstep = keep.pick || ''; S.sheetCase = k.id;

    ${(S.forms || []).length ? `<div class="pf-forms"><h4>申請書<span>${(k.forms || []).length ? (k.forms || []).length + ' 份' : '還沒選'}</span></h4>${formChips(k.forms)}${B((k.forms || []).length ? '改申請書' : '選申請書', 'ghost sm', `data-fmforms="${k.id}"`)}</div>` : ''}

      <p class="hint">加入後，所有案件都能選</p></details>

    ${hist.length?`<h4>進度紀錄</h4><ul class="plog">${hist.map(h=>`<li data-menu tabindex="0" role="button" aria-expanded="false" aria-label="${esc(h.text)}，點開操作">${tstamp(h.date.slice(5).replace('-','/')+' '+h.time)}<span>${progHTML(h, c)}</span>${itemActs(h)}</li>`).join('')}</ul>`:''}`);
}
/* 今天的簡報：每天第一次打開跳出還沒結案的案件（一天一次，記在這台裝置），最急的排最前面；點一列直接打開那件的進度 */
const BRIEF_KEY = 'worklog-brief';
function showBrief(force){
  if (!S.ready) return;
  const day = stamp(new Date()).slice(0, 10);
  if (!force && store.get(BRIEF_KEY) === day) return;
  const open = S.cases.filter(k => k.status !== '已結案');
  if (!open.length && !force) return;
  store.set(BRIEF_KEY, day);
  const old = k => daysSince(k.updated) > 14, lack = k => /缺件/.test(k.progress);
  const byAge = (a, b) => daysSince(b.updated) - daysSince(a.updated);
  const groups = [
    ['超過 14 天沒動', 'hot', open.filter(old)],
    ['缺件中', 'warn', open.filter(k => !old(k) && lack(k))],
    ['要你推進', '', open.filter(k => !old(k) && !lack(k) && k.status === '進行中')],
    ['等回覆', 'soft', open.filter(k => !old(k) && !lack(k) && k.status === '等待中')],
  ].map(([t, cls, list]) => [t, cls, list.sort(byAge)]);
  const row = (k, cls) => { const c = client(k.client), d = daysSince(k.updated);
    return `<button class="brief-row ${cls}" data-prog="${k.id}"><span class="b-who">${plate(c)}<small>${esc(k.action)}・${esc(k.product)}</small></span>
      <span class="b-step">${esc(shortStep(k.progress))}</span><span class="b-age">${d === 0 ? '<em>今天</em>' : `<b>${d}</b>天`}</span></button>`; };
  const [n] = [new Date()], wd = '日一二三四五六'[n.getDay()];
  const todaySch = S.sched.filter(x => x.day === '今天');
  if (DESK()) { briefStage(groups.flatMap(g => g[2]), todaySch); return; }
  sheet(`<h3>今天的簡報・${n.getMonth() + 1}/${n.getDate()}（${wd}）</h3>
    <div class="brief-sum">${groups.slice(0, 2).concat([groups[3]]).map(([t, cls, l]) => `<span class="${cls}"><b>${l.length}</b>${t.replace(" 沒動", "")}</span>`).join('')}</div>
    ${open.length ? groups.filter(g => g[2].length).map(([t, cls, l]) => `<h4>${t}<span>${l.length} 件</span></h4>${l.map(k => row(k, cls)).join('')}`).join('')
      : '<p>沒有未結案的案件。</p>'}
    ${todaySch.length ? `<h4>今天的行程</h4>${todaySch.map(x => `<div class="brief-sch">${tstamp(x.t)}<span>${esc(x.d)}</span></div>`).join('')}` : ''}
    <div class="sheet-foot">${B('開始今天','','data-close')}</div>`);
}

/* 電腦版開場：最急的五件用案件列列出（點一件直接開進度），其餘幾件、今天的行程，按「開始今天」收掉 */

/* 從一句話猜客戶名稱、動作、產品，確認畫面先幫忙選好（使用者可以改） */
const guessName = t => { const m = String(t).match(/「([^」]{2,20})」/) || String(t).match(/^(\S{2,12})\s+\S/); return m ? m[1] : ''; };
const guessAction = t => { const a = /續約/.test(t) ? '續約' : /退租|解約|拆機/.test(t) ? '退租' : /新申辦|新辦|新租|新組|申辦|新裝|新申請/.test(t) ? '新租' : ''; return S.actions.includes(a) ? a : ''; };
const guessProduct = t => S.products.find(p => p !== '其他' && t.includes(p))
  || [['行動',/門號|手機|行動/],['光世代',/光世代|光纖|寬頻/],['市話',/市話|電話線/],['SIM 卡',/SIM/i]].find(([p, re]) => S.products.includes(p) && re.test(t))?.[0] || '';

/* 歸到案件／開新案件／確認業務。it 是 null 時從業務欄直接開；confirm＝剛分到業務，順手確認。
   紀錄沒有客戶時要填客戶（打字時列出相符的既有客戶，沒有就建新的） */
function caseSheet(it, confirm=false){
  const c = it ? client(it.client) : null, open = c ? S.cases.filter(k=>k.client===c.id && k.status!=='已結案') : [];
  const t = it ? it.text : '';
  S.ncItem = it; S.pstep = '';
  S.nc = { a: guessAction(t) || null, p: guessProduct(t) || null };
  const title = !it ? '開新案件' : confirm ? '確認這件業務' : it.cat==='諮詢' ? '轉成業務案件' : '歸到哪個案件？';
  sheet(`<h3>${title}</h3>${it?`<p>${c?esc(nick(c))+'：':''}${esc(bare(t, c))}</p>`:''}
    ${open.length?`<h4>${esc(nick(c))} 進行中的案件</h4><div class="acts">${open.map(k=>B(`${esc(k.action)}・${esc(k.product)}（${esc(shortStep(k.progress))}）`,'sm',`data-link="${k.id}"`)).join('')}</div><h4>或開新案件</h4>`:''}
    ${c?'':`<label for="ncClient">客戶</label><input id="ncClient" autocomplete="off" value="${esc(guessName(t))}"><div class="pick sug" id="ncSug"></div>`}
    ${pickRow('a')}
    ${pickRow('p')}

/* 公司統編查詢：用正式名稱（沒填就用第一個簡稱）找候選，點一家就填入統編；地址、發票抬頭只補空的，不蓋掉你填過的 */
const coErr = e => { const m = String(e && e.message || e); return /未知的功能/.test(m) ? '目前接的資料服務還沒有這個功能' : '查不到：' + m.replace(/^[A-Z]+:/, ''); };
async function coFind(){
  const $ = id => document.getElementById(id);
  const name = ($('cfName').value.trim() || $('cfAlias').value.split(/[、,，\s]+/).filter(Boolean)[0] || '').trim();
  const note = $('coNote'), list = $('coList');
  if (!name) { note.textContent = '先填正式名稱或簡稱，再按「用名稱查」'; $('cfName').focus(); return; }
  note.textContent = `查「${name}」中…`; list.innerHTML = '';
  try {
    const r = await call('company_byName', name, 5);
    if (!document.getElementById('coList')) return;   // 查的時候已經關掉了
    if (r.status !== 'ok') { note.textContent = r.status === 'vague' ? '名稱太籠統，多打幾個字試試' : `找不到「${name}」：只收公司，不含行號、工作室，也查不到已歇業的`; return; }
    S.coCands = r.candidates;
    note.textContent = r.confident ? '點一下就填入統編' : '有幾家很像，確認是哪一家再點';
    list.innerHTML = r.candidates.map((c, i) => `<button type="button" class="co-item" data-copick="${i}"><b>${esc(c.name)}</b><span><i>${esc(c.id)}</i>${c.address ? '・' + esc(c.address) : ''}</span></button>`).join('');
  } catch (e) { note.textContent = coErr(e); }
}
function coPick(i){
  const $ = id => document.getElementById(id), c = S.coCands && S.coCands[i];
  if (!c || !$('cfTax')) return;
  $('cfTax').value = c.id;
  const filled = ['統編'];
  if (c.address && !$('cfAddr').value.trim()) { $('cfAddr').value = c.address; filled.push('地址'); }
  const nm = $('cfName').value.trim();
  if (!nm) { $('cfName').value = c.name; filled.push('正式名稱'); }
  else if (nm !== c.name && !$('cfTitle').value.trim()) { $('cfTitle').value = c.name; filled.push('發票抬頭'); }
  $('coList').innerHTML = '';
  $('coNote').textContent = `已填入${filled.join('、')}（${c.name}），記得按存檔`;
}
async function coCheck(){
  const inp = document.getElementById('cfTax'), note = document.getElementById('coNote');
  const v = inp && inp.value.trim();
  if (!v || !note) return;
  try {
    const r = await call('company_byId', v);
    if (document.getElementById('cfTax') !== inp || inp.value.trim() !== v) return;   // 已經改了或關掉了
    note.textContent = r.status === 'ok' ? `✓ ${r.company.name}` : r.message;
  } catch (e) { note.textContent = coErr(e); }
}

document.addEventListener('change', e => { if (e.target && e.target.id === 'cfTax') coCheck(); });

/* ---------- 待辦 ----------
   今日頁最上面的勾選清單：業務以外要記得做的事。沒做完的照「過期→今天→有期限→沒期限」排；做完的淡掉，留到隔天。 */
const dueLabel = d => { if (!d) return ''; const n = -daysSince(d); return n < 0 ? `過期 ${-n} 天` : n === 0 ? '今天' : n === 1 ? '明天' : `${+d.slice(5,7)}/${+d.slice(8)}`; };
function todoSorted(){
  const all = S.todos || [];
  const open = all.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || String(a.created).localeCompare(String(b.created)));
  const done = all.filter(t => t.done).sort((a, b) => String(b.done).localeCompare(String(a.done)));
  return { open, done };
}
function todoRow(t){
  const late = t.due && !t.done && t.due < S.today;
  return `<div class="td-row${t.done ? ' done' : ''}">
    <button class="td-chk" data-todo="${t.id}" aria-pressed="${!!t.done}" aria-label="${t.done ? '取消勾選' : '勾選完成'}：${esc(t.text)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.5 6.6 11.4 12.6 4.8"/></svg></button>
    <button class="td-x" data-todoedit="${t.id}">${esc(t.text)}</button>
    ${t.due ? `<span class="td-due${late ? ' late' : ''}${t.due === S.today && !t.done ? ' now' : ''}">${dueLabel(t.due)}</span>` : ''}
  </div>`;
}
/* compact：手機只先列 3 件，其餘收起來 */

    <h3 class="td-h">待辦<span>${open.length ? open.length + ' 件沒做完' : '都做完了'}</span></h3>

/* ---------- 專案 ----------
   多方協作的工程案，關卡固定（使用者的流程圖）：每關有負責的人（球在誰手上），報價、驗收單、交發票三關要準備文件。
   列表跟案件同一種一列式（關卡名＋換你／等誰＋第幾關＋分段進度條，文件關卡的格子有紅色記號）；點進去是流程、報價試算、文件、進度紀錄。 */
const pjSteps = () => S.projectSteps || [];
const pjById = id => (S.projects || []).find(p => p.id === id);
const PJ_N = () => pjSteps().length;
const pjStepName = (p, i) => i >= PJ_N() ? '結案' : i === 8 ? (p.scale === '大案' ? '會同廠商現場驗收、用印' : '客戶確認並用印') : pjSteps()[i].name;
const pjBall = p => p.stage >= PJ_N() ? '' : pjSteps()[p.stage].who;
const pjBallTag = p => { const w = pjBall(p); return !w ? '<span class="who done">結案</span>' : w === '我' ? '<span class="who me">換你</span>' : `<span class="who them">等${esc(w)}</span>`; };
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
function pjTrack(p){
  return `<span class="stepper pj-track" style="--n:${PJ_N()}" role="img" aria-label="第 ${Math.min(p.stage + 1, PJ_N())} 關，共 ${PJ_N()} 關">${pjSteps().map((s, i) =>
    `<span class="seg${i < p.stage ? ' past' : ''}${i === p.stage ? ' cur' : ''}${s.doc ? ' doc' : ''}"></span>`).join('')}</span>`;
}
function projectRow(p){
  const c = client(p.client), fin = p.stage >= PJ_N(), d = daysSince(p.updated);
  return `<button class="quest pj-row${fin ? ' fin' : ''}" data-proj="${p.id}" aria-label="${esc(c ? c.name : '')} ${esc(p.name)}，${esc(pjStepName(p, p.stage))}，點開專案">
    <span class="q-name"><strong>${esc(c ? c.name : '未指定客戶')}</strong><span>${esc(p.name)}${p.scale === '大案' ? '・大案' : ''}</span></span>
    <span class="q-meta"><span class="q-lab"><b>${esc(pjStepName(p, p.stage))}</b>${pjBallTag(p)}${fin ? '' : `<i>${p.stage + 1}／${PJ_N()}</i>`}</span>${pjTrack(p)}</span>
    <span class="q-age${d > 14 && !fin ? ' hot' : ''}">${fin ? '<span>結案</span>' : `<b>${d === 0 ? '今' : d}</b><span>${d === 0 ? '天有動' : '天沒動'}</span>`}</span>
  </button>`;
}
const pjSort = (a, b) => (a.stage >= PJ_N()) - (b.stage >= PJ_N()) || (pjBall(b) === '我') - (pjBall(a) === '我') || daysSince(b.updated) - daysSince(a.updated);
function renderProjects(){
  if (S.projectId && pjById(S.projectId)) return renderProject(pjById(S.projectId));
  const list = (S.projects || []).slice().sort(pjSort), open = list.filter(p => p.stage < PJ_N()), done = list.filter(p => p.stage >= PJ_N());
  return `<section class="band page"><div class="wrap">
    <div class="cl-head">${ransom('專案','',S.anim)}${B('＋ 新專案','','data-newproj')}</div>
    ${open.length ? `<div class="quests">${open.map(projectRow).join('')}</div>` : '<p class="lead">還沒有進行中的專案。</p>'}
    ${done.length ? `<h3 class="cr-h pj-done-h">已結案<span>${done.length}</span></h3><div class="quests">${done.map(projectRow).join('')}</div>` : ''}
  </div></section>`;
}
function renderProject(p){
  const c = client(p.client), N = PJ_N(), fin = p.stage >= N;

    return `<li class="pf ${st}${s.doc ? ' doc' : ''}"><span class="pf-who">${esc(i === 9 ? '我 → 祐芹姐' : s.who)}</span>
      <button class="pf-box" data-pjstage="${i}" aria-label="${esc(pjStepName(p, i))}${st === 'cur' ? '（目前）' : ''}，點一下推進到這關">
        ${st === 'cur' ? '<em>目前</em>' : ''}<b>${esc(pjStepName(p, i))}</b>${s.doc ? `<small>${esc(s.doc)}</small>` : ''}</button></li>`;
  }).join('');
  const hist = S.items.filter(i => i.case === p.id).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

        <p class="pj-sub">${c ? `<button class="pj-cl" data-client="${c.id}">${esc(c.name)}</button>` : '未指定客戶'}<span>${esc(p.scale)}</span>${p.vendor ? `<span>廠商 ${esc(p.vendor)}</span>` : ''}</p></div>
      <div class="pj-acts">${fin ? '' : B('完成這關 →','',`data-pjnext="${p.id}"`)}${B('記一筆進度','ghost',`data-pjlog="${p.id}"`)}${B('修改','ghost sm',`data-pjedit="${p.id}"`)}</div></header>
    <div class="pj-grid">
      <section class="cd-sec pj-flowsec"><h3 class="cd-h3">流程<span>${fin ? '已結案' : `第 ${p.stage + 1}／${N} 關・${pjBall(p) === '我' ? '換你' : '等' + esc(pjBall(p))}`}</span></h3>
        <ol class="pj-flow">${flow}<li class="pf end${fin ? ' cur' : ''}"><span class="pf-who"></span><span class="pf-box"><b>結案</b></span></li></ol></section>
      <div class="pj-side">${quoteHTML(p)}${docsHTML(p, c)}
        <section class="cd-sec"><h3 class="cd-h3">檔案<span>${(S.files || []).filter(x => x.project === p.id).length} 個</span></h3>${filesHTML((S.files || []).filter(x => x.project === p.id), '收件匣整理進來的檔案會列在這裡')}</section>
        <section class="cd-sec"><h3 class="cd-h3">進度紀錄<span>${hist.length} 筆</span></h3>
          ${hist.length ? `<ul class="plog">${hist.map(h => `<li>${tstamp(h.date.slice(5).replace('-','/') + ' ' + h.time)}<span>${progHTML(h, c)}</span></li>`).join('')}</ul>` : '<p class="cd-none">還沒有進度紀錄</p>'}</section>
      </div>
    </div></div></section>`;
}
/* 報價試算：廠商單價（未稅）×（1＋加成）＝報價單價，四捨五入到元；稅 5% 另計。跟伺服器 quoteCalc_ 同一套 */
function calcQuote(items, markup){
  const m = Number(markup) || 0;
  const rows = items.filter(x => x.n).map(x => { const price = x.p !== '' && x.p != null ? Number(x.p) : Math.round((Number(x.c) || 0) * (1 + m / 100));
    return { n: x.n, q: Number(x.q) || 0, u: x.u || '', c: Number(x.c) || 0, price, amount: price * (Number(x.q) || 0), cost: (Number(x.c) || 0) * (Number(x.q) || 0) }; });
  const net = rows.reduce((s, r) => s + r.amount, 0), cost = rows.reduce((s, r) => s + r.cost, 0), tax = Math.round(net * 0.05);
  return { rows, net, tax, total: net + tax, cost, profit: net - cost };
}
function quoteHTML(p){
  const items = p.items.length ? p.items : [{ n: '', q: 1, u: '式', c: '' }];
  return `<section class="cd-sec pj-quote" id="quote" data-quote="${p.id}"><h3 class="cd-h3">報價試算<span>金額未稅、稅 5% 另計</span></h3>
    <div class="qt-top"><label>廠商<input id="qVendor" value="${esc(p.vendor)}" autocomplete="off"></label><label>加成 %<input id="qMarkup" inputmode="decimal" value="${esc(p.markup === '' ? '' : p.markup)}" autocomplete="off"></label></div>
    <div class="qt-scroll"><table class="qt"><thead><tr><th>品名</th><th>數量</th><th>單位</th><th>廠商單價</th><th>報價金額</th><th><span class="sr">刪除</span></th></tr></thead>
      <tbody id="qBody">${items.map(quoteRow).join('')}</tbody></table></div>
    <button class="qt-add" data-qadd>＋ 加一列</button>
    <dl class="qt-sum" id="qSum"></dl>
    <div class="qt-foot">${B('存檔','',`data-qsave="${p.id}"`)}${B('複製明細，貼進 BCRM','ghost',`data-qcopy="${p.id}"`)}</div></section>`;
}

let stationAt = 0;

    if (!S.station) return;
    S.station.waiting = n;
    document.querySelectorAll('.st-card').forEach(el => { const q = el.querySelector('#fq')?.value || ''; el.outerHTML = stationHTML(); const i = document.getElementById('fq'); if (i && q) i.value = q; });

}
/* 搜尋檔案：直接查畫面上已經有的檔案索引（檔名、類型、資料夾、摘要、關鍵字、客戶與專案名稱），不用等伺服器 */
function searchFilesLocal(q){
  const words = String(q || '').toLowerCase().split(/[\s　]+/).filter(Boolean);
  if (!words.length) return [];
  return (S.files || []).filter(f => {
    const c = client(f.client), p = pjById(f.project);
    const hay = [f.name, f.type, f.folder, f.summary, f.keywords, f.date, c ? [c.name, ...c.alias].join(' ') : '', p ? p.name : ''].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).slice(0, 50);
}
function searchSheet(q){
  const hits = searchFilesLocal(q);
  sheet(`<h3>搜尋「${esc(q)}」</h3><p class="hint">${hits.length ? `找到 ${hits.length} 個檔案` : '沒有符合的檔案'}</p>
    ${hits.length ? `<div class="fls">${hits.map(x => fileRow(Object.assign({}, x, { summary: [x.folder, x.summary].filter(Boolean).join('　') }))).join('')}</div>` : ''}
    <div class="sheet-foot">${B('關閉','ghost sm','data-close')}</div>`);
}
